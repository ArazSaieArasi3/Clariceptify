name: Publish explicit baseline checkpoint

on:
  push:
    branches: [main]
    paths: ['releases/v0.1.0-alpha.2.1/request.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-preview-v0.1.0-alpha.2.1
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'ArazSaieArasi3/Clariceptify' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build and read back the frozen input baseline
        run: python tools/build_baseline_preview.py releases/v0.1.0-alpha.2.1/request.json dist-baseline
      - name: Publish a new immutable prerelease payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refuse to replace its files.'
            exit 1
          fi
          if git rev-parse -q --verify refs/tags/v0.1.0-alpha.2.1 >/dev/null; then
            echo 'Tag already exists; refuse to adopt or move it.'
            exit 1
          fi
          gh release create v0.1.0-alpha.2.1 dist-baseline/* \
            --repo "$GITHUB_REPOSITORY" \
            --target fe347d2e62262f1cd43558d2330438f433f64f1d \
            --title 'v0.1.0-alpha.2.1 — Controlled candidate baseline' \
            --notes-file releases/v0.1.0-alpha.2.1/RELEASE-NOTES.md \
            --prerelease --latest=false
