name: Publish explicit bootstrap checkpoint

on:
  push:
    branches: [main]
    paths: ['releases/v0.1.0-alpha.1/request.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-preview-v0.1.0-alpha.1
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'ArazSaieArasi3/Clariceptify' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build and verify the frozen checkpoint
        run: python tools/build_bootstrap_preview.py releases/v0.1.0-alpha.1/request.json dist-bootstrap
      - name: Publish a new immutable prerelease payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refuse to replace its files.'
            exit 1
          fi
          gh release create v0.1.0-alpha.1 dist-bootstrap/* \
            --repo "$GITHUB_REPOSITORY" \
            --target 223df578777afa38743fa20c8c33ace78a8fbfd6 \
            --title 'v0.1.0-alpha.1 — Contracts and migration preparation' \
            --notes-file releases/v0.1.0-alpha.1/RELEASE-NOTES.md \
            --prerelease --latest=false
