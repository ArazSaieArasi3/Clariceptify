name: Public integrity

on:
  push:
    branches: [main]
    paths:
      - 'model/**'
      - 'requirements/**'
      - 'evidence/**'
      - 'traceability/**'
      - 'evaluation/**'
      - 'docs/**'
      - '.research/**'
      - 'tools/**'
      - '*.md'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - 'releases/**'
      - '.gitignore'
      - 'CITATION.cff'
      - 'LICENSE*'
  pull_request:
    paths:
      - 'model/**'
      - 'requirements/**'
      - 'evidence/**'
      - 'traceability/**'
      - 'evaluation/**'
      - 'docs/**'
      - '.research/**'
      - 'tools/**'
      - '*.md'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - 'releases/**'
      - '.gitignore'
      - 'CITATION.cff'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-docs.txt
      - name: Evaluate current public inputs
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/run_integrity.py --output "$RUNNER_TEMP/clariceptify-integrity"
      - name: Check preparation package boundaries
        run: python tools/test_release_preparation.py
      - name: Check documentation failure boundaries
        run: python tools/test_documentation.py
      - name: Check public Pages readback recovery and failure boundaries
        run: python tools/test_pages_readback.py
      - name: Check related-work evidence boundaries
        run: python tools/test_related_reviews.py
      - name: Check corpus access and archive boundaries
        run: python tools/test_corpus_access.py
      - name: Check deep-review evidence and closure boundaries
        run: python tools/test_deep_reviews.py
      - name: Check DUL catalogue and technical evidence boundaries
        run: |
          python tools/test_dul_class_catalog.py
          python tools/test_dul_technical_review.py
      - name: Check BDI technical evidence and negative-result boundaries
        run: python tools/test_bdi2026_review.py
      - name: Check IOLite shared-catalogue boundaries
        run: python tools/test_iolite_catalog.py
      - name: Check OntoLex document evidence boundaries
        run: python tools/test_ontolex_review.py
      - name: Check SKOS document evidence boundaries
        run: python tools/test_skos_review.py
      - name: Check blocked O4OA technical-evidence boundaries
        run: python tools/test_o4oa_checkpoint.py
      - name: Check Cognitive Atlas coverage and descriptive-unit boundaries
        run: python tools/test_cognitiveatlas_review.py
      - name: Check DnS selected-root coverage and historical-version boundaries
        run: python tools/test_dns235.py
      - name: Check cDnS profile failure and unperformed-execution boundaries
        run: python tools/test_cdns267.py
      - name: Check the four-source comparison batch and model bindings
        run: python tools/check_comparison_batch1.py
      - name: Check the three-source comparison batch and synthesis boundaries
        run: python tools/check_comparison_batch3.py
      - name: Check IAO, Cognitive Atlas and EFO comparison and model bindings
        run: python tools/check_comparison_batch4.py
      - name: Check COM, Representation and CMO comparison and model bindings
        run: python tools/check_comparison_batch5.py
      - name: Check LMM, O4OA and OntoKADS comparison and model bindings
        run: python tools/check_comparison_batch2.py
      - name: Check bounded final gap synthesis and candidate queues
        run: python tools/check_gap_comparison126.py
      - name: Check Conceptualization domain assessment and source bindings
        run: python tools/check_domain_conceptualization92.py
      - name: Check Intentionality domain assessment
        run: python tools/check_domain_intentionality93.py
      - name: Check Cognition domain assessment
        run: python tools/check_domain_cognition94.py
      - name: Check Abstraction domain assessment
        run: python tools/check_domain_abstraction95.py
      - name: Check Semantics domain assessment
        run: python tools/check_domain_semantics96.py
      - name: Check Relations domain assessment
        run: python tools/check_domain_relations97.py
      - name: Check Representation domain assessment
        run: python tools/check_domain_representation98.py
      - name: Check Modeling domain assessment
        run: python tools/check_domain_modeling99.py
      - name: Check Structure domain assessment
        run: python tools/check_domain_structure100.py
      - name: Check Language domain assessment and checker failure boundaries
        run: |
          python tools/check_domain_language101.py
          python tools/test_domain_review_checks.py
          python -O tools/test_domain_review_checks.py
      - name: Check Terminology domain assessment
        run: python tools/check_domain_terminology102.py
      - name: Check Metamodeling domain assessment
        run: python tools/check_domain_metamodeling103.py
      - name: Check Taxonomy domain assessment
        run: python tools/check_domain_taxonomy104.py
      - name: Check Logic domain assessment
        run: python tools/check_domain_logic105.py
      - name: Check Ontology domain assessment
        run: python tools/check_domain_ontology106.py
      - name: Check Metaphysics domain assessment
        run: python tools/check_domain_metaphysics107.py
      - name: Check Knowledge domain assessment
        run: python tools/check_domain_knowledge108.py
      - name: Check Quality domain assessment
        run: python tools/check_domain_quality109.py
      - name: Check Evaluation domain assessment
        run: python tools/check_domain_evaluation110.py
      - name: Check Provenance domain assessment
        run: python tools/check_domain_provenance111.py
      - name: Check I&DA, BDI2020 and DOLCE Mental comparison and model bindings
        run: python tools/check_comparison_batch6.py
      - name: Check COM paper formalism and unavailable machine root
        run: python tools/check_com243.py
      - name: Check Representation supplement and machine-source boundaries
        run: python tools/check_representation244.py
      - name: Check CMO mirror class glossary and original-source boundaries
        run: python tools/check_cmo245.py
      - name: Validate I&DA bounded technical evidence
        run: python tools/check_ida246.py
      - name: Validate BDI2020 bounded paper and technical evidence
        run: python tools/check_bdi2020_247.py
      - name: Validate DOLCE Mental native symbol and isolated-case evidence
        run: python tools/check_dolcemental248.py
      - name: Check IAO selected-root technical census and provenance
        run: python tools/check_iao240.py
      - name: Check EFO paper formalism and unavailable executable root
        run: python tools/check_efo242.py
      - name: Check LMM correspondence and negative-result boundaries
        run: python tools/check_lmm274.py
      - name: Check OntoKADS artifact discovery and paper formula boundaries
        run: python tools/check_ontokads236.py
      - name: Check OntoLex selected-core class and profile boundaries
        run: python tools/check_ontolex237.py
      - name: Check pending source passports and integrity failure boundaries
        run: |
          python tools/check_pending_passports.py --batch 1
          python tools/check_pending_passports.py --batch 2
          python tools/test_pending_passports.py
          python -O tools/test_pending_passports.py
      - name: Check bounded semantic review 114 and integrity failure boundaries
        run: |
          python tools/check_semantic_reviews.py --issue 114
          python tools/test_semantic_review_checks.py
          python -O tools/test_semantic_review_checks.py
      - name: Check bounded semantic review 115
        run: python tools/check_semantic_reviews.py --issue 115
      - name: Check bounded semantic review 116
        run: python tools/check_semantic_reviews.py --issue 116
      - name: Check bounded semantic review 117
        run: python tools/check_semantic_reviews.py --issue 117
      - name: Check bounded semantic review 118
        run: python tools/check_semantic_reviews.py --issue 118
      - name: Check bounded semantic review 119
        run: python tools/check_semantic_reviews.py --issue 119
      - name: Check bounded semantic review 120
        run: python tools/check_semantic_reviews.py --issue 120
      - name: Check bounded semantic review 121
        run: python tools/check_semantic_reviews.py --issue 121
      - name: Check bounded semantic review 122
        run: python tools/check_semantic_reviews.py --issue 122
      - name: Check full-contract CQ review batch 1 and integrity boundaries
        run: |
          python tools/check_cq_reviews.py --batch 1
          python tools/test_cq_review_checks.py
          python -O tools/test_cq_review_checks.py
      - name: Preserve exact input and validator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clariceptify-integrity/
          if-no-files-found: error
          retention-days: 30
