name: Publish conceptual documentation

on:
  workflow_run:
    workflows: [Public integrity]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: clariceptify-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-docs.txt
      - name: Build exact current and frozen documentation
        env:
          DOCUMENTATION_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python tools/build_pages.py --source-ref "$DOCUMENTATION_SOURCE_SHA" --output "$RUNNER_TEMP/clariceptify-pages"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      # The standard Pages upload action excludes every dot-directory. The
      # controlled public reader includes .research and .github source views,
      # so preserve those public paths explicitly inside the supported tar.
      - name: Preserve the complete controlled reader including public dot-paths
        run: tar --dereference --hard-dereference --directory "$RUNNER_TEMP/clariceptify-pages" -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Deploy the verified conceptual portal
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Read back exact public current and frozen reader bytes
        env:
          PUBLIC_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tools/readback_pages.py --build "$RUNNER_TEMP/clariceptify-pages" --url "$PUBLIC_PAGES_URL" --output "$RUNNER_TEMP/publication-receipt/pages-readback.json"
      - name: Preserve actual publication readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-receipt/
          if-no-files-found: warn
          retention-days: 90
