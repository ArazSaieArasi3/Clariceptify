name: Publish accepted R1 baseline

on:
  push:
    branches: [main]
    paths: ['releases/v0.1.0/request.json']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-v0.1.0
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'ArazSaieArasi3/Clariceptify' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: metadata
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact reviewed source
        id: source
        working-directory: metadata
        run: python -c 'import json,os; r=json.load(open("releases/v0.1.0/request.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("sha="+r["source_commit"]+"\nrun="+str(r["source_ci_run_id"])+"\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements-dev.txt
      - name: Retrieve actual source CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-ci.json"
      - name: Rebuild and read back the exact accepted baseline
        run: python source/tools/verify_stable_request.py --metadata metadata --source source --ci-record "$RUNNER_TEMP/source-ci.json" --output "$RUNNER_TEMP/stable-assets"
      - name: Publish an immutable stable baseline from this freeze record
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: metadata
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; refuse replacement.'
            exit 1
          fi
          if git rev-parse -q --verify refs/tags/v0.1.0 >/dev/null; then
            echo 'Tag exists; refuse adoption or movement.'
            exit 1
          fi
          gh release create v0.1.0 "$RUNNER_TEMP/stable-assets/"* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'v0.1.0 - Documented conceptual-model baseline' \
            --notes-file releases/v0.1.0/RELEASE-NOTES.md \
            --latest
      - name: Download and verify the actual public assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/public-readback"
          cd "$RUNNER_TEMP/public-readback"
          sha256sum --check SHA256SUMS
          python "$GITHUB_WORKSPACE/source/tools/readback_release.py" clariceptify-v0.1.0.zip --manifest "$GITHUB_WORKSPACE/metadata/releases/v0.1.0/manifest.yaml" --output "$RUNNER_TEMP/public-readback.json"
      - name: Preserve publication readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-readback.json
            ${{ runner.temp }}/stable-assets/READBACK.json
          if-no-files-found: warn
