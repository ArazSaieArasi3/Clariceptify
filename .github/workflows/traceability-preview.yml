name: Publish explicit traceability checkpoint

on:
  push:
    branches: [main]
    paths: ['releases/v0.1.0-alpha.3/request.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traceability-preview-v0.1.0-alpha.3
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'ArazSaieArasi3/Clariceptify' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Reproduce the actual CI-verified checkpoint
        run: python tools/build_traceability_preview.py releases/v0.1.0-alpha.3/request.json dist-traceability
      - name: Publish without replacing any tag or payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refuse replacement.'
            exit 1
          fi
          if git rev-parse -q --verify refs/tags/v0.1.0-alpha.3 >/dev/null; then
            echo 'Tag already exists; refuse adoption or movement.'
            exit 1
          fi
          gh release create v0.1.0-alpha.3 dist-traceability/* \
            --repo "$GITHUB_REPOSITORY" \
            --target f4a3e233fc283c065a2c48297657878a4625d780 \
            --title 'v0.1.0-alpha.3 — Scoped traceability and public integrity' \
            --notes-file releases/v0.1.0-alpha.3/RELEASE-NOTES.md \
            --prerelease --latest=false
