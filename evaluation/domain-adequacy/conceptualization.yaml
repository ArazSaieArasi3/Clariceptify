findings:
  - id: DOM01-F01
    state: SUPPORTED_STRUCTURAL_COVERAGE
    claim: Nine domain members form a purposeful process, agent role, mental orientation, formation, concept and artifact product with typed cross-domain links.
    evidence_ids: [CLR-C0017, CLR-C0018, CLR-C0019, CLR-C0025, CLR-C0026, CLR-C0027, CLR-C0055, CLR-C0093, CLR-C0130, CLR-R0048, CLR-R0054]
    contrary: A connected graph and correct labels are not a proof of semantic adequacy or native OntoUML validity.
    route: KEEP_DOMAIN_NAME_AND_CANDIDATE_SCOPE
  - id: DOM01-F02
    state: PARTIAL_CQ_COVERAGE
    claim: SC0001 subject-union clause passes one positive and one negative synthetic fixture; six other domain questions have only candidate structural paths and unexecuted CQ contracts.
    evidence_ids: [CLR-SC0001, CQ-02]
    contrary: The selected fixture does not test all branches, multiple agents, temporal decisions or formal entailment.
    route: '#123 for CQ-01..10 and #125 for CQ-26..30'
  - id: DOM01-F03
    state: SUPPORTED_NEED_FOR_FOCUSED_TEST
    claim: Decision, actor and rationale paths exist, while an explicit rejected-alternative and validity-time policy has not been demonstrated in the selected model/fixtures.
    evidence_ids: [CLR-R0036, CLR-R0037, CLR-R0039, CLR-R0052, CLR-SC0020, CQ-26]
    contrary: R0039 already selects or revises an element; do not claim all alternative structure is absent without inspecting source and CQ semantics.
    route: 'LR-07 and #125; if inadequacy is confirmed, disposition in #129'
  - id: DOM01-F04
    state: PARTIAL_BRIDGE
    claim: Perspective links to Viewpoint, and View selects from Artifact; a direct, justified Viewpoint-to-View correspondence has not been established.
    evidence_ids: [CLR-R0008, CLR-R0042, CLR-R0126, CLR-R0171, CQ-04]
    contrary: FR-04 requires an articulated view only where present; absence of a direct edge does not alone prove a model defect.
    route: '#114/#123 for distinction and CQ; if needed #129'
  - id: DOM01-F05
    state: FOUNDATION_AND_PROVENANCE_UNASSESSED
    claim: HistoricalRoleMixin, event, mode and information-object typing is preserved from input; passage support for nine concepts was not reverified in import, and native stereotype validity remains unassessed.
    evidence_ids: [CLR-C0027, CLR-C0055, CLR-C0093, CLR-C0130, CLR-G0025]
    contrary: A support B or D grade records prior screening, not an approved exact definition or an invalid typing.
    route: '#121/#122 foundational review and #129 only after evidence'
