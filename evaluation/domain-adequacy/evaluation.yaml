constraint_review:
  CLR-SC0010: Creation and revision. Creation identifies actual origination of a new individual; produces or revises
    does not assert origination. Each Conceptual Artifact in this scope has one originating Conceptualization. Each
    Evaluation Result has one creating evaluation.
  CLR-SC0018: Atomic evaluation result. Each Evaluation Result concerns exactly one artifact and one criterion,
    both included in its creating evaluation. Multiple criteria produce multiple findings. Its information content
    records a judgment such as satisfied, not satisfied or undetermined and the rationale for it.
  CLR-SC0019: Review alignment. A Structural Review examines structures belonging to its assessed artifacts. Any
    examined Conceptual Model encodes an assessed artifact. Criterion goals must be relevant to the artifact conceptualization
    goals.
  CLR-SC0021: Justification and evidence. Every Justification supports at least one Conceptual Decision or Evaluation
    Result. Every Evidence role instance is cited by at least one justification or result. Source attribution identifies
    provenance and does not establish evidential truth.
