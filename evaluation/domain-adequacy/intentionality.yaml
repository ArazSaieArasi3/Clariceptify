    evidence_ids: [CLR-C0128, CLR-R0169, CLR-R0170, CLR-G0113]
    contrary: 'Selected paths do not assess the whole Evaluation domain or measure semantic quality.'
    route: '#109/#110 and #125'
  - id: DOM02-F04
