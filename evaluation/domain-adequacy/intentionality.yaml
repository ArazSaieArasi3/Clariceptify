    state: SELECTED_STRUCTURE_AND_ALIGNMENT
    claim: 'The model distinguishes agent-borne Intention, Goal content and episode; one positive/adverse synthetic join tests the SC0003 participation condition.'
    evidence_ids: [CLR-C0061, CLR-C0054, CLR-R0007, CLR-R0051, CLR-R0089, CLR-R0054, CLR-SC0003]
    contrary: 'A selected join is not complete constraint enforcement, native OntoUML validity, full CQ-03 execution or proof of intention satisfaction.'
