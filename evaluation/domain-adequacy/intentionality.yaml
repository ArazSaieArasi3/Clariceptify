    contracts: [FR-03, CQ-03]
    model_ids: [CLR-C0004, CLR-C0026, CLR-C0054, CLR-C0061, CLR-C0129]
    relation_ids: [CLR-R0007, CLR-R0051, CLR-R0089, CLR-R0081, CLR-R0054]
