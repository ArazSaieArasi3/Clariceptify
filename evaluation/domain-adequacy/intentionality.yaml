    purpose: Distinguish a declared Value used in Valuation from an Evaluation Criterion and an observed assessment result.
    contracts: [FR-24, CQ-24]
    model_ids: [CLR-C0019, CLR-C0039, CLR-C0040, CLR-C0054, CLR-C0128, CLR-C0129]
    relation_ids: [CLR-R0169, CLR-R0170, CLR-R0081, CLR-R0061, CLR-R0065]
    constraint_ids: [CLR-SC0017]
    outcome: PARTIAL_CRITERION_BRIDGE_AND_RESULT_UNASSESSED
    evidence: 'R0169/R0170 bind Valuation to Artifact and Value; R0061 binds Evaluation Criterion to Goal, while R0065 judges against that Criterion. No asserted identity or explicit bridge between Value and Evaluation Criterion is in the selected paths; CQ-24 has not been executed.'
