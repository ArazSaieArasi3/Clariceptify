    purpose: Link a recorded conceptual decision to the episode, responsible agent, goal and rationale without inferring goal satisfaction.
    contracts: [FR-26, CQ-26]
    model_ids: [CLR-C0021, CLR-C0026, CLR-C0027, CLR-C0054, CLR-C0065]
    relation_ids: [CLR-R0052, CLR-R0037, CLR-R0040, CLR-R0036, CLR-R0054]
