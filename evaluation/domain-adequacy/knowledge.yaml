constraint_review:
  CLR-SC0011: Moment identity. Each mode or quality has exactly one bearer through characterization, directly or
    by inheritance. Distinct Understandability or Semantic Interoperability instances may depend on different interpreters
    or counterpart representations.
  CLR-SC0012: Shared understanding. Shared Understanding specializes State. Its Understanding bearers are at least
    two distinct participating agents; their understandings are compatible about the stated shared artifact. Its
    configured objects include those agents.
  CLR-SC0023: Identity and metalevel. Do not identify a Concept with its described Type, an Instance description
    with its referent, or a Model with its Model Kind. Information Object identity follows a declared content-equivalence
    policy, not the identity of a physical file.
