  CLR-SC0015: Logical use. A Formula uses a language whose formal syntax and semantics are declared. Axioms are
    accepted formulas within named Conceptual Artifacts. A Constraint applies to an artifact or at least one element;
    referenced elements belong to the relevant artifact scope.
  CLR-SC0022: Contextual roles. Each Source is an Agent or Information Object cited or attributed in at least one
    recorded context. Assumption is an Information Object adopted in at least one artifact; Axiom is a Formula accepted
    in at least one artifact. Roles can vary across contexts.
  CLR-SC0010: Creation and revision. Creation identifies actual origination of a new individual; produces or revises
    does not assert origination. Each Conceptual Artifact in this scope has one originating Conceptualization. Each
    Evaluation Result has one creating evaluation.
