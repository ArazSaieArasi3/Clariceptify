- id: CLR-C0071
  label: Metamodel
  stereotype: "\xABsubkind\xBB"
  definition: A model specifying the constructs, relationships and well-formedness conditions to which a family
    of models conforms.
  source_support: D
  source_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#table-2/data-row-71
  support_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#table-8/data-row-71
  source_passages: '[38] specification; [18] ch. 3 description'
  state: STRUCTURAL_PATH_PRESENT_SEMANTIC_APPROVAL_PENDING
  finding: Metamodel is a subkind of Model (G0064), prescribing constructs, relationships and well-formedness conditions.
    Imported D support refs18/38; a declared conformance edge does not execute those conditions.
- id: CLR-C0072
  label: Metamodeling
  stereotype: "\xABevent\xBB"
  definition: A modeling process that constructs or revises a specification of the constructs and admissible structures
    of models.
  source_support: D
  source_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#table-2/data-row-72
  support_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#table-8/data-row-72
  source_passages: '[38] specification; [18] ch. 3 description'
  state: STRUCTURAL_PATH_PRESENT_SEMANTIC_APPROVAL_PENDING
  finding: Metamodeling is an event specializing Modeling (G0065), producing or revising a metamodel. Imported D
    refs18/38; production/revision identity is not settled by R0104.
- id: CLR-C0075
  label: Model of Models
  stereotype: "\xABsubkind\xBB"
  definition: A model whose subject includes other models and their relationships; unlike a metamodel, it need not
    prescribe their admissible form.
  source_support: B
  source_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#table-2/data-row-75
  support_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#table-8/data-row-76
  source_passages: '[38] metamodel infrastructure; [3] higher-order types'
  state: STRUCTURAL_PATH_PRESENT_SEMANTIC_APPROVAL_PENDING
  finding: Model of Models is a Model subkind (G0068), describing models and their relationships without necessarily
    prescribing admissible form. Imported B refs3/38; neither equivalence to nor disjointness from Metamodel follows.
- id: CLR-C0080
  label: Multi-Level Modeling
  stereotype: "\xABevent\xBB"
  definition: A modeling process that relates multiple classification levels and makes the type-instance distinctions
    between those levels explicit.
  source_support: D
