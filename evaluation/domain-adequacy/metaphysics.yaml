  state: STRUCTURAL_PATH_PRESENT_SEMANTIC_APPROVAL_PENDING
  finding: 'State is typed situation: configuration of entities/properties/relations under conditions. Imported
    B refs11/35; source treatment includes non-obtaining states, wider than an actual-situation reading.'
- id: CLR-C0123
  label: Time
  stereotype: "\xABabstract\xBB"
  definition: A temporal position or extent used to locate or order occurrences. In this model the label ranges
