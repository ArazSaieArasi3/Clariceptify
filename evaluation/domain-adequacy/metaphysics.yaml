constraint_review:
  CLR-SC0013: 'Change and time. Each modeled Change is atomic relative to the chosen granularity: its prior and
    resulting State differ in at least one relevant feature and concern the affected objects. Time supplies a declared
    ordering/extent convention; the states and event extents must respect the transition.'
  CLR-SC0014: Temporal representation. The temporal entities denoted by a Time Representation agree with the extents
    of the events it represents. Point-Based Time Representation denotes instants and Interval-Based Time Representation
    denotes intervals. Their detailed temporal axioms are deferred.
  CLR-SC0002: Instance referent. Each Instance description denotes exactly one referent across Object, Event, State
    and Time. These referent branches are exclusive in this scope.
