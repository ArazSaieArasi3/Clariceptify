  source_passages: '[11] sec. 3; [10] abstract; [33] persistence topics'
  state: STRUCTURAL_PATH_PRESENT_SEMANTIC_APPROVAL_PENDING
  finding: Change is an Event specialization (G0011), passage of a subject between states with an explicitly relevant
    difference. Imported B refs10/11/33; distinct state identifiers alone do not establish change.
- id: CLR-C0112
  label: State
  stereotype: "\xABsituation\xBB"
  definition: A configuration of entities and their properties or relations that holds under specified conditions
    and can serve as a subject or precondition of change.
  source_support: B
  source_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#table-2/data-row-112
