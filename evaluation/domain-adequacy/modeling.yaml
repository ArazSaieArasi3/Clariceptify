findings:
  - {id: DOM08-F01, state: SELECTED_MODEL_VIEW_ALIGNMENT, claim: 'Modeling, its resulting Model, and a view of that same Model can be joined in the selected synthetic path; a view of another model yields no selected answer.', evidence_ids: [CLR-R0110, CLR-R0109, CLR-R0108, CLR-R0140, CQ-17], contrary: 'A selected join is not full CQ-17 execution, actual creation, source approval or semantic adequacy; the adverse record may legitimately describe another model.', route: '#124'}
  - {id: DOM08-F02, state: IN_MODEL_SOURCE_PENDING, claim: 'Nine of seventeen primary Modeling concepts retain in-model P support and require exact source passage review.', evidence_ids: [CLR-C0005, CLR-C0011, CLR-C0035, CLR-C0038, CLR-C0076, CLR-C0079, CLR-C0098, CLR-C0111, CLR-C0131], contrary: 'P means qualified support pending exact passages, not absent concepts or unsupported classes; none is silently removed.', route: '#112/#113'}
  - {id: DOM08-F03, state: METALEVEL_CONFORMANCE_UNASSESSED, claim: 'Model Kind, Model and Metamodel have distinct IDs and declaration paths, but rule-level conformance is not executed.', evidence_ids: [CLR-C0073, CLR-C0074, CLR-C0071, CLR-R0105, CLR-R0106, CLR-SC0023, CLR-SC0024], contrary: 'A recorded conformance link is not evidence that constructs satisfy metamodel rules; no correction is established yet.', route: '#124 and #129 if confirmed'}
  - {id: DOM08-F04, state: PERSPECTIVE_VIEWPOINT_ALIGNMENT_UNASSESSED, claim: 'Mental Perspective, Viewpoint specification and Model View have separate paths without a tested bearer/episode alignment.', evidence_ids: [CLR-C0093, CLR-C0131, CLR-C0076, CLR-R0126, CLR-R0108, CQ-04], contrary: 'Sharing a label or having a view edge does not establish identity or the intended perspective of a particular agent.', route: '#123 and #129 if confirmed'}
  - {id: DOM08-F05, state: CREATION_REVISION_AND_SPECIALIZATION_PENDING, claim: 'Produces-or-revises paths and several model specializations exist; neither a new artifact identity nor whole-discipline scope follows.', evidence_ids: [CLR-C0024, CLR-C0077, CLR-C0035, CLR-R0041, CLR-R0110, CLR-SC0010, CQ-30], contrary: 'Do not infer a new domain, partition, disjointness or creation merely from class names and product edges.', route: '#125 and #129 if confirmed'}
