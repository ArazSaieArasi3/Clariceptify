domain_questions:
  - id: DQ01
    purpose: Distinguish a mental Perspective adopted in an episode from its articulated Viewpoint and a Model View.
    contracts: [FR-04, CQ-04]
    model_ids: [CLR-C0093, CLR-C0131, CLR-C0076, CLR-C0026, CLR-C0004]
    relation_ids: [CLR-R0126, CLR-R0108, CLR-R0109]
    constraint_ids: []
    outcome: STRUCTURAL_PERSPECTIVE_VIEW_PATH_BEARER_ALIGNMENT_UNEXECUTED
    evidence: 'R0126 expresses Perspective by Viewpoint and R0108 scopes a Model View; identical labels do not make a mental mode identical to an information object. CQ-04 remains uncomputed.'
  - id: DQ02
    purpose: Trace a Modeling activity to its model, the Model View of that same model, its Viewpoint and the encoded Artifact.
    contracts: [FR-17, CQ-17]
    model_ids: [CLR-C0077, CLR-C0073, CLR-C0023, CLR-C0076, CLR-C0131, CLR-C0019]
    relation_ids: [CLR-R0110, CLR-R0109, CLR-R0108, CLR-R0140]
    constraint_ids: []
    outcome: SELECTED_ACTIVITY_MODEL_VIEW_JOIN_PASS_FULL_CQ_PENDING
    evidence: 'The positive synthetic fixture joins the produced model and its view; an adverse view points only to another model. This tests a selected answer path, not a full CQ-17 answer or the imported optional model-type support.'
  - id: DQ03
    purpose: Retrieve a declared Model Kind and model-to-Metamodel conformity while separating the kind, artifact and verified rule satisfaction.
    contracts: [FR-18, CQ-18]
    model_ids: [CLR-C0073, CLR-C0074, CLR-C0071, CLR-C0125]
    relation_ids: [CLR-R0105, CLR-R0106]
    constraint_ids: [CLR-SC0023, CLR-SC0024]
    outcome: STRUCTURAL_KIND_CONFORMANCE_PATH_RULES_UNEXECUTED
    evidence: 'The two links are recorded; SC0023 identity and SC0024 rule satisfaction remain textual and unexecuted.'
  - id: DQ04
    purpose: Distinguish model creation from revision and verify subprocess composition where stated.
    contracts: [FR-30, CQ-30]
    model_ids: [CLR-C0024, CLR-C0077, CLR-C0023, CLR-C0073, CLR-C0025]
    relation_ids: [CLR-R0041, CLR-R0110]
    constraint_ids: [CLR-SC0010, CLR-SC0009]
    outcome: PRODUCES_OR_REVISES_NOT_CREATION_AND_COMPOSITION_UNEXECUTED
    evidence: 'R0041/R0110 say produces or revises; neither actual new-individual identity nor acyclic subprocess structure is established.'
