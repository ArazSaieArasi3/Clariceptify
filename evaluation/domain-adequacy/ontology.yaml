constraint_review:
  CLR-SC0016: Commitment alignment. The vocabulary and element descriptions linked by an Ontological Commitment
    belong to its adopted artifact scope. Existing Term designations and Relation endpoints must agree with the
    commitment; it is not a second conflicting interpretation.
  CLR-SC0023: Identity and metalevel. Do not identify a Concept with its described Type, an Instance description
    with its referent, or a Model with its Model Kind. Information Object identity follows a declared content-equivalence
    policy, not the identity of a physical file.
