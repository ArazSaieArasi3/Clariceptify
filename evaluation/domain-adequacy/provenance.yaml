constraint_review:
  CLR-SC0003: Agent alignment. The bearers of the Intention and Perspective adopted by a Conceptualization participate
    in that episode. A Conceptual Decision is made by agents participating in its recording episode.
  CLR-SC0020: Decision alignment. A Conceptual Decision concerns artifacts produced by its recording Conceptualization;
    selected elements belong to those artifacts. A decision responding to a finding concerns that finding target
    or an explicitly documented revision of it.
  CLR-SC0021: Justification and evidence. Every Justification supports at least one Conceptual Decision or Evaluation
    Result. Every Evidence role instance is cited by at least one justification or result. Source attribution identifies
    provenance and does not establish evidential truth.
  CLR-SC0022: Contextual roles. Each Source is an Agent or Information Object cited or attributed in at least one
    recorded context. Assumption is an Information Object adopted in at least one artifact; Axiom is a Formula accepted
    in at least one artifact. Roles can vary across contexts.
