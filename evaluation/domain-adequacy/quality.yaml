constraint_review:
  CLR-SC0017: Criterion interpretation. The five Quality classes denote criterion specifications specializing Evaluation
    Criterion. They are not measured bearer qualities or evaluation findings. Criteria are scoped by Goal; Semantic
    Completeness is relative to those goals and the agreed subject coverage.
  CLR-SC0019: Review alignment. A Structural Review examines structures belonging to its assessed artifacts. Any
    examined Conceptual Model encodes an assessed artifact. Criterion goals must be relevant to the artifact conceptualization
    goals.
