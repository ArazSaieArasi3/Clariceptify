constraint_review:
  CLR-SC0005: Description endpoints. The specific and general concepts of a Generalization equal its source and
    target elements. The Instance and Concept endpoints of an Instantiation equal its source and target. Part and
    Whole endpoints similarly refine those of Part-Whole Relation.
  CLR-SC0006: Classification alignment. Every Instantiation recorded by a Classification links one of its classified
    Instance descriptions to one of its assigned Concept categories. Each stated classification assignment is represented
    by such a link.
  CLR-SC0007: Structure alignment. Taxonomy categories are among its organized elements. Its hierarchical links
    are among its specified connections, and both endpoints belong to its categories. Generalization descriptions
    form an acyclic hierarchy.
  CLR-SC0023: Identity and metalevel. Do not identify a Concept with its described Type, an Instance description
    with its referent, or a Model with its Model Kind. Information Object identity follows a declared content-equivalence
    policy, not the identity of a physical file.
