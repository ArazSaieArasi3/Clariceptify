constraint_review:
  CLR-SC0010: Creation and revision. Creation identifies actual origination of a new individual; produces or revises
    does not assert origination. Each Conceptual Artifact in this scope has one originating Conceptualization. Each
    Evaluation Result has one creating evaluation.
  CLR-SC0016: Commitment alignment. The vocabulary and element descriptions linked by an Ontological Commitment
    belong to its adopted artifact scope. Existing Term designations and Relation endpoints must agree with the
    commitment; it is not a second conflicting interpretation.
  CLR-SC0023: Identity and metalevel. Do not identify a Concept with its described Type, an Instance description
    with its referent, or a Model with its Model Kind. Information Object identity follows a declared content-equivalence
    policy, not the identity of a physical file.
  CLR-SC0024: Content-level conformance. A model conforms to a metamodel only if its constructs satisfy that metamodel
    rules. A stated conformity link is not itself proof. No disjointness or exhaustive partition is inferred merely
    from two different class names.
