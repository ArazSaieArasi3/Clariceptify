claim_ceiling: A selected conceptual episode and one textual-constraint check, not
  whole-model conformance, formal reasoning, CQ execution, empirical validation or
  human approval.
id: CLR-FIX-POS-001
title: A fictional inspection conceptualization episode
scenario: A fictional analyst conceptualizes an equipment inspection from a workflow-coordination
  perspective. The analyst has a mental intention with an explicit goal; the episode
  creates a conceptual artifact containing a concept describing an event type. The
  real-world subject, its category and the descriptive concept remain distinct. This
  selected slice omits unrelated parts of the model and is not a complete instance
  model.
