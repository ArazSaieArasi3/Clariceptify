state_contract:
  result_states:
  - PASS
  - FAIL
  - BLOCKED
  - NOT_ASSESSED
  - NOT_APPLICABLE
  finding_states:
  - OPEN
  - IN_PROGRESS
  - RESOLVED
  - DEFERRED
  - ACCEPTED_LIMITATION
  rules:
  - PASS requires an actual bounded check and inspectable input-bound evidence.
  - NOT_ASSESSED means no assessment was performed; BLOCKED means a declared prerequisite prevents the
    check or release gate.
  - Author, simulated, agent-assisted, machine and independent-expert reviews are distinct.
  - Changing reviewed inputs invalidates applicability; retain the old result and create a new input-bound
    review.
  - Closing an assessment does not resolve its findings. A resolved finding needs resolution evidence.
  - Only an actual owner decision or recorded delegation can establish owner acceptance; elapsed time
    or a machine PASS cannot.
