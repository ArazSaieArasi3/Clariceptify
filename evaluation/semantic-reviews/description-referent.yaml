bounded_commitment: A Concept is a description of a Type, an Instance is a description of a particular,
  and an Instantiation is a relation description. These do not automatically assert the world-level classification
  they describe.
findings:
- id: SEM116-F01
  title: Exclusive referent union is stronger than individual edges
  observation: R0083–R0086 each allow0..1 target. SC0002 requires exactly one across Object/Event/State/Time,
    exclusively. Four separate optional bounds do not enforce the combined requirement.
  model_ids:
  - CLR-C0059
  - CLR-R0083
  - CLR-R0084
  - CLR-R0085
  - CLR-R0086
  - CLR-SC0002
  source_ids:
  - SEP-CONCEPTS
  status: OPEN_REVIEW_FINDING_NOT_MODEL_DEFECT_PROOF
  route: '#129 joint owner decision'
  proposal_not_applied: Test empty-union and multi-branch negatives; separately decide whether fictional/unresolved
    referents are intentionally outside scope. Do not invent an object to satisfy cardinality.
  research_draft_id: SEM116-F01
  decision_gate: unapproved_joint_user_decision_129
  implementation: none; approved independent changes require bounded follow-up issues with AC/NAC
- id: SEM116-F02
  title: Described assignment does not entail actual instantiation
  observation: R0087/R0088 each select exactly one description endpoint, and SC0005/6 align records. Concept
    R0026 describes at most one Type and may have none. A classification assertion can therefore exist
    without a mapped world type, and can be mistaken.
  model_ids:
  - CLR-C0060
  - CLR-R0026
  - CLR-R0087
  - CLR-R0088
  - CLR-SC0005
  - CLR-SC0006
  source_ids:
  - UFO-ODE2008
  - SEP-CONCEPTS
  status: OPEN_REVIEW_FINDING_NOT_MODEL_DEFECT_PROOF
  route: '#129 joint owner decision'
  proposal_not_applied: Keep reported/described classification separate from accepted world-level typing;
    add explicit evaluation status only if owner approves.
  research_draft_id: SEM116-F02
  decision_gate: unapproved_joint_user_decision_129
  implementation: none; approved independent changes require bounded follow-up issues with AC/NAC
- id: SEM116-F03
  title: Type-token is not an automatic universal mapping
  observation: C0059 is a description rather than the particular itself; C0125 is Type. R0106 connects
    class Model C0073 and Model Kind C0074 with a specialized instantiation stereotype whose selected
    profile/metalevel interpretation is not declared in the imported registry. Do not assume this is an
    ordinary individual-artifact edge. Source terminology alone does not justify class equivalence or
    inferred partitions.
  model_ids:
  - CLR-C0059
  - CLR-C0125
  - CLR-C0073
  - CLR-C0074
  - CLR-R0106
  - CLR-SC0023
  - CLR-SC0024
  source_ids:
  - SEP-TYPES2026
  - UFO-ODE2008
  status: OPEN_REVIEW_FINDING_NOT_MODEL_DEFECT_PROOF
  route: '#129 joint owner decision'
  proposal_not_applied: Keep metalevel and type-token correspondences qualified; assess chosen instantiation
    semantics under#120/#129 before any mapping decision.
  research_draft_id: SEM116-F03
  decision_gate: unapproved_joint_user_decision_129
  implementation: none; approved independent changes require bounded follow-up issues with AC/NAC
case_review:
  positive: Instance description d denotes one inspection event e by R0084; Instantiation record i connects
    d to Concept c; c optionally describes Type t. The description d, event e, record i, Concept c and
    Type t remain distinct.
  counterexamples:
  - 'Description d points to both an Object and Event: each local0..1 bound can hold while exclusive-union
    SC0002 fails.'
  - 'A meaningful fictional-character description has no real referent: it may be outside present SC0002
    scope, not necessarily meaningless.'
  - An erroneous classification record is mistaken for proof that its referent instantiates the described
    type.
  checks_recommended:
  - SC0002 union/exclusivity tests without turning unknown evidence into nonexistent referents
  - SC0005 Instantiation-specific endpoint checks, not only existing Generalization fixture
  - SC0006 alignment tests plus a mistaken-classification scenario; graph retrieval is not truth validation
  case_scope: An empty referent-union probe is a complete finite-fixture cardinality failure, not a claim
    that a real referent does not exist under missing information. Classification content is not truth
    proof.
  method: Manual conceptual inspection; examples are focal scenarios, not proven complete valid instances;
    absent information is not falsity. Local executable predicates, where supplied, test only declared
    finite rules.
scope_boundaries:
- No source definition automatically validates imported stereotypes.
- No creation of new classes, identities, relations or constraints.
- A completed negative/uncertain review does not resolve its findings.
- Frozen constraint execution_status values remain unchanged; local probes are separate evidence.
- 'Research proposals and philosophical alternatives await #129 joint decision.'
verification:
  command: python tools/check_semantic_reviews.py --issue 116
  result_location: Exact PR and Public integrity run
  limits: Integrity and selected local predicates only; no human expert acceptance or complete formal
    model proof.
