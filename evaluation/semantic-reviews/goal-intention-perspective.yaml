case_review:
  countercases:
  - id: 117-EX1
    setup: Alice and Bob each commit to reducing ambiguity and share one informational Goal content; sharing
      a physical file alone is not the identity premise.
    expected_by_read_model: Two intention individuals, each one bearer, same goal content permissible.
      One intention with two bearers violates R0007/SC11.
    affected_ids:
    - CLR-C0061
    - CLR-C0054
    - CLR-R0007
    - CLR-R0089
    - CLR-SC0011
    status: conceptual_countercase_not_executed_as_formal_solver_test
  - id: 117-EX2
    setup: Alice values cleaner definitions but has not committed to act.
    expected_by_read_model: Desire/desired result alone insufficient for defined Intention; no fabricated
      intention should be inserted.
    affected_ids:
    - CLR-C0061
    status: conceptual_countercase_not_executed_as_formal_solver_test
  - id: 117-EX3
    setup: Alice intends to model next week but no episode has started.
    expected_by_read_model: Permitted by0..* episode end R0051; not evidence goal accomplished.
    affected_ids:
    - CLR-R0051
    status: conceptual_countercase_not_executed_as_formal_solver_test
  - id: 117-EX4
    setup: A Conceptualization episode C0026 adopts Bob's Perspective, but Bob does not participate in
      that episode. Physical co-location is not the participation criterion.
    expected_by_read_model: SC0003 disallows even if endpoint counts satisfy R0042.
    affected_ids:
    - CLR-R0042
    - CLR-SC0003
    - CLR-C0026
    - CLR-C0093
    status: conceptual_countercase_not_executed_as_formal_solver_test
  - id: 117-EX5
    setup: A goal template is stored without any current intention.
    expected_by_read_model: R0089 permits zero linked intentions; decide whether hypothetical/archived
      goal content fits definition rather than automatically reject.
    affected_ids:
    - CLR-C0054
    - CLR-R0089
    status: conceptual_countercase_not_executed_as_formal_solver_test
  cardinality_review:
  - 'R0007/R0008: each intention/perspective has exactly1 agent; agent may bear0..*. This is bearer identity,
    not an assertion each agent always intends something.'
  - 'R0089: each intention has1..* goal contents; each goal may have0..* intentions. Multiple agents can
    use common content without sharing one mode.'
  - 'R0042/R0051: each conceptualization adopts1..* perspectives and is motivated by1..* intentions; each
    mode may feature in0..* episodes. SC0003 requires each selected bearer participate.'
  - 'R0126: perspective and viewpoint related0..* each way; an unexpressed perspective is permitted, viewpoint
    text is not the mental orientation.'
