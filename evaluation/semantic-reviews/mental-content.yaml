  - SEP-MENTAL
  status: OPEN_REVIEW_FINDING_NOT_MODEL_DEFECT_PROOF
  route: '#129 joint owner decision'
  proposal_not_applied: Add bounded distinct-bearer and compatibility-policy checks only after identity/compatibility
    interpretation agreed; do not label shared understanding a relator.
  research_draft_id: SEM114-F02
  decision_gate: unapproved_joint_user_decision_129
  implementation: none; approved independent changes require bounded follow-up issues with AC/NAC
- id: SEM114-F03
  title: Expression does not certify understanding
  observation: R0071 assigns one Language per Expression; R0090 connects Interpretation state to1..* Semantic
    Information and R0144 connects that content to1..* Representations. These paths do not certify truth
    or another recipient state.
  model_ids:
