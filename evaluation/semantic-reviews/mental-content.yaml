bounded_commitment: Treat agent-borne mental states, repeatable articulated information and linguistic
  expressions as distinct modeling roles; do not assume shared content implies shared state identity or
  expression implies actual understanding.
findings:
- id: SEM114-F01
  title: Explicit local sense of Concept
  observation: C0017 describes a type/category; C0055 is an agent-dependent mode and R0082 externalizes
    it into an artifact. This separates entities but does not settle what philosophers mean by concept.
  model_ids:
  - CLR-C0017
  - CLR-C0055
  - CLR-R0006
  - CLR-R0082
  source_ids:
  - SEP-CONCEPTS
  - SEP-MENTAL
  status: OPEN_REVIEW_FINDING_NOT_MODEL_DEFECT_PROOF
  route: '#129 joint owner decision'
  proposal_not_applied: Retain bounded description reading; document philosophical alternatives and ask
    owner whether terminology clarification is necessary, not automatic rename.
  research_draft_id: SEM114-F01
  decision_gate: unapproved_joint_user_decision_129
  implementation: none; approved independent changes require bounded follow-up issues with AC/NAC
- id: SEM114-F02
  title: Bearer identity versus shared content
  observation: R0006/R0009 source multiplicity1 and SC0011 require individual bearers. R0149/R0150 require2..*
    participants/states, but cardinalities alone do not enforce distinct aligned bearers or compatible
    content under SC0012.
  model_ids:
  - CLR-R0006
  - CLR-R0009
  - CLR-R0149
  - CLR-R0150
  - CLR-SC0011
  - CLR-SC0012
  source_ids:
