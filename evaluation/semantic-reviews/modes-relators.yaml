bounded_commitment: Distinguish a mode bearer from external dependence targets and from a relator mediating
  materially related individuals; do not reify every relation as a relator.
findings:
- id: SEM122-F01
  title: Eight mode bearer paths observed
  observation: Awareness,Consciousness,Idea,Intention,Perspective,Understanding use R0004–R0009 with Agent
    bearer end1; Understandability and Semantic Interoperability use R0137/R0138 with Representation bearer
    end1. SC0011 imposes one bearer. Insight and Interpretation inherit Understanding path through G0053/G0056.
    This is static structural support only.
