case_review:
  positive: One Conceptualization episode originates Conceptual Artifact a through R0048. A distinct Model
    m encodes a through inherited R0140 (Model specializes Representation). A later Modeling process produces
    or revises m through R0110; that edge alone does not assert revision or a second origin of artifact
    a. Episode, artifact and representation remain distinct.
  counterexamples:
  - Treat an unchanged export file as a newly originated information object solely because its filename
    differs.
  - Assert two creating conceptualizations for the same artifact identity.
  - 'Interpretation process updates an existing state yet every R0094 target is asserted newly originated:
    first establish whether a new state individual exists.'
  checks_recommended:
  - Compare creation-stereotyped and produces-or-revises relations exactly
  - Test single-origin counts independently from content-equivalence policy
  - Test subprocess cycle/irreflexivity separately from process identity; SC0009 textual status remains
    not_executed until actual check
  qa_corrections:
  - Do not treat Model C0073 as Conceptual Artifact C0019; Model inherits Representation C0101 then Information
    Object, not Artifact. Distinguish encoded artifact and model representation.
  method: Manual conceptual inspection; examples are focal scenarios, not proven complete valid instances;
    absent information is not falsity. Local executable predicates, where supplied, test only declared
    finite rules.
