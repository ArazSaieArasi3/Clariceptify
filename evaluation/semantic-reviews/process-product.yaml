  model/constraints.yaml:
  - id: CLR-SC0008
    text: No fabricated composition. Includes element, has subprocess and part-whole descriptions do not
      imply UML composition or a specific UFO mereological relation. Any later componentOf or memberOf
      use must independently satisfy its semantics.
    referenced_ids: []
    enforcement: textual
    execution_status: not_executed
    lifecycle: candidate
    introduced_version: input-r1-rev1
    source_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#section-6/constraint-8
    notes: Referenced IDs are case-sensitive lexical mention candidates only; completeness and contextual
      interpretation require review. Text is preserved without translation or formalization.
  - id: CLR-SC0009
    text: Subprocess structure. The has subprocess relation is acyclic and irreflexive; a process is not
      its own subprocess. Temporal containment must hold for an actual subprocess.
    referenced_ids: []
    enforcement: textual
    execution_status: not_executed
    lifecycle: candidate
    introduced_version: input-r1-rev1
    source_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#section-6/constraint-9
    notes: Referenced IDs are case-sensitive lexical mention candidates only; completeness and contextual
      interpretation require review. Text is preserved without translation or formalization.
  - id: CLR-SC0010
    text: Creation and revision. Creation identifies actual origination of a new individual; produces
      or revises does not assert origination. Each Conceptual Artifact in this scope has one originating
      Conceptualization. Each Evaluation Result has one creating evaluation.
    referenced_ids:
    - CLR-C0019
    - CLR-C0026
    - CLR-C0040
    enforcement: textual
    execution_status: not_executed
    lifecycle: candidate
    introduced_version: input-r1-rev1
    source_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#section-6/constraint-10
    notes: Referenced IDs are case-sensitive lexical mention candidates only; completeness and contextual
      interpretation require review. Text is preserved without translation or formalization.
  - id: CLR-SC0013
    text: 'Change and time. Each modeled Change is atomic relative to the chosen granularity: its prior
      and resulting State differ in at least one relevant feature and concern the affected objects. Time
      supplies a declared ordering/extent convention; the states and event extents must respect the transition.'
    referenced_ids:
    - CLR-C0013
    - CLR-C0112
    - CLR-C0123
    enforcement: textual
    execution_status: not_executed
    lifecycle: candidate
    introduced_version: input-r1-rev1
    source_locator: SRC-SPEC@sha256:c0a1f1aabb878800ee8485e13a0aa5130320c54c435fa19ea32114139cdc6d4e#section-6/constraint-13
    notes: Referenced IDs are case-sensitive lexical mention candidates only; completeness and contextual
      interpretation require review. Text is preserved without translation or formalization.
  - id: CLR-SC0020
    text: Decision alignment. A Conceptual Decision concerns artifacts produced by its recording Conceptualization;
      selected elements belong to those artifacts. A decision responding to a finding concerns that finding
