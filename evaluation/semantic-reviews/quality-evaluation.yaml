bounded_commitment: 'SC17 explicitly treats five Quality classes as criterion specifications, not measured
  qualities or findings. SC18 makes one Evaluation Result one artifact/criterion judgment with rationale;
  multiple criteria need multiple results. Evaluation is an event, result an information object. No separate
  Finding class exists: finding is content of Evaluation Result.'
