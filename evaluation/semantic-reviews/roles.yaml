case_review:
  examples:
    positive: One formula is an accepted Axiom in theoryA but not theoryB; its information identity persists.
      Analyst remains historically a Conceptualizer after the episode ends.
    negative: Create a new person when they become Observer; infer that a completed episode remains ongoing
      because R0054 persists; label an uncited document Source solely from its filename.
  checks:
  - Five roles each have one provider ancestor in read-only graph census
  - No logical anti-rigidity demonstration or native dependency-profile validation performed
  method: Manual conceptual inspection; examples are focal scenarios, not proven complete valid instances;
    absent information is not falsity. Local executable predicates, where supplied, test only declared
    finite rules.
scope_boundaries:
- No source definition automatically validates imported stereotypes.
- No creation of new classes, identities, relations or constraints.
- A completed negative/uncertain review does not resolve its findings.
- Frozen constraint execution_status values remain unchanged; local probes are separate evidence.
- 'Research proposals and philosophical alternatives await #129 joint decision.'
