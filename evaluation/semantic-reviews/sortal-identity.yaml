case_review:
  examples:
    positive: Two identical-content exports may carry one modeled information object under an explicitly
      chosen equivalence policy, while keeping distinct file assets. A person remains the same agent after
      role change.
    negative: 'Treat changing a file hash as proof of new content identity. Boundary/unknown case, not
      proved inconsistency: instantiate only broad Object without a specified identity ground; flag the
      missing declared identity obligation and possible external coverage. Reject treating an individual
      model artifact as a type of model types without a declared bridge; do not mistake the class-level
      R0106 specialized association itself for that individual assertion.'
  checks:
  - Read-only ancestry/provider census completed in/tmp/semantic120-122-static.json
  - Full identity, modal and higher-order semantics remain NOT_ASSESSED; no OCL/TPTP/native validator
    executed
  method: Manual conceptual inspection; examples are focal scenarios, not proven complete valid instances;
    absent information is not falsity. Local executable predicates, where supplied, test only declared
    finite rules.
