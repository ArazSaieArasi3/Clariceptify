- id: SEM120-F04
  title: Model Kind level interpretation gate
  observation: 'C0074 is a higher-order type whose instances are model types. R0106 connects base class
    Model C0073 to Model Kind C0074 using the instantiation stereotype (source0..*, target1..*). C0073
    is a class, not an individual artifact. UFO-HIGHER2022 section4.1 PDFp9 explicitly interprets this
    association as a base-type/higher-order-type connection: isPowertype=true denotes Cardelli powertype,
    otherwise categorization. R0106 can therefore be appropriate notation rather than a skipped-level
    error. The imported registry does not declare the selected profile, order, isPowertype setting or
    formal translation; that interpretation gate remains open.'
  affected_ids:
  - CLR-C0073
  - CLR-C0074
  - CLR-C0125
  - CLR-R0106
  - CLR-G0067
  - CLR-SC0023
  sources:
  - UFO-HIGHER2022
  proposal_not_applied: At#129 document the selected OntoUML higher-order profile, base type, categorization/powertype
    choice and translation before assessing or changing R0106. Preserve the existing definition and edge;
    do not infer a defect from ordinary association semantics.
  route: '#129 joint decision'
  state: REVIEW_FINDING_NOT_FINAL_SEMANTIC_ACCEPTANCE
