bounded_commitment: Assess identity provision/inheritance separately from stable identifiers and from
  names; select an explicit theory/profile before interpreting kind/category/mixin.
findings:
- id: SEM120-F01
  title: Information content identity remains a semantic question
  observation: C0057 is sole kind and G0052 places it below Object category. Its definition and SC0023
    require content equivalence, not physical-file equality. Existing artifact-versioning.md governs project
    asset/revision bindings; artifact-authority.md explicitly separates engineering records from modeled
    instances. Therefore do not claim no version policy exists.
  affected_ids:
  - CLR-C0057
  - CLR-G0052
  - CLR-SC0023
  sources:
  - SEP-SORTALS2025
  - UFO-TYPES2021
  proposal_not_applied: Specify examples of same/different modeled information objects, contextual equivalence
    and cross-time persistence before accepting a semantic identity policy; preserve existing governance.
  route: '#129 joint decision'
  state: REVIEW_FINDING_NOT_FINAL_SEMANTIC_ACCEPTANCE
  research_draft_id: SEM120-F01
  decision_gate: unapproved_joint_user_decision_129
  implementation: none; approved independent changes require bounded follow-up issues with AC/NAC
- id: SEM120-F02
  title: Category abstraction and identity coverage are qualified
  observation: Agent C0004,Object C0083,Type C0125 are categories; all is_abstract fields null. Null is
    unassessed, not explicit nonabstract. Agent definition covers individual and collective agents, but
    does not supply their separate ultimate identity kinds. Selected slice may deliberately omit these;
    unsupported direct instantiation is a risk, not an established contradiction.
  affected_ids:
  - CLR-C0004
  - CLR-C0083
  - CLR-C0125
  - CLR-G0003
  - CLR-SC0024
  sources:
  - UFO-TYPES2021
  - ONTO-CATEGORY-DOC
  proposal_not_applied: Select supported profile and declare abstraction/external identity coverage without
    inventing Person/Organization classes or expanding domain scope.
  route: '#129 joint decision'
  state: REVIEW_FINDING_NOT_FINAL_SEMANTIC_ACCEPTANCE
  research_draft_id: SEM120-F02
