nonlinear_contract: Verification and Validation produce distinct evidence; Evaluation governs evidence
  processes; Assessment produces contextual judgments; gate decisions are separate; Assurance is maintained
  claim support, not the fifth score in a linear chain.
states:
- PASS
- FAIL
- BLOCKED
- NOT_ASSESSED
- NOT_APPLICABLE
roles:
  engineer: Maintain artifact and produce reproducible evidence
  reviewer: Provide actual scoped domain/semantic evidence; independence recorded
  assessor: Judge criterion applicability and evidence
  gate_owner: Make actual release-scope disposition
  assurance_maintainer: Maintain bounded claim/argument/evidence/assumptions and invalidation triggers
layers:
- id: Verification
  purpose: Check conformance to explicit construction, serialization, identity and structural rules.
  method: Run input-bound schemas/IDs/links/projections, diagram correspondence, selected fixture controls
    and package replay; repeat only invalidated checks.
  evidence:
  - evaluation/release/published-readback.yaml
  - evaluation/diagrams/paint-order-reassessment.yaml
  - evaluation/conceptualization-fixtures.json
  indicators:
  - name: Frozen public integrity checks
    denominator: 11
    population: v0.1.0 declared extracted check layers
    baseline_state: 11 executed PASS; scope-specific only
  - name: Diagram element populations
    denominator:
      concepts: 137
      association_connectors: 174
      generalization_connectors: 122
    population: diagram-r1.2 and model input-r1-rev1
    baseline_state: element parity and scoped paint-order evidence; not native-tool semantic validity
  r2_tasks:
  - Relevant-input regression and targeted negative/mutation controls
  - Check model/source/requirements/representation deltas against their actual refs
  - If a formal slice is introduced, its actual profile/reasoner/constraint checks remain distinct and
    versioned
  issues:
  - 36
  - 37
  - 38
  - 45
  - 49
  - 129
  claim_boundary: Rule and structure conformance only; not intended-domain adequacy.
- id: Validation
  purpose: Examine adequacy for the declared conceptualization use and intended distinctions.
  method: Review explicit CQ acceptance/adverse cases, domain purpose and coverage, source passages/typing,
    representative cases and actual author/expert judgments.
  evidence: []
  indicators:
  - name: Principal CQ contracts assessed
    denominator: 30
    population: CQ-01 through CQ-30
    baseline_state: globally not_executed; imported witnesses not_assessed
  - name: Subject domains assessed
    denominator: 20
    population: Twenty subject domains; Foundations is separately recorded
    baseline_state: not_assessed
  - name: Pending source-support concepts
    denominator: 10
    population: Imported P qualification, distinct from full typing adequacy of all 137 concepts
    baseline_state: pending; no fresh source-passage approval
  - name: Independent expert review
    denominator: null
    population: Explicitly scoped assigned review(s), expertise and independence recorded when actually
      assigned
    baseline_state: not_assessed; no invented reviewer/sample size
  r2_tasks:
  - Assess three ten-CQ batches with positive/adverse examples and observed dispositions
  - Assess twenty domains in their declared purpose/context
  - Inspect ten Pending concepts in two five-concept batches; maintain uncertainty and typing distinction
  - Record actual human review, agreement/disagreement and adjudication; package owner acceptance is not
    expert validation
  issues:
  - 92
  - 111
