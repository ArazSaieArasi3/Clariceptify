  - 125
  - 132
  claim_boundary: Context-relative adequacy evidence; no universal philosophical validity or empirical
    effectiveness.
- id: Evaluation
  purpose: Govern acquisition and interpretation of qualitative/quantitative evidence for the chosen quality
    profile.
  method: Use the frozen review protocol, typed evidence register, stated populations and reproducible
    observations; orchestrate relevant V/V, source/corpus and task methods.
  evidence:
  - evidence/related-work/review-protocol.yaml
  - docs/research/claim-register.yaml
  indicators:
  - name: Recovered related-work seeds
    denominator: 19
    population: Labels, not confirmed distinct ontologies
    baseline_state: registered only; full texts/artifacts unreviewed
  - name: Concept support population
    denominator: 137
    population: 44 D / 83 B / 10 P imported screening qualifications
    baseline_state: recorded, not freshly verified support
  - name: Scientific assessment coverage
    denominator: Declared obligations for each actual run
    population: Profile criteria, not a pooled score across heterogeneous populations
    baseline_state: missing observations remain null / NOT_ASSESSED
  r2_tasks:
  - 'Collect closest-work evidence under #67, including paper and artifact/version distinctions'
  - Report domain/CQ/source coverage with fixed denominators, missingness and conflicting observations
  - Keep synthetic demonstrations, empirical tasks, agent assistance and expert evidence separate
  issues:
  - 67
  - 68
  - 86
  - 87
  - 91
  - 126
  - 128
  claim_boundary: Observations and comparison within the frozen corpus/profile; no novelty by keyword
    absence or zero results.
- id: Assessment
  purpose: Judge evidence and unresolved findings against explicit criteria and a release claim.
  method: Record criterion-level result, applicability, uncertainty, critical findings, explicit exceptions
    and rationale; keep judgment distinct from a gate decision.
  evidence:
  - evaluation/review-state.yaml
  - evaluation/release/scope-disposition.yaml
  indicators:
  - name: R2 criterion dispositions
    denominator: All applicable profile obligations declared for the exact R2 candidate
    population: PASS / FAIL / BLOCKED / NOT_ASSESSED / NOT_APPLICABLE with reasons
    baseline_state: R2 not_assessed
  - name: Actual R1 owner package-scope decision
    denominator: 1
    population: Exact v0.1.0-rc.1 disposition, preserved scientific payload in stable v0.1.0
    baseline_state: ACCEPTED; not independent scientific review
  r2_tasks:
  - Adjudicate domain/CQ/source/model findings and publish evidence-based proposed corrections
  - Retain every release-scope blocker regardless of favorable metrics
  - Record actual R2 author/expert decisions and exact-package disposition; gate owner separately decides
    publication
  issues:
  - 127
  - 128
  - 129
  - 132
  - 133
  - 134
  claim_boundary: A contextual judgment and rationale; a numerical score is not truth or automatic release
    approval.
- id: Assurance
  purpose: Maintain justified confidence in a bounded claim using argument, evidence, assumptions and
    counterevidence.
  method: Build a version-bound claim-support case; link evidence applicability, assumptions, unresolved
    findings, limits, owner and reassessment triggers.
  evidence:
  - evaluation/assurance/r1-package-case.yaml
  indicators:
  - name: Bounded cases with complete claim/argument/evidence/assumption/scope/trigger fields
    denominator: Explicit claims adopted for the current assurance case
    population: No aggregate confidence or certification score
    baseline_state: Engineering package identity case supported; semantic assurance not_assessed
  r2_tasks:
  - Maintain an R2 case for each intended release claim using actual evidence
  - Expose unsupported claims and counterevidence rather than turning missing data into PASS
  - Invalidate affected support after semantic/input/tool/profile/use changes and record reassessment
  issues:
  - 127
  - 128
  - 133
  - 134
  claim_boundary: Bounded and rebuttable claim support; operational QA, author approval and certification
    are distinct.
decision_rules:
- No average conceals a critical blocker or missing human review.
- A structural PASS does not promote scientific validity, source support or CQ satisfaction.
- An author package-scope decision does not become independent expert review.
- A criterion may be NOT_APPLICABLE only with an explicit scope rationale.
- Every observed result binds exact inputs, method, tool/config/runtime where relevant, actual execution
  and limitations.
- Unperformed tasks remain NOT_ASSESSED; blocked prerequisites remain BLOCKED.
reassessment_triggers:
- Semantic/model change
- Source or requirements/CQ change
- Rendering/representation change affecting a claim
- Tool/rule/profile/threshold/population change
- Intended use change
- New counterevidence/finding
- Exception expiry or changed owner decision
