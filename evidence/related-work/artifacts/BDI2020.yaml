checks:
  - id: Q01
    selected_commitment_ids: []
    locator: 'BDI2020:E01,E02,E19,M01,M02; publisher PDF pp.140-141 and 153-154; technical-discovery.json'
    result: Exact paper identity and retained PDF hash are pinned; no original executable root, namespace, version, class glossary, import closure, file license or foundation edition identified in dated bounded searches.
  - id: Q02
    selected_commitment_ids: [K03, K18, K28]
    locator: 'BDI2020:E04 PDF p.142 TRmin; E11 PDF p.148 Tmin(i); E14 PDF p.151 WISH shorthand'
    result: TRmin/Tmin differ literally; DEL versus DES and bracket/chain/individual-output notation remain source-level discrepancies. No parser-corrected OWL translation is inferred.
  - id: Q03
    selected_commitment_ids: [K03, K08, K15]
    locator: 'BDI2020:E03,E04 PDF pp.141-142 ONLY/PARTHOOD; E09 PDF pp.146-147 BelO,IntP'
    result: ONLY limits allowed realization fillers without requiring a realization. PARTHOOD constrains selected maximal realization classes and parts, with per-individual schema and sure-fire/single-track assumptions. An absent realization is not a violated universal filler condition; neither approach supplies a whole-theory equivalence proof.
  - id: Q04
    selected_commitment_ids: [K12, K13]
    locator: 'BDI2020:E07,E09 PDF pp.144-147 Dec and Int-Dec'
    result: Dec requires at least an occurrent belief part and an occurrent desire part; Int-Dec sends each intention back to some decision process, not every decision forward to an intention. Same-agent/time/distinct-part and decision justification require further conditions.
  - id: Q05
    selected_commitment_ids: [K31]
    locator: 'BDI2020:E12,E13,E15 PDF pp.148-152, weaker Dec and alternative desire theories'
    result: Action, compound, pleasure and good-based variants are alternatives with explicit source axiom rejections. K31 weakens Dec to a belief-part requirement; combining all variants would misrepresent the author's theory choices.
  - id: Q06
    selected_commitment_ids: [K18]
    locator: 'BDI2020:E07,E10,E11 PDF pp.144-148, optional trigger hypotheses'
    result: Optional occurrent-belief triggers and minimal-trigger schema do not show actual triggering. Blocking/masking of realization is separate from an executed contradiction or guaranteed action.
  - id: Q07
    selected_commitment_ids: [K28]
    locator: 'BDI2020:E14,E17 PDF pp.150-153, wishful-thinking example'
    result: Existing wishful-thinking bias, triggered occurrent desire and newly specified belief output are distinct roles. Agent/time precedence and content identity are not formalized by the printed individual-output shorthand.
  - id: Q08
    selected_commitment_ids: [K03, K15]
    locator: 'BDI2020:E03,E04,E09,E12,E18 PDF pp.141-149, identity and mode discussion'
    result: Categorical basis, minimal trigger, maximal realization and mode parthood are paper-level distinctions. Exact-sum identity versus some-part conditions and executable profile cannot be tested without a selected author root; no parser, reasoner or author experiment is reported as run.
scenarios:
  positive: Ada has a belief and a desire relevant to a decision, then forms an intention. Model her decision episode, dated evidence and rationale explicitly while retaining belief/desire as separate antecedent parts.
  adverse: A hesitant decision process has the two relevant mental parts but produces no intention; reversing Int-Dec would wrongly force an intention. Likewise a disposition with no actual realization does not violate an only-filler restriction.
