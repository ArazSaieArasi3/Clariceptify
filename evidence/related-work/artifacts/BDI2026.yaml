- id: BDI250-F03
  title: Exact core outside checked OWL2 DL profile
  detail: Reserved rdf:type is declared an annotation property. HermiT consistency of loaded logical axioms does
    not repair or certify the raw source profile.
  disposition: PRESERVE_FOR_COMPARISON_NO_SOURCE_OR_MODEL_REPAIR
  next_issues:
  - 256
  - 126
- id: BDI250-F04
  title: Paper and core mental-state commitments differ
  detail: Ownership cardinalities are stronger in the core, while the Belief supports existential is absent. Shared
    owners/content across a cognitive chain are not enforced.
  disposition: PRESERVE_FOR_COMPARISON_NO_SOURCE_OR_MODEL_REPAIR
  next_issues:
  - 256
  - 126
- id: BDI250-F05
  title: Unchanged story fixtures conflict with part constraints
  detail: Both author datasets include Desire parts typed Belief/Intention, contradicting same-type parts and disjointness
    under the core.
  disposition: PRESERVE_FOR_COMPARISON_NO_SOURCE_OR_MODEL_REPAIR
  next_issues:
  - 256
  - 126
- id: BDI250-F06
  title: Time anchoring and validity are not update semantics
  detail: Core lacks the paper MentalEntity atTime existential; date ordering and generation-time propagation are
    not enforced; queries use interval dates operationally.
  disposition: PRESERVE_FOR_COMPARISON_NO_SOURCE_OR_MODEL_REPAIR
  next_issues:
  - 256
  - 126
- id: BDI250-F07
  title: Order and plans do not guarantee proper structure or success
  detail: Self-parts, branching/cyclic precedence, absent components/executions and inverse endpoint declaration
    must be assessed against explicit intended requirements.
  disposition: PRESERVE_FOR_COMPARISON_NO_SOURCE_OR_MODEL_REPAIR
  next_issues:
  - 256
  - 126
- id: BDI250-F08
  title: Dataset/query namespaces and entailment regimes matter
  detail: All18 published-namespace runs mismatch unmodified expected IRIs. Local-data CQ4 requires additional inverse
    entailment; no silent namespace/data repairs are made.
  disposition: PRESERVE_FOR_COMPARISON_NO_SOURCE_OR_MODEL_REPAIR
  next_issues:
  - 256
  - 126
- id: BDI250-F09
  title: Expected JSON matches do not establish CQ adequacy
  detail: CQ11 repeats a timestamp query despite asking for justifications;CQ15 IRI sorting is not a task-order
    proof. Current machine metrics are not the paper Table2 population.
  disposition: PRESERVE_FOR_COMPARISON_NO_SOURCE_OR_MODEL_REPAIR
  next_issues:
  - 256
  - 126
- id: BDI250-F10
  title: Modification property cannot have instances in the loaded core
  detail: Two asserted modifies domains force the source into disjoint MentalState/MentalProcess. A neutral edge
    suffices to make the whole logical graph inconsistent.
  disposition: PRESERVE_FOR_COMPARISON_NO_SOURCE_OR_MODEL_REPAIR
  next_issues:
  - 256
  - 126
- id: BDI250-F11
  title: Application results are historical and source-bound
  detail: Absent runtime ontology file, duplicate Python method,15 retained outputs and alias vocabulary prevent
    treating the current script as a reproduction of the paper evaluation.
  disposition: PRESERVE_FOR_COMPARISON_NO_SOURCE_OR_MODEL_REPAIR
  next_issues:
