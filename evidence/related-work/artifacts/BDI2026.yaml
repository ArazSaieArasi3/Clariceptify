questions:
- id: Q01
  title: Version, populations and foundation
  result: Core0.5 and exact alignment are pinned separately. All22 local core classes, three external metadata/test
    declarations and all10 local d0 classes are inventoried. All78 local DUL classes reuse the exact existing glossary;89
    unique declared foundation IRIs include owl:Thing. Alignment has zero explicit class declarations and24 named
    class-position references, not24 new classes. d0 versionInfo lists history1.2-1.5;DUL is4.2. The exact BDI0.3
    import returned404, so full alignment-imported populations/historical equivalence remain unestablished. Older
    root bdi.ttl uses a different namespace and is not a replacement.
  evidence:
  - catalog
  - census
  - discovery
  finding_ids:
  - BDI250-F01
  - BDI250-F02
  locators:
  - header owl:versionIRI/owl:imports
  - class catalogue per-IRI constraints
  - paper PDF6,8;AppendixB
  assessment: ASSESSED_WITH_EXPLICIT_LIMITS
- id: Q02
  title: Profile and satisfiability
  result: 'OWLAPI OWL2DLProfile rejects the exact core because rdf:type is declared owl:AnnotationProperty. HermiT
    accepts the loaded logical ontology: baseline consistent and no unsatisfiable named core classes were returned.
    This is not a profile PASS. All isolated semantic cases keep the whole exact core. Exact alignment/core0.3 joint
    profile, cognitive/activity typing and type satisfiability are BLOCKED by missing0.3; no0.5 substitution or
    import stripping is used to pretend completion.'
  evidence:
  - semantic
  - census
  - discovery
  finding_ids:
  - BDI250-F01
  - BDI250-F03
  locators:
  - core rdf:type annotation declaration
  - MentalProcess subclass axioms
  - paper PDF6,8;AppendixB23-32
  assessment: ASSESSED_WITH_EXPLICIT_LIMITS
- id: Q03
  title: Witnesses, ownership and targets
  result: 'Belief with unnamed witnesses is consistent; forbidding all motivates values is inconsistent. In contrast,
    forbidding supports values is consistent: the paper belief-to-Intention existential is absent. Core per-state
    exactly-one qualified Agent ownership rejects two different owners of one Belief, but a Belief motivating a
    Desire with another owner remains consistent. No shared-agent/shared-world target join is inferred; named CQ
    results are separate from anonymous witnesses.'
  evidence:
  - semantic
  - catalog
  - census
  finding_ids:
  - BDI250-F04
  locators:
  - Belief/motivates/supports/isBeliefOf
  - Desire/isDesireOf
  - paper AppendixB13-22,33-38
  assessment: ASSESSED_WITH_EXPLICIT_LIMITS
- id: Q04
  title: Parts and actual author fixtures
  result: The same-type Desire-part case is consistent; Belief and Intention parts each contradict the source allValuesFrom
    Desire plus B/D/I disjointness. Both unchanged author datasets contain such cross-type parts and are inconsistent
    with core0.5. Their successful SPARQL output is therefore not consistency validation. All part restrictions,
    incoming disjointness and the complete all-disjoint list are retained in the census/catalogue.
  evidence:
  - semantic
  - cqs
  - catalog
  finding_ids:
  - BDI250-F05
  locators:
  - Desire/hasPart;owl:AllDisjointClasses
  - data-unit-testing.ttl:Desire_Graduate
  - paper AppendixB15,18,21
  assessment: ASSESSED_WITH_EXPLICIT_LIMITS
- id: Q05
  title: Time and interval obligations
  result: Unlike paper axiom77, core MentalEntity permits no atTime values, while hasValidity remains required.
    A generated Belief need not inherit its process time. A TimeInstant may have no date value; bdi:time has TimeInterval
    domain, allowing instant/interval co-typing because they are not declared disjoint. Distinct interval starts
    are inconsistent but two names may identify; missing ends and reversed date values are allowed. CQ9 uses atTime/interval
    start rather than a generation event;CQ17 filters dates procedurally and likewise uses atTime, not hasValidity;CQ18
    lists explicit change links rather than computing a revised world/state.
  evidence:
  - semantic
  - cqs
  - catalog
  finding_ids:
  - BDI250-F06
  locators:
  - MentalEntity/atTime/hasValidity
  - TimeInstant/time;TimeInterval/hasStartTime/hasEndTime
  - unit-test-9,17,18
  - paper AppendixB71-78
  assessment: ASSESSED_WITH_EXPLICIT_LIMITS
- id: Q06
  title: Plans, ordering and execution
  result: 'A Plan may lack components or an execution; mandatory component and intention-specifies-Plan existentials
    from the paper are absent in the core. hasPart is reflexive: no-parts contradicts it, but a Plan whose only
    part is itself is consistent, so a proper subplan is not forced. Task precedence admits cycles and branches;
    transitivity does force shortcuts. beginsWith is asserted inverseOf endsWith, a questionable endpoint correspondence,
    rather than a tested requirement of a total task order. CQ15 orders rows by task IRI, not by a verified topological
    sequence. No actual action completion or goal success follows.'
  evidence:
  - semantic
  - cqs
  - catalog
  finding_ids:
  - BDI250-F07
  locators:
  - Plan/hasPart/hasComponent;Intention/specifies
  - precedes/follows;beginsWith/endsWith
  - unit-test-15
  - paper AppendixB44-70
  assessment: ASSESSED_WITH_EXPLICIT_LIMITS
- id: Q07
  title: All eighteen CQs and metrics
  result: 'All18 embedded OWLUnit CQ annotations correspond by number to Table1 and are acquired with expected JSON.
    Exact RDFLib SPARQL executions on two unchanged datasets yield36 runs: the local example.org dataset matches17/18
    expected multisets;CQ4 misses three inverse-derived processing edges under the declared asserted-graph regime.
    The published bdi-tests namespace dataset matches0/18 because query constants/expected IRIs use example.org.
    CQ11 duplicates CQ9 timestamp query/expected data despite asking for justifications. Thus17 matches are not17
    semantically validated requirements. OWLUnit itself is not executed. Paper Table2 counts22 domain classes/547
    axioms/288 logical axioms/71 object properties; current raw core has22 local plus3 external explicit class declarations;OWLAPI
    signature additionally includes owl:Thing. Exact current metrics are separate from historical paper denominators,
    embedded test individuals/annotations and serializer-dependent triple counts.'
  evidence:
  - cqs
  - semantic
  - census
  finding_ids:
  - BDI250-F08
  - BDI250-F09
  locators:
  - unit-test-1 through unit-test-18
  - bdi/unittesting.md
  - paper Table1/Table2
  assessment: ASSESSED_WITH_EXPLICIT_LIMITS
- id: Q08
  title: Applications and changes
  result: 'Static inspection accounts for19 test-method declarations,18 unique names and15 retained output records;
    a duplicate method name overwrites an earlier definition at Python class construction. The script expects absent
    bdi-v0.2.rdf, so it does not pin the reviewed0.5 bytes. LLM/SEMAS experiments are not rerun and no API calls
    occur. Hotel conditions/payment timestamps/self-trigger claims remain illustrative, not OWL entailments. A new
    adverse test shows that ANY modifies edge is inconsistent with core0.5: its subject receives both MentalProcess
    and MentalState domains, which are disjoint. A fulfills/fulfils alias countermodel confirms that spelling is
    not identity. These findings are retained for #256/#126; author source and Clariceptify remain unchanged.'
  evidence:
  - application
  - semantic
  - catalog
  finding_ids:
  - BDI250-F10
  - BDI250-F11
  locators:
