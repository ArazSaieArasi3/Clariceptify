  - id: T07
    question: Shared primary anchor and instance retyping
    locator: 'CMO:E07,E10,S03; paper Fig.5'
    method: Check whether shared hasPrimaryConcept alone supplies a safe membership conclusion.
    outcome: AdultPerson and MinorPerson may share Person while an adult instance need not be a minor. Fig.5 requires approved identity, qualifier and mapping-policy guards; no author rule engine was run.
  - id: T08
    question: Conceptual hierarchy and generated subclass
    locator: 'CMO:E10,E11,S04,S12; paper Fig.6'
    method: Separate SKOS broader path and primary anchor from an asserted rdfs:subClassOf consequence.
    outcome: A topic hierarchy does not by itself establish class extension inclusion. Conflict handling and different-granularity mapping remain unsupported in this source.
scenarios:
  positive: A typed conceptual vocabulary can annotate two source-model fields through a common Person concept, keeping each logical field distinct; the candidate's SKOS Concept, Type and primary/qualifier predicates supply a source-bound vocabulary pattern, subject to approved anchors.
  adverse: AdultPerson and MinorPerson concepts both have Person as primary anchor; a single adult instance does not thereby acquire MinorPerson membership. A qualifier omitted from a Tissue Specimen mapping may erase a clinical distinction. These are conceptual counterexamples, not reasoner-proved full-theory countermodels.
