  - {id: C02, paper_id: K04, formula: D4, locator: 'COM2004:E08 PDF p.6', observation: 'Percept excludes any mental object on which it generally depends; unrestricted y includes itself under literal D1.'}
  - {id: C03, paper_id: K08, formula: D6, locator: 'COM2004:E10 PDF p.7', observation: 'Computed belief requires a direct historical percept predecessor; the printed dependency chain inherits the D1/D4 concern, not an executed proof of whole-theory inconsistency.'}
  - {id: C04, paper_id: K11, formula: D9, locator: 'COM2004:E10 PDF p.7', observation: 'Aboutness has agent, state, object and time arguments; owner dependence and simultaneous co-participation suffice as printed.'}
  - {id: C05, paper_id: K13, formula: D11, locator: 'COM2004:E11 PDF p.7', observation: 'Belief state is existentially classified by an aboutness tuple and a computed-belief object; no justification or truth condition is displayed.'}
  - {id: C06, paper_id: K14, formula: D12, locator: 'COM2004:E11 PDF p.8', observation: 'Desire state is existentially classified by a computed-desire object; D9 permits multiple objects to co-participate in one state.'}
  - {id: C07, paper_id: K16, formula: D14, locator: 'COM2004:E11 PDF p.8', observation: 'The printed union uses PER, whereas D10/Figure 1 use PES; no silent predicate repair.'}
  - {id: C08, paper_id: K20, formula: A5, locator: 'COM2004:E14 PDF p.9', observation: 'Present intentional agent implies a present, owner-dependent computed belief; this necessary condition is not an iff definition or a decision-history pattern.'}
scenarios:
  positive: 'At the local D9 fragment level, one agent a, mental state s and private mental object z co-participate at t with z owner-dependent on a; AB(a,s,z,t) follows. This is not a witness for the full D1-D15/A1-A5 theory.'
  adverse: 'Under unrestricted normal-modal D1, GED(x,x) is tautological; D4 then cannot classify a mental object x as PRC. Separately, if a state co-participates with a computed belief and desire both owned by a, D9 and D11/D12 classify that state as both BEL and DES. These are conditional fragment analyses, not solver-proved full-theory defects.'
