checks:
  - id: Q01
    source_locators: [L16-L88, L95-L190, L202-L273, L287-L355]
    paper_locator: 'PDF 7-13 / printed 131-137'
    result: All 34 active predicate name/arity pairs and 16 unary analogues accounted for; 14 inlined foundation-family and 20 local, with full axiom/conjecture locators. intState appears in active disjointness/test formulas although its positive subtype and attitude projection are commented.
  - id: Q02
    source_locators: [L4-L8, L16-L88, L123-L149, L211]
    paper_locator: 'PDF 6-8 / printed 130-132; notes 16,19,22'
    result: Selected file embeds a DOLCE-family excerpt but declares no include/import; exact D18/DOLCE-CORE edition or modal background is not pinned. sat/3 has no event guard in its own biconditional. Paper and source are distinct draft/publication artifacts.
  - id: Q03
    source_locators: [L102-L106, L123-L149]
    paper_locator: 'PDF 8-9 / printed 132-133, a4-a6,d1-d3'
    result: Mental-state agent ownership uses APO participation with cross-time uniqueness. about1 has one content across times, and about2 is routed through classification. The source intObj/2 omits the printed explicit about1 conjunct; no whole-theory equivalence is inferred.
  - id: Q04
    source_locators: [L202-L203]
    paper_locator: 'PDF 10 / printed 134, literal d6'
    result: Source goal clause is balanced; printed d6 still lacks three closing parentheses. Its compatibility condition ranges over alternatives including the candidate itself; without a classifying satisfier for itself the selected source condition rejects it. This is a source-bound reading, not a repaired paper formula or full-theory test.
  - id: Q05
    source_locators: [L234, L267]
    paper_locator: 'PDF 11-12 / printed 135-136, d8 and d11'
    result: Two finite isolated truth-table cases show source existential E over the implication/biconditional can differ from the printed existence-of-satisfier operand. A nonsatisfying e2 witnesses the source while paper-level existence condition is false; no full-theory countermodel or causal-necessity proof claimed.
  - id: Q06
    source_locators: [L190, L261, L267, L273, L304-L305]
    paper_locator: 'PDF 12-13 / printed 136-137, d10-d12'
    result: need1 iff igoal; need2 contains igoal; need3 implies egoal and need0 only. Active author examples of need1/2 without need0 are asserted test fixtures, not separately reproduced models; absolute harm criterion remains absent from selected clause.
  - id: Q07
    source_locators: [L187-L211, L234-L273]
    paper_locator: 'PDF 1-3,13-14 / printed 125-127,137-138, service scenarios'
    result: A driving-licence goal and service may be described via desire/need0, instrumental goal and satisfier with explicit agents/times. An ascribed need or a typed service alone does not entail achievement, need3, or actual eventhood of a satisfier from these source predicates.
  - id: Q08
    source_locators: [L28-L41, L60-L61, L169-L177, L296-L355]
    paper_locator: 'PDF 7 note15 / printed 131'
    result: Four repeated FOF-name groups, seven active example axioms, twelve active conjectures and commented alternatives are separated. The line336 unique-desire antecedent includes both des(a9,c11,t) and no desire at all, so its antecedent is false in all isolated finite valuations. Line349 has an E binding/scope issue. No TPTP parser, Darwin/Hets version reproduction, prover run or successful theorem count is claimed.
findings:
  - id: DM248-F01
    claim: Native FOL source and published display are not identical versions.
    consequence: Keep separate locators and do not substitute the draft for the paper.
  - id: DM248-F02
    claim: Local mental-state subtype and role patterns have explicit gaps and guards.
    consequence: Compare agent/content/time roles with Clariceptify without accepting class equivalence.
  - id: DM248-F03
    claim: Source satisfier and instrumental/necessary-goal quantifier scopes limit intended event/causal readings.
    consequence: Require separate CQs and formal guards before reuse.
  - id: DM248-F04
    claim: Duplicate formula names, vacuous unique-desire antecedent and binding questions make author proof comments insufficient evidence.
    consequence: A single-conjecture cleaned problem and separately pinned foundation are future verification work.
