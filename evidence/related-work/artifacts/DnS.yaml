questions:
- id: Q01
  title: Identity, population and joint consistency
  result: Official LOA DLP3971 is a later 2005 distribution, not established as exact 2003 implementation. The selected
    root has 58 local / ten external declarations; the four-document import closure has 95 unique declared classes.
    All 58 local comment candidates and ten direct-import comment sources are accounted for; non-agentive-figure
    lacks a distinguishing definition. Baseline and each of information-object/description alone are consistent,
    but their joint instance is inconsistent. Individual coherence does not establish joint coherence.
  locators: Root header; DnS2003 K01-K04/E02-E04; semantic baseline and separation cases
- id: Q02
  title: Scope indices and descriptive entities
  result: concept requires defined-by some description. description uses concepts or figures, requires physical-agent
    representation and information-object expression. These restrictions are not the indexed Pi/PiD/SDi/Si FOL vocabulary
    or a proof of its global scope. Denying all description witnesses for a concept, or all representing agents
    for a description, is inconsistent.
  locators: concept/description restrictions; DnS2003 displays 9/14
- id: Q03
  title: Selection and explicit inverse correspondence
  result: The later root explicitly makes classifies inverse to classified-by, with role/course/parameter specializations
    played-by, sequences and valued-by. This is not a literal selects/selectedBy IRI correspondence or proof of
    paper display 13. An isolated classification plus denial of its reverse is inconsistent.
  locators: classifies/classified-by/played-by/sequences/valued-by; DnS2003 displays 7/13
- id: Q04
  title: Per-setting existential versus shared description
  result: situation is defined by a social-object condition, some setting-for particular and some satisfies description.
    This supplies a witness per situation; it does not assert one named or globally shared description, a unique
    description or all finite ground facts. Denying all satisfaction witnesses is inconsistent; ordinary situation
    instantiation is consistent through unnamed witnesses.
  locators: situation equivalentClass; satisfies/satisfied-by; DnS2003 displays 4/13
- id: Q05
  title: Unparenthesized paper formula and later encoding
  result: No silent repair or FOL reconstruction of display 14 is adopted. The complete selected OWL constraints
    are retained separately; named definition/classification relations do not establish equivalence to either proposed
    scope reading of that formula. Formula 14 remains a qualified historical correspondence limit, rather than an
    executed theorem or repaired source.
  locators: DnS2003 K14 and source locators; selected root catalogue constraints
- id: Q06
  title: Structural direction and time boundary
  result: temporary-component and temporary-component-of are explicit inverses. Denying the reverse is inconsistent.
    A component chain with its shortcut denied remains consistent, so transitivity is not forced by this selected
    profile. TemporalRelations is an actual pinned direct import, but a binary role chain is not the paper temporal
    t_component signature or a verified ternary translation.
  locators: temporary-component / temporary-component-of; direct TemporalRelations import; DnS2003 Figure 3 / display
    17
- id: Q07
  title: Parameter values versus actual fillers
  result: parameter has a valued-by existential to region; denying every value is inconsistent. A role with no played-by
    fillers and a course with no sequences fillers are each consistent. Descriptive classification capability therefore
    does not require every possible role/course to be actually realized. Source cardinality and existential restrictions
    stay separate from comment intent.
  locators: parameter/role/course restrictions; DnS2003 displays 18-21 / Figure 1
- id: Q08
  title: Communication, meanings and query-role boundary
  result: Information-object is distinct from description in the selected source; each can exist separately but
    their joint typing is inconsistent. communication-event and expression/aboutness/interpretation relations are
    present; the selected root is not a complete SWAP message/query-role ontology. Code, message-dependent initiator/resolver/forwarder
    behavior and successful shared interpretation are not established by this module.
  locators: information-object/description/communication-event; DnS2003 Figures 2-5 / E08-E12
