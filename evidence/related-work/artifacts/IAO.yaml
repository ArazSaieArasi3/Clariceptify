    I01: 'IAO places information content within the BFO generically dependent category.'
    I02: 'An ICE must bear an aboutness relation to some BFO entity in the encoded restriction.'
    I03: 'An asserted is-about edge classifies its subject as an ICE through the domain axiom.'
    I04: 'Data entities inherit the information-content category; their truthfulness intention is described in the source annotation, not proved for each data record.'
    I05: 'A document is modeled as information content rather than equated with a physical carrier.'
    I06: 'The material bearer is typed beneath BFO material entity; this does not identify it with the content.'
    I07: 'The concretization links are inverse properties in the selected graph.'
    I08: 'The former represents relation is explicitly deprecated.'
