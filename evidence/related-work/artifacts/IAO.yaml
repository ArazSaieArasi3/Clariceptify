scenarios:
  positive: 'A document instance about a recorded observed event can use the IAO ICE/document classes, is_about property and a distinct material bearer. This illustrates vocabulary compatibility, not an executed ABox or Clariceptify alignment.'
  counterexample: 'A fictional or mistaken report can intend to refer to a non-existent target. The selected ICE existential aboutness axiom supplies some BFO entity in OWL, but does not by itself distinguish intended reference, successful reference or the reporter and episode. Treating the OWL witness as a verified real-world referent would exceed the asserted model.'
