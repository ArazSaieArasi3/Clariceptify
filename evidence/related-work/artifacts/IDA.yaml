  - id: T04
    topic: Intentional acts and participant roles
    paper_locator: indexed original sections 3.2 and 3.3, footnote 6
    summary_claims: [SR013, SR014]
    formal_iri: null
    exact_formula_locator: null
    result: Paper names conceptualizing, encoding, decoding and inscribing; thematic-role ontology is explicitly omitted for space. Its complete role axiomatization cannot be inspected from this article.
  - id: T05
    topic: Discourse production versus communication
    paper_locator: indexed original section 3.3
    summary_claims: [SR005, SR020, SR021]
    formal_iri: null
    exact_formula_locator: null
    result: Paper distinguishes producing a discourse from transmitting it; the transmitter and receiver need not be the producer and addressee. This challenges any direct author=transmitter identity mapping.
  - id: T06
    topic: Assertion truth and textual information
    paper_locator: indexed original section 4.1
    summary_claims: [SR022, SR023, SR026, SR037]
    formal_iri: null
    exact_formula_locator: null
    result: Paper describes KB Assertions as organizationally attributed True and permits differing discourse viewpoints. The summary formula and indexed PDF glyphs are not exact axiom transcriptions or a global truth entailment.
  - id: T07
    topic: Subject as concept
    paper_locator: indexed original section 4.1
    summary_claims: [SR025, SR027]
    formal_iri: null
    exact_formula_locator: null
    result: Paper describes hasForSubject between proposition and concept as indirect reference; it contrasts generic Car with an individual car concept. Neither an executable property IRI nor domain/range source bytes are verified.
  - id: T08
    topic: Responsibility and contradictory viewpoints
    paper_locator: indexed original sections 3.3 and 4.1
    summary_claims: [SR024, SR037]
    formal_iri: null
    exact_formula_locator: null
    result: Enunciating is described as joining production and communication with author/addressee responsibility; conflicting discourse viewpoints can remain textual while a coherent KB is consensual. No executable consistency test performed.
