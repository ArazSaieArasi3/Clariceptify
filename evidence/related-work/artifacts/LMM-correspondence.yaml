  - id: Q02
    finding: LMM274-F02
    paper: ['LMM2008:E06 PDF2 Fig.2', 'LMM2008:E13 PDF6 Fig.6']
    artifact: 'LMM_L1.owl#Expression/#Meaning/#Reference; DUL.owl#expresses/#isExpressedBy; LMM_L1.owl#denotes/#hasInterpretation/#isInterpretationOf'
    result: 'Current Expression equivalent union accepts an expresses or denotes existential branch, whereas Fig.6 displays expresses minimum1. Meaning requires some isExpressedBy Expression. Fig.2 interprets/isInterpretedAs and later hasInterpretation/isInterpretationOf are not silently identified. Baseline and bounded cases below pass; a denial of both expression branches or the meaning expression witness is inconsistent.'
    adverse: 'Neither an unnamed union witness nor a changed property label proves a unique interpreted referent or original figure fidelity.'
    test_ids: [expression-denotes, expression-neither-arm, meaning-no-expression]
    state: CURRENT_ROOT_SEMANTICS_WITH_VERSION_CONFLICT
  - id: Q03
    finding: LMM274-F03
    paper: ['LMM2008:E07 PDF3 Fig.3', 'LMM2008:E08 PDF4 sec.3.2', 'LMM2008:E12 PDF6 Fig.5']
    artifact: 'LMM_L1.owl#Context/#Reference; LMM_L2.owl#ConceptReference/#IndividualReference; DUL.owl#Concept/#Description/#Situation'
    result: 'Current L1 places Situation under Reference and Context; L2 puts Concept/Description under Meaning. Named concept individuals and isInstanceOf links are consistent in a selected fixture, but this does not make them OWL classes or entail an rdfs:subClassOf between referents. The paper allows a Situation to serve as Meaning in an interpretation without asserting every current Situation is Meaning.'
    adverse: 'No class equivalence follows from Fig.5 arrows or one shared name.'
    test_ids: [concept-individual-not-class]
    state: LEVEL_DISTINCTION_PRESERVED
  - id: Q04
    finding: LMM274-F04
    paper: ['LMM2008:E04 PDF2 speech act/intention', 'LMM2008:E10 PDF4-5 expression and social context']
    artifact: 'LMM_L1.owl#Context equivalent some isContextOf Entity; #hasContext inverse #isContextOf; #Paradigm/#CoText'
    result: 'A named Context without a named interpretation is consistent in the selected closure; OWL may supply an anonymous isContextOf Entity witness. Generic hasContext has no tested rule binding one expression, meaning, referent, speech act, agent and communicative intention into a disambiguated event.'
    adverse: 'A missing named interpretation is not proof that no anonymous context target exists; consistency is not disambiguation performance.'
    test_ids: [context-without-named-interpretation]
    state: INTERPRETATION_SPECIFIC_BINDING_NOT_ESTABLISHED
  - id: Q05
    finding: LMM274-F05
    paper: ['LMM2008:E07 PDF3 sec.3.1/Fig.3', 'LMM2008:E16 PDF4 lexical references']
    artifact: 'LMM_L2.owl#IndividualReference/#MultipleReference/#ConceptReference/#ExtensionalReference/#isInstanceOf; DUL.owl#hasMember/#isMemberOf'
    result: 'IndividualReference requires some Concept via isInstanceOf and some MultipleReference via isMemberOf. MultipleReference without a named member is consistent; ExtensionalReference with hasMember forced empty is inconsistent. ConceptReference is a MultipleReference/TypeCollection with an isDenotedBy ConceptExpression witness. Neither missing named members nor one individual name means the collection is empty.'
    adverse: 'The paper wording on individual membership conflicts with its example/figure; do not silently repair it or infer all named members under open world.'
    test_ids: [individual-no-concept, individual-no-membership, multiple-no-named-member, extensional-no-member]
    state: BOUNDED_EXISTENTIAL_AND_OWA_RESULT
  - id: Q06
    finding: LMM274-F06
    paper: ['LMM2008:E10 PDF4-5 Name', 'LMM2008:E13 PDF6 Fig.6', 'LMM2008:E16 PDF4 expression subtypes']
    artifact: 'LMM_L2.owl#Name/#ContextualExpression/#ConceptExpression asserted disjointWith; #SimpleConceptExpression/#EnumeratedExpression'
    result: 'A single Name/ContextualExpression or ConceptExpression/Name individual is inconsistent. Two explicitly distinct expressions with the same rdfs:label bank, one Name and one ConceptExpression, are consistent. Their spelling does not merge identity; no tokenization or polysemy evaluation was run.'
    adverse: 'The paper permits metalinguistic referents; subtype disjointness is not a universal prohibition on talking about an expression.'
    test_ids: [name-contextual-same-individual, concept-name-same-individual, same-lexeme-distinct-expressions]
    state: DISJOINTNESS_AND_LABEL_IDENTITY_BOUNDED
  - id: Q07
    finding: LMM274-F07
    paper: ['LMM2008:E13 PDF6 Fig.6', 'LMM2008:A02 selected L2 artifact', 'LMM2008:R02 local glossary']
    artifact: 'LMM2008/classes.yaml all29 local IRIs/comments; LMM_L2.owl#AssociativeContext/#EnumeratedExpression/#SimpleConceptExpression'
    result: 'Twenty-five of 29 local classes have source comment candidates. AssociativeRule, LSARule, LatentContext and SyntacticRule have no definition comment in the pinned L2 file. AssociativeContext comment calls itself a rule; EnumeratedExpression comment uses AnaphoricExpression while superclass is ContextualExpression; SimpleConceptExpression comment says ClassReference while restriction targets ConceptReference. No comment is promoted into a logical axiom or corrected upstream.'
    adverse: 'A reviewer paraphrase does not fill a missing author definition or prove those divergent terms equivalent.'
    test_ids: []
    state: FOUR_MISSING_COMMENTS_THREE_TERMINOLOGY_GAPS
