  - U07
- id: Q08
  title: Bundle and transitive-property cardinality
  disposition: EXECUTED_PROFILE_FAILURE_REASONER_REFUSAL
  interpretation: Bundle has an unqualified minimum cardinality2 on transitive hasProperPart, plus some Description
