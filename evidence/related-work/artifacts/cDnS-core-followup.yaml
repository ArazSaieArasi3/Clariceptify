  - core_census
  - paper2007
  - paper2008
  - mapped_extension_catalog
  positive_scenario: Retain an atemporal social-agent/content link when that is the declared intended scope.
  adverse_scenario: Two time-qualified claims cannot be distinguished by assigning only the same binary pair; no
    preservation of ordering or changing context is established.
  scenario_execution: NOT_EXECUTED_FULL_CORE_REASONER_REFUSED
  utilization_categories: &id008
