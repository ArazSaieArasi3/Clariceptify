  - mapped_extension_catalog
  positive_scenario: A Configuration remains subject to the inherited Collection restrictions.
  adverse_scenario: Do not infer the detailed part/member pattern from its name or silently normalize the shadowed
    temporal binder.
  scenario_execution: NOT_EXECUTED_FULL_CORE_REASONER_REFUSED
  utilization_categories: &id014
