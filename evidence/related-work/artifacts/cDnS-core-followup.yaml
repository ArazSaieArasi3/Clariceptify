questions:
- id: Q01
  title: Concept definition uniqueness
  disposition: CORE_STRENGTHENS_DISPLAYED_EXISTENCE
  interpretation: Concept has some Description and exactly one isDefinedIn filler. Both papers display 18 supplies
    existence without stating uniqueness in that display. This is a local commitment comparison, not a proof that
    the entire paper permits multiple definitions. Different names do not entail different individuals.
  basis: REVIEWER_INTERPRETATION
  artifact_locators:
  - Concept / isDefinedIn cardinality1; cDnS2007 K018 p12; journal K018 PDF15 / printed84
  source_query_id: Q01
  evidence_keys: &id001
  - execution
  - core_census
  - paper2007
  - paper2008
  - mapped_extension_catalog
  positive_scenario: A Concept has one defining Description.
  adverse_scenario: Two explicitly distinct defining Descriptions violate the selected cardinality; two names alone
    can denote the same Description.
  scenario_execution: NOT_EXECUTED_FULL_CORE_REASONER_REFUSED
  utilization_categories: &id002
  - U03
  - U04
  - U10
- id: Q02
