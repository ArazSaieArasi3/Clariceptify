- id: Q04
  title: Temporal projection
  disposition: BINARY_CORE_DOES_NOT_PRESERVE_EXPLICIT_TIME_ARGUMENT
  interpretation: All 47 declared properties are object properties; this root declares no Time class or datatype
    property and imports nothing. Time-indexed paper signatures are represented by binary core vocabulary without
    an explicit temporal argument. This does not establish that no temporal extension exists elsewhere or prove
    a lossless projection.
  basis: REVIEWER_INTERPRETATION
  artifact_locators:
  - Core object-property inventory; 2007 K038/K047; journal K037/K046 and K114 temporal order
  source_query_id: Q04
  evidence_keys: &id007
