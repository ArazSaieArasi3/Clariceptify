    restriction. No whole-core consistency value or unsatisfiable-class list is obtained. Paper65 does not explicitly
    distinguish its two variables in the formula despite the prose minimum; neither that formula nor all its context
    is certified by this execution.
  basis: REVIEWER_INTERPRETATION
  artifact_locators:
