    the range in display37, unlike the earlier Description-oriented shares(a,d,t) display38 vocabulary. Do not report
    the broader range as a novel core-versus-2008 discrepancy or equate the differently named relations automatically.
  basis: REVIEWER_INTERPRETATION
  artifact_locators:
  - conceptualizes domain/range; 2007 K038 PDF15; journal K037 PDF17 / printed86
  source_query_id: Q02
  evidence_keys: &id003
