- id: Q06
  title: Schematic union coverage
  disposition: EXPLICIT_COVER_AXIOM_NOT_MATCHED
  interpretation: The six principal schematic categories are subclasses of SchematicEntity with disjointness, but
    SchematicEntity has no equivalentClass union in the complete source census. Entity instead has a SchematicEntity/NonSchematicEntity
    union. Those are distinct statements. Subclass/disjointness assertions alone do not supply the paper display5
    cover; global entailment remains unexecuted.
  basis: REVIEWER_INTERPRETATION
  artifact_locators:
  - SchematicEntity and Entity axioms; 2007 K005 PDF10; journal K005 PDF12 / printed81; journal K077 PDF24 / printed93
  source_query_id: Q06
  evidence_keys: &id011
  - execution
