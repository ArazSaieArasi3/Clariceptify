  - paper2008
  - mapped_extension_catalog
  positive_scenario: Classify an individual under a named schematic category when evidence supports it.
  adverse_scenario: Do not read Entity union or pairwise disjointness as the six-way SchematicEntity covering axiom.
  scenario_execution: NOT_EXECUTED_FULL_CORE_REASONER_REFUSED
  utilization_categories: &id012
