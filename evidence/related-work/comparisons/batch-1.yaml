common_scenario:
  id: CMP1-S01
  label: Conceptualization of a transit event
  positive: Agent Ada interprets a sensor report as an expression of a candidate Transit concept about observed
    event E; during episode T she chooses a definition and records decision D with evidence V and a stated
    rationale. Distinguish the content, expression, event referent, agent and process, and date the choice.
  adverse: Agent Ben realizes a copy of the report, while Ada conceptualizes a different description at another
    time; the report cites no evidence for D, and two descriptions have distinct identity. Do not equate agents,
    expressions, descriptions or episodes from nested existential witnesses, shared labels or missing named
    triples.
