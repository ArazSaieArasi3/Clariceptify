scenario:
  common: 'Ada at T chooses between two interpretations of a sensor observation E. She encodes concept K with linguistic expression X, puts the candidate in model M for a task, and records the evidence V and rationale J for her conceptual decision D. A later competing interpretation is retained. This is a reviewer scenario, not a joint source implementation.'
  adverse: 'The same word bank denotes two distinct expression individuals and does not collapse their referents; an OntoKADS A13 cutoff before any action presence creates no required participation; O4OA Core/Domain direction and 2.6/6.2 references disagree in its specification. None is silently repaired into a new class equivalence or executed across sources.'
  status: CONCEPTUAL_REVIEW_ONLY
