scenario:
  common: 'Ada interprets an observed event E and chooses a Transit concept at time T. A lexical entry with a form evokes a lexical concept and its sense refers to E; a SKOS concept belongs to a scheme with labels and a definition; a perception yields a description after a stimulus. Ada records decision D, supporting evidence V and a rationale R. Every proposed identity among these resources requires an explicit mapping.'
  adverse: 'Ben revises the rationale for a different conceptual choice while all lexical entry/concept links and SKOS labels stay fixed. A Perception individual can have no named hasOutput Description under a universal-only restriction; its sensor event need not be Ada''s referent E. Neither unchanged vocabulary links nor an absent named filler identifies Ada, T, V or D. This is a reviewer-constructed case, not an executed reasoner test.'
  status: CONCEPTUAL_REVIEW_ONLY
