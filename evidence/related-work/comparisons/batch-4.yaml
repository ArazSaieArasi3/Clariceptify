scenario:
  common: 'Ada observes a patient pulse E, forms a concept about it, writes a document M and selects a named cognitive construct K for interpretation at time T. She records conceptual decision D with evidence V and justification J. The document, a construct label, a thought object and E must not be assumed identical; mappings among source terms and Clariceptify IDs are candidate questions.'
  adverse: 'At T2 Ada learns her initial target identification was mistaken; a fictional or nonreferential concept is still intelligible. A Cognitive Atlas construct/contrast collision and a disputed measured_by edge cannot settle reference to E. In EFO a source concept representing targets of opposite reference status would inherit both statuses under A14/A15 if normalized with D1/D2. IAO release aboutness supplies an existential BFO entity without identifying the successful real-world referent, agent, error correction or D and J. This is a reviewer-constructed comparison, not an executed cross-ontology test.'
  status: CONCEPTUAL_REVIEW_ONLY
