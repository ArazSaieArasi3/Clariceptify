synthesis_export:
  target_issue: 126
  supported_partial_finding: 'IAO supplies content/bearer/aboutness distinctions; Cognitive Atlas supplies construct/task/contrast and curation resources; EFO supplies subject-specific concept/conception/thought-object and reference-status arguments. Each contributes to different parts of a conceptualization case.'
  qualified_candidate_gap: 'Across these exact selected sources and versions, a native, tested record joining Ada, T/T2, a revisable conceptual choice D, its content/referent and evidence V with justification J is not established. This is a bounded three-source result, not a universal absence or accepted novelty claim.'
  contrary_evidence: 'The 2015 IAO proposal discusses cognitive acts and historical content; Cognitive Atlas has contributors, discussion and citations in its native system; EFO directly models human possession and changing conception. None should be described as lacking these features altogether.'
  unresolved: ['IAO 2015-proposal versus 2026-release correspondence and BFO edition/profile', 'Cognitive Atlas 2011-native versus later export parity, ID collisions and profile failure', 'EFO executable root, symbol normalization and formal consistency', 'Other comparison batches #252/#255/#256 and O4OA #91']
  next_action: 'Combine with other bounded batches under #126 after their prerequisites; route any model or domain addition to #129 after owner review.'
