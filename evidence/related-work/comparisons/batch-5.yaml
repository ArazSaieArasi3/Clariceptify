synthesis_export:
  target_issue: 126
  supported_partial_finding: 'COM contributes agent/time-indexed mental aboutness; Representation contributes form/content/method and physical-realisation distinctions; CMO contributes conceptual/logical model and shared-vocabulary bridges. These overlaps are substantial and cannot be erased in a novelty claim.'
  qualified_candidate_gap: 'Within these exact selected papers and available artifacts, a native, tested, single record joining Ada’s dated/revisable conceptual decision, an explicitly intended or successful referent, cited evidence V, rationale J and guarded source-model bridge was not established. This is a bounded integration hypothesis, not a universal absence or a proof that Clariceptify already satisfies it.'
  contrary_evidence: 'COM already indexes mental states to an intentional agent and time; Representation explicitly binds content and form by method; CMO intentionally models conceptual knowledge, shared vocabulary and mapping policy. The missing original/formal versions limit every stronger conclusion.'
  discovery_questions:
    - {id: CMP5-Q01, related_gap_ids: [G01, G05], result: COM_AGENT_TIME_OVERLAP_AND_UNESTABLISHED_DECISION_PROVENANCE, test: Two agents and two times choose alternative concepts with distinct reasons and source evidence}
    - {id: CMP5-Q02, related_gap_ids: [G02], result: REPRESENTATION_FORM_CONTENT_AND_CMO_REFERENCE_OVERLAP_WITH_NO_COMBINED_SUCCESS_POLICY, test: Express a mistaken or fictional target without collapsing content into observed entity}
    - {id: CMP5-Q03, related_gap_ids: [G03], result: CMO_MAPPING_POLICY_NEEDS_QUALIFIER_IDENTITY_GUARDS, test: AdultPerson/MinorPerson share Person anchor while preserving competing interpretations and incompatible instance membership}
    - {id: CMP5-Q04, related_gap_ids: [G04, G05], result: REVISION_VALIDITY_AND_EVIDENCE_LINK_NOT_ESTABLISHED_IN_THESE_SELECTED_SOURCES, test: Late recording at T2 of a changed decision valid at T1}
  unresolved:
    - Original COM executable root and DOLCE edition
    - Representation host, formal bytes and proofs
    - Original CMO release and IAO/SKOS import closure
    - Other batches 252 and 256 plus O4OA 91
    - Cross-source compatibility and independent expert validation
  next_action: 'Integrate this four-dimension result with the remaining bounded batches under #126; do not add a class/domain/import until owner decision #129 with CQs, contrary evidence and scenario tests.'
