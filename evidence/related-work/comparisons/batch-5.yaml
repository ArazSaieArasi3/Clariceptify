scenario:
  common: 'Ada at T examines a patient pulse observation E, forms concept K and chooses one interpretation; she records a language expression X with form F and content C using method M. Her conceptual decision D cites evidence V and rationale J, with a subject and perspective. A later physical copy P can realize F without being the concept, content or target E. This is a reviewer-constructed case, not a combined model of the three source theories.'
  adverse: 'At T2 Ada revises D after learning that E was misidentified; a fictional target may still be expressed. If AdultPerson and MinorPerson concepts share Person as CMO primary anchor, an adult instance is not thereby a minor; a SKOS broader edge does not entail subclass. Two distinct encoding methods for the same F/C pair conflict with the selected Representation Ax9; unrestricted literal COM D1/D4 makes percept classification problematic. These are separate source-level and conceptual countercases, not an executed cross-ontology consistency test.'
  status: CONCEPTUAL_REVIEW_ONLY
