scenario:
  common: 'Ada at T evaluates an observation E and alternative concepts K1/K2, chooses K1 in conceptual decision D, cites evidence V and rationale J, and expresses content C in X. Bea transmits X but did not author it. Later evidence at T2 prompts Ada to revise D. This is a reviewer scenario, not a combined source theory.'
  adverse: 'Ada deliberates but forms no intention; Bea transmits a claim she does not endorse; a proposed service is not an achieved goal or actual satisfier. A mistaken target may still be expressed. These countercases block decision-to-intention, transmitter-to-author, assertion-to-truth and service-to-satisfaction shortcuts.'
  status: CONCEPTUAL_REVIEW_ONLY
