synthesis_export:
  target_issue: 126
  supported_partial_finding: 'I&DA distinguishes content, signs, communication and responsibility; BDI2020 models mental decision origins and intentional content; DOLCE Mental supplies agent/time, aboutness, need and goal predicates. Their overlap narrows any Clariceptify distinctiveness claim.'
  qualified_candidate_gap: 'In the inspected evidence, no verified single source-native and tested record combines a dated, revisable conceptual choice among alternatives, distinct production/transmission provenance, intended versus successful reference, evidence and rationale. This is a bounded integration question, not universal absence; existing Clariceptify IDs must be tested first.'
  contrary_evidence: 'BDI2020 already contains Dec/Int-Dec; I&DA already separates producer/transmitter and organizational truth attribution; DOLCE Mental already indexes agents, intentional content, goals and time. Paper-only/formal-source limits prevent stronger exclusion claims.'
  discovery_questions:
    - {id: CMP6-Q01, related_gap_ids: [G01, G05], test: 'Two agents, two alternatives and a hesitant decision at T with V and J'}
    - {id: CMP6-Q02, related_gap_ids: [G02], test: 'Express false or fictional content without assigning an external witness'}
    - {id: CMP6-Q03, related_gap_ids: [G03], test: 'Bea transmits Ada’s claim while a KB records a conflicting organizational viewpoint'}
    - {id: CMP6-Q04, related_gap_ids: [G04, G05], test: 'At T2 revise D while a proposed service remains unachieved'}
  unresolved: ['#246 original source and exact formula criteria remain open', '#252 batch 2 and #126 all-batch synthesis remain open', 'Cross-foundation semantic alignment, expert review and release gates remain open']
  next_action: 'Feed qualified cells into #126; evaluate existing IDs and CQ/countercase witnesses before proposing class/domain imports under #129.'
