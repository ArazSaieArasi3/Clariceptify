dimensions:
  D1_identity_coverage:
    statement: The retained 16-page HAL PDF consists of a cover and 15 printed article pages 140-154. All pages/sections/subsections,
      formal expressions, footnotes 1-4 and 56 references were inspected visually. Cover/article dates and license
      notices remain distinct. Publisher metadata verifies 2020/DOI/authors, while publisher PDF byte identity is
      not assumed. No diagram or table population is invented.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E19
    - M01
    - M02
  D2_problem_contribution:
    statement: The paper seeks detailed conceptual and formal characterization of BDI beyond loose mental-disposition/moment/state
      parent typing in previous work. Belief/desire have dispositional and occurrent faces; intention is a distinct
      action disposition arising from practical decision. This is substantive prior episode/decision/agency knowledge,
      but not a comprehensive conceptualization lifecycle or empirically demonstrated interoperability solution.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E05
    - E06
    - E07
    - E08
    - E18
  D3_method:
    statement: A named methodology section selects a dispositional approach with continuant/occurrent separation,
      sure-fire/single-track assumptions, earlier disposition identity/mereology and ONLY/PARTHOOD representations.
      The authors develop HEATER, philosophical counterexamples, alternative accounts and Manchester-style restrictions.
      They explicitly call some definitions elucidations. No named SABiO/DSR execution, ORSD, systematic source
      search, implemented ontology build procedure or external expert-validation sample is reported.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E03
    - E04
    - E05
    - E08
    - E19
  D4_requirements:
    statement: HEATER drives the account. Sleeping/paralyzed believers, defeated desires, intuitive decisions and
      mechanical button pressing expose intended distinctions. Agency/action are assumed and belief content is delimited
      rather than fully represented. No numbered CQ suite, operational user study, test oracle or complete requirements
      traceability matrix appears. Author vignettes and reviewer adverse fragment analyses are typed separately
      below.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E05
    - E06
    - E07
    - E10
    - E11
    - E14
  D5_concepts:
    statement: The catalog distinguishes mental token from propositional content, potential disposition from actual
      mental process, and originating decision from action realization. It also preserves triggers, realizations,
      basis, minimal/maximal processes, mode parthood and the alternative pleasure/good/reductive/Humean variants.
      Future risk, image-schema and recipe/prescription concepts are not described as implemented modules. No paper
      terminology count becomes an OWL declaration count.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E04
    - E05
    - E06
    - E07
    - E08
    - E12
    - E13
    - E15
    - E17
    - E18
  D6_relations_formalization:
    statement: All eight named core displays are captured, with 31 total reviewer expression records including one
      prose suggestion. ONLY universals constrain allowed realizations but do not entail occurrence. PARTHOOD uses
      per-individual Rmax schemas and explicitly notes a representation shortcoming. Int-Dec has an output-to-origin
      direction without the converse. Alternatives and optional hypotheses are tagged; missing agent/time/disjointness
      constraints and shorthand syntax are not silently repaired or solved.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E04
    - E09
    - E10
    - E11
    - E12
    - E13
    - E14
    - E15
    - S01
  D7_grounding:
    statement: The paper uses continuant/occurrent and dispositional categories, cites the BFO book for elucidation/adequatism
      and borrows OBI output-relation names. It does not pin an executable root or an upper-ontology edition. MF/UFO-C
      are related-work examples, not proof of UFO grounding. Disposition identity is described through categorical
      basis and process classes; actual neural basis, temporal/bearer identity and parameterized machine translation
      remain unresolved.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E03
    - E04
    - E05
    - E08
    - E09
    - E18
    - E19
  D8_artifact_correspondence:
    statement: 'Primary author/publisher links, three bounded repository queries, title-code search and other-host
      searches are recorded. No author executable 2020 BDI distribution was resolved. Secondary commentary, a citation
      in Sobots and unverified broad References repositories are not original modules. Current FOSSR files remain
      separate #249/#250. Complete local/imported class definitions, exact imports, IRIs, license and machine-profile/reasoner
      results stay unknown in #247.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E19
    - M01
    - M02
  D9_evaluation:
    statement: Evidence consists of philosophical arguments, the HEATER illustration, counterexamples and comparative
      theory sketches. The paper reports no named parser/reasoner/SHACL run, CQ regression, empirical dataset, expert
      sample, performance benchmark or explicit model-finder compatibility proof. Five VVEAA functions below separate
      this conceptual evidence from our executed provenance checks; the word compatible in the paper does not establish
      a solver result.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E05
    - E06
    - E07
    - E08
    - E09
    - E10
    - E11
    - E12
    - E13
    - E14
    - E15
    - E18
  D10_critical_synthesis:
    statement: 'Useful overlap includes episode-to-intention output, unrealized dispositions, creation-versus-triggering
      and competing process models. Risks include vacuous only constraints, source syntax/label mismatches, absent
      same-agent/time constraints, incomplete mereological sum/non-reductivity semantics and alternative theories
      requiring axiom rejection. Later comparison #256 and final #126 must preserve contrary evidence; no automatic
      adoption or corpus-wide novelty conclusion follows.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E04
    - E08
    - E09
    - E10
    - E11
    - E12
    - E13
    - E14
    - E15
    - E17
    - E18
catalog:
- id: C01
  label: Continuant
  statement: An entity that persists through time; objects and dispositions are treated on this side of the process
    distinction.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  kind: PAPER_CONCEPT
  iri: null
  source_definition: Attributed reviewer paraphrase of the cited paper passage; not a released annotation.
  source_proposal_basis: AUTHOR_REPORTED
- id: C02
  label: Occurrent / process
  statement: An entity extending through time with temporal parts, typically with a continuant participant. Event/state
    terms are deliberately avoided for simplicity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  kind: PAPER_CONCEPT
  iri: null
  source_definition: Attributed reviewer paraphrase of the cited paper passage; not a released annotation.
  source_proposal_basis: AUTHOR_REPORTED
- id: C03
  label: Mental process
  statement: A process in mental life, including actively taking something to be the case, wanting and bias-driven
    belief formation. Not a specified neural implementation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E06
  - E14
  kind: PAPER_CONCEPT
  iri: null
  source_definition: Attributed reviewer paraphrase of the cited paper passage; not a released annotation.
  source_proposal_basis: AUTHOR_REPORTED
- id: C04
  label: Disposition
  statement: A bearer property with a possible realization behavior and process trigger; it may exist untriggered
    or unrealized. Sure-fire/single-track is the default scope unless relaxed.
