  evidence:
  - E03
  - E09
  followup_issue: 247
- id: F04
  label: PARTHOOD is an individual-indexed schema
  statement: Rmax(bel/des/i) is parameterized; authors explicitly note one axiom per belief individual. A class-name
    template is not automatic higher-order quantification in OWL. Minimal-trigger/maximal-realization existence
    and finiteness are not established by the paper.
