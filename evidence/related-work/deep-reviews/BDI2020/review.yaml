- id: F02
  label: 'Strength: inactive versus active mentality'
  statement: The dispositional/occurrent distinction preserves dormant and defeated beliefs/desires while treating
    intention as an action disposition. This is substantive prior overlap for episode/mental-knowledge modeling,
    without assuming exact equivalence to Clariceptify.
