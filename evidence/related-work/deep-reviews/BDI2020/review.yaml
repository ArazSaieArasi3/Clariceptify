scenarios:
- id: S01
  label: HEATER author scenario
  statement: John wants warmth, believes that pressing a heater button activates heating and acts after intending
    to press. This is the conceptual running example, not an observed participant study.
  basis: AUTHOR_REPORTED
  evidence:
  - E02
- id: S02
  label: Sleeping or paralyzed believer
  statement: Belief persists without current mental activation or physical ability; an action-only reduction of
    all belief misses the intended case. The omniscient spirit is a philosophical counterexample, not a dataset
    record.
  basis: AUTHOR_REPORTED
  evidence:
  - E05
- id: S03
  label: Competing warmth and energy desires
  statement: An active warmth desire need not cause an action when outweighed by energy saving; a distinct belief
    can instead support wearing a sweater.
  basis: AUTHOR_REPORTED
  evidence:
  - E06
- id: S04
  label: Blocked and heuristic intention
  statement: A remembered email or sudden paralysis can stop realization; an intention can arise intuitively rather
    than through reflective deliberation.
  basis: AUTHOR_REPORTED
  evidence:
  - E07
- id: S05
  label: Mechanical versus intentional press
  statement: A heavy object can push the same finger/button mechanically. Different trigger classes distinguish
    that disposition from intention; an action-shaped outcome alone is insufficient.
  basis: AUTHOR_REPORTED
  evidence:
  - E07
- id: S06
  label: Allergy and fruit choice
  statement: Wanting to avoid an allergic crisis need not require active allergy belief; apple/peach competition
    leaves desire weighting unresolved.
  basis: AUTHOR_REPORTED
  evidence:
  - E10
- id: S07
  label: Mary singing opportunity
  statement: An active belief that training has reached a sufficient level triggers the already-held competition
    intention in an optional hypothesis.
  basis: AUTHOR_REPORTED
  evidence:
  - E11
- id: S08
  label: Heater/sweater second-order modes
  statement: One alternative models two action dispositions as mod-parts; another has a mental process produce a
    first-order intention. Their axiom commitments differ.
  basis: AUTHOR_REPORTED
  evidence:
  - E12
- id: S09
  label: Lottery wishful thinking
  statement: A pre-existing bias is triggered by a lottery desire and its realization creates a new lucky-number
    belief; newly created belief is not its own pre-existing trigger target.
  basis: AUTHOR_REPORTED
  evidence:
  - E14
- id: S10
  label: Moral and affordance illustrations
  statement: Moral-belief-only motivation challenges the chosen Humean core; stairs support and climbing are coupled
    realizations in the suggested affordance link.
  basis: AUTHOR_REPORTED
  evidence:
  - E15
  - E16
- id: S11
  label: Positive local core fragment
  statement: A disposition b:Dispositional belief with realized_in(b,o) and o:Occurrent belief fits BelO locally.
    A separate decision p with relevant belief/desire parts and specified_output_of(i,p) for an intention i illustrates
    Dec/Int-Dec. This is reviewer reasoning on declared fragments, not a satisfying witness for a full recovered
    ontology.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
- id: S12
  label: Adverse only-to-exists inference
  statement: An individual with no realized_in fillers satisfies a universal-only restriction. BelO/DesO/IntO do
    not guarantee occurrence or encode a counterfactual can-be-realized modality by themselves. This fragment observation
    is not an executed ontology test.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E09
- id: S13
  label: Adverse automatic decision output
  statement: A decision with belief/desire parts but no asserted intention is explicitly allowed. Int-Dec cannot
    be reversed into a requirement that every decision produces an intention; open-world lack of an assertion is
    also not proof of no output.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
- id: S14
  label: Adverse shared or foreign process parts
  statement: Absent disjointness and same-agent restrictions, Dec does not independently force two distinct fillers
    belonging to the deciding agent. Additional background axioms could constrain this; none was acquired or executed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E10
- id: S15
  label: Adverse alternatives union
  statement: Merging the action/pleasure/good alternatives into the non-reductive core conceals the authors explicit
    axiom-rejection choices. Do not claim automatic inconsistency without class-disjointness/background assumptions;
    treat variants separately.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - E13
- id: S16
  label: Adverse exact-sum interpretation
  statement: The compound alternative requires some belief/desire parts, but those restrictions do not enforce an
    exact sum, prohibit additional parts or supply the intended parthood species.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
- id: S17
  label: Adverse wrong-content bias output
  statement: The wishful-thinking output restrictions require a dispositional belief if realized, but do not formally
    guarantee that its content matches the triggering desire. Trigger-versus-created-output and same-agent/temporal
    identity need deeper checks.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E14
  - E17
- id: S18
  label: Adverse source-version substitution
  statement: A later FOSSR BDI OWL module cannot become the 2020 author artifact from sharing BDI vocabulary. Paper
    concepts, references and publisher PDF availability do not establish machine-source identity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E02
  - E19
- id: S19
  label: Adverse triggering versus formation
  statement: If the lucky belief does not yet exist, treating a desire as triggering that same belief collapses
    creation and activation. The additional existing dWISH solves the narrative distinction, while exact temporal
    constraints are not in the displayed schema.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E14
- id: S20
  label: Adverse sure-fire and blocked realization
  statement: The default sure-fire premise and blocked-intention examples require clear occurrence/masking/trigger
    conventions; their coexistence is a qualification question, not a demonstrated logical inconsistency.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E07
  - E11
