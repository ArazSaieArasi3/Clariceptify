      hotel/location and payment-notification examples cover positive cognitive chains and adverse context changes.
      A.1 maps valid-at-time to CQ18 although Table 1 assigns CQ17; A.3 repeats a dynamics heading. Requirements
      about time/ordered sequences/revision are stronger than what a bare existential or transitive relation alone
