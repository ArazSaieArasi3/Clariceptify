  D1_identity_coverage:
    statement: All 21 pages, sections/subsections, one figure, three tables, two appendices, 78 numbered formulas,
      19 numbered footnotes and 37 references were read and visually checked. The retained historical 2025 filename
      contains arXiv v2 dated 2026-08-09. Nine authors and journal DOI metadata are verified separately; final journal
