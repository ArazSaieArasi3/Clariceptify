- id: F15
  label: Small selective LAG effect with an admitted confound
  statement: Reported 2/9 inference differences, 13 selected cases from 47 tasks and partly qualitative modeling
    are proof-of-feasibility evidence. The authors explicitly acknowledge prompt confounding. No general error reduction,
    statistically controlled effect or independent reproducibility result follows.
