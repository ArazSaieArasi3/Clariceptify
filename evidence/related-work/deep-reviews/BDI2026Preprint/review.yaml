- id: F13
  label: Structural metrics require denominators and semantic checks
  statement: Table 2 metrics are author-reported. For example, 71/(71+72) is about 0.497, not the stated relationship-richness
    0.51 if those are the intended populations; 22/71 is about 0.310 whereas 22/(71+72) is about 0.154 near the
    printed class/relation 0.15. Different counting conventions may explain the values, but no formula/input version
