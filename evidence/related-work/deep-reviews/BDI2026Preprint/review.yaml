- id: F14
  label: Location propensity is not logical impossibility
  statement: Home/hotel and work/shopping conclusions depend on contextual preconditions; remote check-in or online
    purchasing are adverse cases. Annotation agreement and a plausible label are not formal disjoint-location or
    task-exclusion axioms.
