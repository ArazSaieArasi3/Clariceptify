  statement: The printed graph anchors WorldState, not any generating process or B/D/I state, at 10:15; no propagation
    chain is supplied. A candidate plan-manager task is in prose but not RDF. Intention also triggers its generating
    process, so temporal order is not entailed merely by the arrows.
