scenarios:
- id: S01
  label: Degree motivation and composition
  statement: Mark's employment/aptitude beliefs motivate graduating, with thesis/exam activities. Positive traceability
    example, not a proof that cross-type parts satisfy homogeneous parthood restrictions.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E16
  - E19
  scenario_kind: AUTHOR_EXAMPLE
- id: S02
  label: Exam failure and resit revision
  statement: An external failure notification revises earlier academic belief, priorities, intentions and study
    plan; distinguish a described revision requirement from an implemented invalidation/versioning algorithm.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E17
  - E20
  - E23
  scenario_kind: AUTHOR_ADVERSE_EXAMPLE
- id: S03
  label: Ordered degree plan and registration window
  statement: Enrollment, attendance, exam registration, fees and graduation have dependencies and valid windows.
    The paper requires querying sequence/history; transitivity and endpoints alone do not ensure every task lies
    in a unique finite order.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E18
  - E21
  - E23
  scenario_kind: AUTHOR_EXAMPLE
- id: S04
  label: Belief time/location decomposition
  statement: Meeting-at 10 in Room 5 decomposes a belief into content components. Homogeneous Belief-part restrictions
    mean those components need belief typing; they are not directly a timestamp literal or room individual.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
  scenario_kind: AUTHOR_EXAMPLE
- id: S05
  label: Epidemiological belief revision
  statement: A monitoring agent revises outbreak belief on new health reports. This is an illustrative cognitive
    process, not a medical inference experiment or evaluated policy intervention.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E20
  scenario_kind: AUTHOR_EXAMPLE
- id: S06
  label: Climate-policy desire formation
  statement: Economic/environmental reports lead to a subsidy-support desire; process subclassing types the affected
    state, without implementing motivation weights.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E20
  scenario_kind: AUTHOR_EXAMPLE
- id: S07
  label: Compliance-report intention formation
  statement: An agent selects/refines an intention to verify regulation implementation after feasibility consideration.
    No comparative plan-selection benchmark is supplied.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E20
  scenario_kind: AUTHOR_EXAMPLE
- id: S08
  label: Announcement justification
  statement: A meeting-postponement belief is linked to an announcement rationale. The explicit description makes
    support inspectable without proving that the source or claim is true.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E20
  scenario_kind: AUTHOR_EXAMPLE
- id: S09
  label: Medical-supply route planning
  statement: Disaster-response planning selects route/resources for delivery; optimum/feasible outcome is narrative
    intent, not entailed by some defines.Plan.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E21
  scenario_kind: AUTHOR_EXAMPLE
- id: S10
  label: Hotel/home corrective intention
  statement: Hotel check-in at home yields a contextual justification and alternative home plan. The displayed goal
    distinction does not formalize contradictory propositions, exclusivity or action impossibility.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E10
  scenario_kind: AUTHOR_EXAMPLE
- id: S11
  label: Water filters at work alternative
  statement: An agent may purchase filters online while at work; remote hotel check-in may also be possible. Likely
    task location is not a universal logical precondition, so contextual gold standards need an explicit application
    assumption.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E09
  - E10
  scenario_kind: REVIEWER_COUNTEREXAMPLE
- id: S12
  label: Payment notification cognitive chain
  statement: A10:15 request triggers belief/desire/intention processes and a payment intention. Only the request
    WorldState has atTime in the printed graph; prose generation-time/ordered-workflow claims need additional assertions
    or rules.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
  scenario_kind: AUTHOR_EXAMPLE
- id: S13
  label: SEMAS scholar-KG loop
  statement: Approximately 100, 000 scholar/coauthor triples feed a preliminary DerivedBelief/rule system and projected
    RDF results. This is not an independent execution against selected core 0.5.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
  scenario_kind: AUTHOR_HISTORICAL_EXAMPLE
- id: S14
  label: Neutral belief overcommitment
  statement: Asserting a Belief that need not motivate action still entails some Desire and Intention witnesses
    under 14/15. This is a logical reading of the printed fragment, not a measured failure of the full ontology.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
  - E20
  scenario_kind: REVIEWER_ADVERSE_FRAGMENT
- id: S15
  label: Perceived versus unperceived world state
  statement: WorldState plus no isPerceivedBy edge satisfies the all-only axiom 2 vacuously; the prose statement
    that the pair ensures a perceiver is not established by 2 alone.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
  scenario_kind: REVIEWER_ADVERSE_FRAGMENT
- id: S16
  label: Untriggered mental process
  statement: MentalProcess without an isTriggeredBy edge is not excluded by 28, although 26/27/29 still require
    agent/input/effect witnesses. No implicit trigger event is derived from an all-only restriction.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E20
  scenario_kind: REVIEWER_ADVERSE_FRAGMENT
- id: S17
  label: Mixed Desire/Belief parts
  statement: 'A Desire with a Belief hasPart filler would force that filler to Desire under 17; together with global
    Belief/Desire disjointness it is inconsistent if both assertions hold. This is a fragment argument; acquired
    fixtures and joint reasoning remain #250.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E19
  - R03
  scenario_kind: REVIEWER_ADVERSE_FRAGMENT
- id: S18
  label: Same-agent cognitive chain
  statement: Two agents can own linked Belief/Desire/Intention tokens without any printed equality join forcing
    one deliberating owner. Add no unapproved same-agent axiom; use this as a later test question.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
  - E20
  - E22
  scenario_kind: REVIEWER_ADVERSE_FRAGMENT
- id: S19
  label: Unexecuted intention
  statement: An Intention has some Plan 46; this does not require an actual PlanExecution, an Action for every Task,
    or achieved Goal. Keep desire fulfillment links separate from physical success.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E21
  - E22
  scenario_kind: REVIEWER_ADVERSE_FRAGMENT
- id: S20
  label: Self-subplan and branched task graph
  statement: The some Plan part 58 allows a self-related witness unless additional properness constraints forbid
    it; transitive task order alone permits incomparable branches. Neither an infinite distinct decomposition nor
    a total order follows from these formulas.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E21
  scenario_kind: REVIEWER_ADVERSE_FRAGMENT
- id: S21
  label: Open end and equal endpoint names
  statement: A TimeInterval may omit an end under 76. Two endpoint names may co-refer, while an explicitly different
    second end would conflict with max 1. Qualified counting is distinct from closed-world field checking or start-before-end
    arithmetic.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E23
  scenario_kind: REVIEWER_ADVERSE_FRAGMENT
- id: S22
  label: Both temporal obligations
  statement: Every MentalEntity needs both some atTime and some hasValidity under 77/78, even when prose says either
    view. This still does not guarantee named/retrievable timestamps or infer a state's generation instant from
    an event's anchor.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
  - E23
  scenario_kind: REVIEWER_ADVERSE_FRAGMENT
evaluation:
  Verification:
    statement: OWL2/SRIQ(D), 547 axioms/288 logical axioms and OWLUnit CQ validation are author-reported. Actual
      work here is source hashing, API blob correspondence, two-file RDF header parsing and repository integrity/coverage
      checks. No author profile checker, reasoner, import closure, CQ test or LLM/SEMAS experiment was run. Printed/formal/example
      mismatch findings are fragment analyses, not claims of joint satisfiability.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E07
    - E19
    - E20
    - E21
    - E23
    - R01
    - R02
    - R03
    - R05
  Validation:
    statement: Literature, collaborating experts, 18 CQs and three stories support intended scope. Expert sample
      size/protocol, agreement, independent domain validation and a complete observed CQ pass matrix are not reported
      in the selected text. The generated examples are explicitly illustrative, with generation-time and context-logic
      gaps preserved.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E04
    - E10
    - E11
    - E16
    - E17
    - E18
  Evaluation:
    statement: Authors report 20 structural metrics and a GPT-4o comparison on 13 manual cases selected from 47
      filtered MS-LaTTE tasks. Only 2/9 inference subtests add detections; modeling is plausibility-oriented. Prompt
      confounding, small partly qualitative sample and historical SEMAS version are explicit limitations, so no
      general accuracy/effect-size or runtime conclusion follows.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E07
    - E08
    - E09
    - E12
    - E13
    - E14
  Assessment:
    statement: Strengths include modular concepts, broad traceability and explicit conflict/application limits.
      Adverse findings examine optionality versus existence, homogeneous composition, temporal/order assumptions,
      generated vocabulary, empirical context and current alignment mismatch. There is no justified cross-corpus
      quality rank or automatic adoption decision.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E05
    - E10
    - E11
    - E12
    - E19
    - E20
    - E21
    - E23
    - R02
  Assurance:
    statement: Public commit/blob hashes, retained source digests, scholarly version metadata, ontology-specific
      license notice and acquired test documentation support provenance. They are not a certification, independent
      reproduction or long-term correctness guarantee. Final text equivalence, all-class/imported glossary and semantic
      acceptance remain open; Clariceptify scientific baseline is protected separately.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E07
    - M01
    - R01
    - R02
    - R03
    - R04
    - R05
findings:
- id: F01
  label: Traceable reusable architecture
  statement: The paper provides a broad, explicit requirement/story/taxonomy/formalization chain and carefully separates
    cognitive states, mental activity, specifications and enactments. This is substantial reusable prior structure
    for future comparison.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E04
  - E05
  - E06
  - E16
  - E17
  - E18
  - E19
  - E21
  - E22
  finding_kind: STRENGTH
  followup_issue: 256
- id: F02
  label: Exact v2 identity and final-text gap
  statement: 'The retained filename''s 2025 label is not its actual version: PDF margin and official metadata identify
    v2 from 2026-08-09. A final journal DOI/listing does not establish byte or semantic equivalence.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - M01
  finding_kind: VERSION_LIMIT
  followup_issue: 250
- id: F03
  label: Existential commitment for every belief
  statement: 14/15 (repeated 39/40) force each belief to motivate a Desire and support an Intention. This goes beyond
    allowing an optional deliberative link and warrants a neutral-belief test against intended scope.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
  - E20
  finding_kind: SEMANTIC_QUESTION
  followup_issue: 250
- id: F04
  label: Universals do not supply perception or trigger events
  statement: 2, 8 and 28 are all-only restrictions. Their typing does not entail a perceiver, cognised entity or
    trigger edge on its own; other existential restrictions must be analyzed separately.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
  - E20
  finding_kind: FORMAL_LIMIT
  followup_issue: 250
- id: F05
  label: Foundation typing and identity need exact closure
  statement: MentalProcess is MentalEntity/d0:Activity while MentalEntity is d0:CognitiveEntity, and prose describes
    persistent states versus perdurants. Compatibility and complete identity/dependence criteria require the actual
    d0/DUL versions; no unsatisfiability result is claimed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E19
  - E20
  - R02
  finding_kind: UNRESOLVED
  followup_issue: 250
- id: F06
