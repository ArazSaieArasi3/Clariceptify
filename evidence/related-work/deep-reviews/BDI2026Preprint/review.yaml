catalog:
- id: C001
  label: Agent
  statement: An autonomous bearer of mental states who perceives world states, cognises mental entities, processes
    mental activity and carries out actions/executions. Existentials constrain all instances, without giving a sufficient
    agency-recognition definition.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E19
  kind: FIGURE_CLASS
  source_definition: Attributed paraphrase of the selected paper, not a released-class definition glossary.
  diagram_figure: 1
  iri: https://w3id.org/fossr/ontology/bdi/Agent
- id: C002
  label: WorldState
  statement: An environmental/contextual configuration to which mental content is directed; described both independently
    of agent perspective and as perceived by an agent. d0:Eventuality alignment requires separating actuality, possibility
    and perceived content.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E05
  - E19
  kind: FIGURE_CLASS
  source_definition: Attributed paraphrase of the selected paper, not a released-class definition glossary.
  diagram_figure: 1
  iri: https://w3id.org/fossr/ontology/bdi/WorldState
- id: C003
  label: MentalEntity
  statement: Broad category of cognitive contents/constructs held by agents, including states and processes; typed
    under d0:CognitiveEntity, compositional and obligatorily directed toward some WorldState with time and validity
    witnesses.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E19
  - E20
  - E23
  kind: FIGURE_CLASS
  source_definition: Attributed paraphrase of the selected paper, not a released-class definition glossary.
  diagram_figure: 1
  iri: https://w3id.org/fossr/ontology/bdi/MentalEntity
- id: C004
  label: MentalState
  statement: MentalEntity specialization for the informational, motivational and deliberative states; its hasPart
    fillers remain MentalState. Prose persistence as an endurant does not by itself supply a temporal identity criterion.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E06
