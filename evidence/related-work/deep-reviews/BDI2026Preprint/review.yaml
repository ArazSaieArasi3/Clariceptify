  statement: Hotel RDF uses fulfills rather than fulfils and additional occursAt/requiresWorldState/hasLocation
    predicates absent from the printed formal definitions. owl:differentFrom distinguishes goal individuals without
    proving mutually exclusive outcomes. These require an explicit extension/alias/constraint policy.
