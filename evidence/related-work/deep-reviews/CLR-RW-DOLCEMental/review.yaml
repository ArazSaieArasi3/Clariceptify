catalog:
- id: C01
  label: Need / what is needed
  statement: Mental attitude and its satisfier are explicitly distinguished; the initial three uses describe
    events or conditions needed, not three definitions of a mental state.
  evidence:
  - E02
  - E08
  basis: AUTHOR_REPORTED
- id: C02
  label: MS / Mental state
  statement: A state/perdurant depending on a physical agent; no neural-reduction criterion or full internal
    content structure given.
  evidence:
  - E09
  - E10
  - E11
  basis: AUTHOR_REPORTED
- id: C03
  label: ST / State
  statement: DOLCE cumulative/homeomeric perdurant; selected account abstracts from process articulation.
  evidence:
  - E09
  basis: AUTHOR_REPORTED
- id: C04
  label: Perdurant / event (broad)
  statement: Paper uses event broadly for states, processes and events in the narrower sense; examples of services
    are token occurrences.
  evidence:
  - E05
  - E09
  basis: AUTHOR_REPORTED
- id: C05
  label: Endurant
  statement: Contrasted with mental-state perdurants and mentioned in elliptical object-language interpretations.
  evidence:
  - E08
  - E09
  basis: AUTHOR_REPORTED
- id: C06
  label: T / Time interval
  statement: Time argument of participation, presence, classification and attitudes; no numerical date model
    supplied.
  evidence:
  - E09
  - E12
  basis: AUTHOR_REPORTED
- id: C07
  label: APO / Agentive physical object
  statement: Participating agent type in a2/a3; physical-agent uniqueness is not a theory of PA collective
    mental states.
  evidence:
  - E09
  - E10
  basis: AUTHOR_REPORTED
- id: C08
  label: C / Social concept
  statement: Intersubjective particular accepted by a community and described linguistically; chosen as content
    bearer, not a private mental item or OWL class.
  evidence:
  - E05
  - E11
  basis: AUTHOR_REPORTED
- id: C09
  label: BS / Belief state
  statement: Prose-stated disjoint MS subtype, associated with informational mode; complete bel definition
    is not printed.
  evidence:
  - E07
  - E11
  basis: AUTHOR_REPORTED
- id: C10
  label: DS / Desire state
  statement: Prose-stated disjoint MS subtype; des is projected from participation and directedness.
  evidence:
  - E07
  - E11
  - E12
  basis: AUTHOR_REPORTED
- id: C11
  label: IS / Intention state
  statement: Prose-stated disjoint MS subtype with deliberative commitment; no printed int definition or complete
    action-persistence axioms.
  evidence:
  - E07
  - E11
  basis: AUTHOR_REPORTED
- id: C12
  label: NS / Need state
  statement: Prose-stated disjoint mental subtype; cannot be inferred merely from an instrumental goal or service
    request.
  evidence:
  - E11
  - E13
  basis: AUTHOR_REPORTED
- id: C13
  label: Intentionality
  statement: Being about something, distinguished into directedness and reference; not identical to intention
    as a BDI attitude.
  evidence:
  - E03
  - E07
  basis: AUTHOR_REPORTED
- id: C14
  label: Intentional content / intCon
  statement: Time-indexed role played by a social concept in directedness; not a separate copy of the concept.
  evidence:
  - E04
  - E05
  - E11
  basis: AUTHOR_REPORTED
- id: C15
  label: Intentional object / intObj
  statement: Time-indexed role of an entity in reference; no ontological multiplication of Varenne and intentional
    Varenne.
  evidence:
  - E04
  - E11
  basis: AUTHOR_REPORTED
- id: C16
  label: Directedness / aboutness1 / about1
  statement: Content relationship; philosophical binary account becomes a time-indexed ternary predicate in
    formulas.
  evidence:
  - E03
  - E05
  - E10
  basis: AUTHOR_REPORTED
- id: C17
  label: Reference / aboutness2 / about2
  statement: Relationship to classified entities; can have no fillers or several, while content remains determinate.
  evidence:
  - E03
  - E05
  - E11
  basis: AUTHOR_REPORTED
- id: C18
  label: Classification / cf
  statement: Social concept classifies an entity at a time; different concepts may classify the same event
    without becoming identical.
  evidence:
  - E05
  - E11
  basis: AUTHOR_REPORTED
- id: C19
  label: Presence / pre
  statement: Existing-at-time relation used for satisfiers; distinct from quantification over possibilia.
  evidence:
  - E09
  - E12
  basis: AUTHOR_REPORTED
- id: C20
  label: Participation / pc
  statement: Agent/entity, perdurant and time relation; some participation witnesses and aboutness witnesses
    need not be at the same time in the printed axioms.
  evidence:
  - E09
  - E10
  basis: AUTHOR_REPORTED
- id: C21
  label: bel / believes
  statement: Agent-content-time attitude described by analogy to des; not a printed labeled definition.
  evidence:
  - E11
  basis: AUTHOR_REPORTED
- id: C22
  label: des / desires
  statement: Agent-content-time projection through a DS, participation and about1, d4.
  evidence:
  - E12
  basis: AUTHOR_REPORTED
- id: C23
  label: int / intends
  statement: Agent-content-time attitude described, but not explicitly defined by a displayed formula.
  evidence:
  - E11
  basis: AUTHOR_REPORTED
- id: C24
  label: need0
  statement: Agent-content-time projection through NS, d5; not the NS entity or an event satisfier.
  evidence:
  - E12
  - E13
  basis: AUTHOR_REPORTED
- id: C25
  label: goal
  statement: Desire or mental need compatible with the agent's other desires/needs; printed d6 lacks three
    closing parentheses.
  evidence:
  - E12
  basis: AUTHOR_REPORTED
- id: C26
  label: sat / Satisfier
  statement: Same-time presence plus concept classification; existing event is intended in prose but the display
    has no explicit PER guard.
  evidence:
  - E12
  basis: AUTHOR_REPORTED
- id: C27
  label: Temporal precedence / strict order
  statement: Order between attitude intervals; material satisfaction implication is not causation or a full
    temporal/modal semantics.
  evidence:
  - E12
  basis: AUTHOR_REPORTED
- id: C28
  label: igoal / instrumental goal
  statement: Goal with a later goal and a satisfaction-existence implication, d8; later target is not explicitly
    restricted to egoal.
  evidence:
  - E08
  - E12
  basis: AUTHOR_REPORTED
- id: C29
  label: egoal / end goal
  statement: Goal that is not instrumental, d9; negative definition does not itself encode intrinsic value
    or fundamental harm.
  evidence:
  - E08
  - E12
  basis: AUTHOR_REPORTED
- id: C30
  label: need1
  statement: Relation identical to igoal in d10; need1 does not necessarily arise from a need state.
  evidence:
  - E13
  basis: AUTHOR_REPORTED
- id: C31
  label: need2
  statement: Necessary instrumental relation strengthening igoal in d11; entails need1, not necessarily need0.
  evidence:
  - E13
  basis: AUTHOR_REPORTED
- id: C32
  label: need3 / absolute or basic need
  statement: Only constrained to egoal and need0 by d12; no sufficient-condition definition or harm discriminator
    supplied.
  evidence:
  - E08
  - E13
  basis: AUTHOR_REPORTED
- id: C33
  label: Founded property / generic foundation
  statement: Role dependence on another property and association outside parthood; philosophical modality is
    not fully encoded in d2/d3.
  evidence:
  - E04
  - E05
  basis: AUTHOR_REPORTED
- id: C34
  label: Anti-rigidity / rigidity / identity
  statement: Role can be ceased without loss of the underlying entity's identity; content/object roles do not
    create new bearer entities.
  evidence:
  - E04
  - E05
  basis: AUTHOR_REPORTED
- id: C35
  label: One-sided / mutual foundation
  statement: Student/university and spouse examples distinguish asymmetrical and mutual generic foundation.
  evidence:
  - E04
  basis: AUTHOR_REPORTED
- id: C36
  label: Role / monadic property
  statement: Property predicable of heterogeneous entity kinds in a relational context; timed intCon/intObj
    predicates are distinct from a new rigid kind.
