evidence:
- id: E01
  pages:
  - 1
  locator: PDF 1 / printed 125, title, abstract and publication block
  summary: Biccheri/Ferrario/Porello; FOIS2020, pages125-139, DOI 10.3233/FAIA200666; paper CC BY-NC4.0, not
    a blanket source-code license.
- id: E02
  pages:
  - 1
  - 2
  - 3
  locator: PDF 1-3 / printed 125-127, section 1 and notes 1-2
  summary: Need-driven PA services; self/hetero-ascription, reactive/proactive/predictive distinction; three
    uses initially describe what is needed, rather than mental states themselves.
- id: E03
  pages:
  - 3
  - 4
  locator: PDF 3-4 / printed 127-128, section 2 opening and 2.1, note 3
  summary: Directedness/content versus reference/object; content can exist without an existing referent; philosophical
    intentionality is not identical to intensional linguistic contexts.
- id: E04
  pages:
  - 5
  - 6
  locator: PDF 5-6 / printed 129-130, section 2.2 and notes 4-7
  summary: Intentional objects treated as non-multiplicative founded anti-rigid roles; generic foundation differs
    from parthood; Varenne and Naples examples.
- id: E05
  pages:
  - 6
  - 7
  - 8
  locator: PDF 6-8 / printed 130-132, section 2.3 and notes 8-10
  summary: DOLCE chosen; social concepts are intersubjective particulars defined through descriptions; time-indexed
    classification; shared concepts, multiple descriptions of events and empty extensions.
- id: E06
  pages:
  - 8
  locator: PDF 8 / printed 132, Figure 1
  summary: 'Three boxes: mental state, intentional content/social concept, intentional object/reference; aboutness1,
    aboutness2 and classification arrows. No class hierarchy or cardinality labels.'
- id: E07
  pages:
  - 8
  - 9
  locator: PDF 8-9 / printed 132-133, section 3 opening, notes 11-14
  summary: BDI comparison and three explicit questions about need kind/content/object; informational/motivational/deliberative
    modes. Needs assumed distinct from desire/belief/intention; no empirical cognitive criterion supplied.
- id: E08
  pages:
  - 9
  - 10
  locator: PDF 9-10 / printed 133-134, section 3 need distinctions
  summary: Need1 sufficient instrumental goal, need2 necessary-and-sufficient instrumental goal, need3 absolute/end
    need; object nouns interpreted elliptically as events.
- id: E09
  pages:
  - 10
  - 11
  locator: PDF 10-11 / printed 134-135, section 4 background and notes 15-17
  summary: DOLCE D18 and DOLCE-CORE references; mental states as states/perdurants, participation/APO, presence
    and time; author reports implementation/consistency/consequence tests in linked file.
- id: E10
  pages:
  - 11
  locator: PDF 11 / printed 135, displays a1-a6 and note 18
  summary: State subtype, existence and cross-time APO-agent uniqueness; about1 typing, existential content
    and cross-time uniqueness. Outer free variables are not explicitly universally quantified in the printed
    displays.
- id: E11
  pages:
  - 11
  locator: PDF 11 / printed 135, d1-d3 and notes 19-21
  summary: Reference definition from content classification; time-indexed content/object roles; prose respectively
    reverses their bearers. Impossible concepts require relaxing a DOLCE constraint. BS/DS/IS/NS are prose-stated
    disjoint subtypes.
- id: E12
  pages:
  - 12
  locator: PDF 12 / printed 136, d4-d9 and notes 21-23
  summary: Desire/need0 projections, goal compatibility, satisfier, instrumental/end goals. d6 has three unclosed
    parentheses as printed; prose refers to a8 where the displayed instrumental-goal label is d8. Future-indexed
    concepts postponed.
- id: E13
  pages:
  - 12
  - 13
  locator: PDF 12-13 / printed 136-137, d10-d12 and four-use summary
  summary: need1 iff igoal; need2 iff a stronger instrumental condition; need3 only implies egoal and need0.
    Need1/2 need not imply need0; no harm criterion in d12.
- id: E14
  pages:
  - 13
  locator: PDF 13 / printed 137, section 5
  summary: Maria/child allowance and alternative in-kind services illustrate context-relative necessity; service
    execution and ex-post goal checks are proposed, not measured deployments.
- id: E15
  pages:
  - 13
  - 14
  locator: PDF 13-14 / printed 137-138, section 6
  summary: 'Claims: role account of objects/contents, social concepts, need distinctions, DOLCE mental extension
    and foundations for need-driven services; not an implemented public-service evaluation.'
- id: E16
  pages:
  - 1
  - 2
  - 4
  - 5
  - 6
  - 7
  - 9
  - 10
  - 11
  - 12
  locator: All notes 1-23, including continuation of note 21 on PDF 12
  summary: All notes inspected; note 19 qualifies impossible concepts and note 23 explicitly postpones future
