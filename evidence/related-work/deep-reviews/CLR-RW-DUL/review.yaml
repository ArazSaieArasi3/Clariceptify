dimensions:
  D1_identity_coverage:
    id: D1
    label: Identity
    statement: Exact2016 two-author chapter, printed81-103/PDF98-120 only, all23 pages, six figures, nine notes
      and39 references. No numbered formulas, numbered tables or appendices occur in this chapter.
    evidence:
    - E01
    - E19
    basis: REVIEWER_INTERPRETATION
  D2_problem_contribution:
    id: D2
    label: Contribution
    statement: A handbook-style account of DUL foundations, focused design patterns and a UML documentation
      notation. Independent pattern intent differs from composed foundational commitments.
    evidence:
    - E02
    - E05
    - E15
    - E16
    basis: AUTHOR_REPORTED
  D3_method:
    id: D3
    label: Method
    statement: Explain five source theories; present modeling issue/solution/sample patterns; demonstrate hypothetical
      recomposition through component interfaces. This is conceptual/tutorial exposition, not a reproduced
      experiment.
    evidence:
    - E02
    - E05
    - E16
    - E18
    basis: REVIEWER_INTERPRETATION
  D4_requirements:
    id: D4
    label: Requirements
    statement: All nineteen issue/solution subsections provide explicit user modeling needs and examples; no
      formal numbered CQ suite or evaluated acceptance benchmark is supplied.
    evidence:
    - E06
    - E07
    - E08
    - E09
    - E10
    - E11
    - E12
    - E13
    - E14
    basis: REVIEWER_INTERPRETATION
  D5_concepts:
    id: D5
    label: Concepts
    statement: Catalog keeps foundations, reified concepts, nineteen pattern subsections, diagram classes/interfaces
      and relation names separate from released OWL populations. Figure5.2 is an eight-node schematic, not
      all78 retained classes.
    evidence:
    - E03
    - E04
    - E05
    - E21
    basis: REVIEWER_INTERPRETATION
  D6_relations_formalization:
    id: D6
    label: Commitments
    statement: Prose gives signatures, inverses, disjointness, existential/universal and transitivity/symmetry
      commitments. No printed numbered DL/FOL formulas occur; reviewer paraphrases are not source formulas
      or executed proofs.
    evidence:
    - E06
    - E07
    - E10
    - E11
    - E12
    - E13
    - E14
    - E16
    basis: REVIEWER_INTERPRETATION
  D7_grounding:
    id: D7
    label: Grounding
    statement: DUL simplifies and integrates DOLCE, D&S, Plan, IO and Collection. Modal/temporal loss, social-object
      typing and local composition choices must be distinguished from exact imports and historical release
      identity.
    evidence:
    - E03
    - E05
    - E16
    - E19
    basis: REVIEWER_INTERPRETATION
  D8_artifact_correspondence:
    id: D8
    label: Artifacts
    statement: 'Canonical root bytes match retained DUL4.2; two sample files were parsed for selected statements.
      An exact2016 distribution, all local manual definitions and complete sample imports remain #88; the official
      related DOLCE repo is not this DUL source.'
    evidence:
    - E19
    - E23
    - E24
    - E25
    basis: REVIEWER_INTERPRETATION
  D9_evaluation:
    id: D9
    label: Evaluation
    statement: Illustrative solutions and cited applications support exposition; no new participant, effectiveness,
      benchmark, reasoner, consistency-proof or comparative-superiority result is reported in this chapter.
    evidence:
    - E17
    - E18
    basis: NOT_REPORTED
  D10_critical_synthesis:
    id: D10
    label: Critical input
    statement: Prior overlap in conceptualization/context/classification is substantial, but theory/pattern/version/implementation
      distinctions and eight unresolved technical questions prevent immediate equivalence or adoption.
    evidence:
    - E02
    - E04
    - E08
    - E16
    - E20
    - E23
    basis: REVIEWER_INTERPRETATION
