- id: SR001
  unit_id: U00
  statement: The supplied summary identifies the title, abbreviated authors,2004ECAI workshop and39-45page
    range; it provides an original PDF URL, not a DOI.
  basis: OWNER_SUMMARY_REPORTED
  primary_verified: false
- id: SR002
  unit_id: U01
  statement: I&DA is proposed for knowledge/information management in hybrid organizational semantic webs,
    independently of specification mode or location.
  basis: OWNER_SUMMARY_REPORTED
  primary_verified: false
- id: SR003
  unit_id: U02
  statement: The model is knowledge about knowledge and information, contrasted with an organization model
    containing knowledge about an organization.
  basis: OWNER_SUMMARY_REPORTED
  primary_verified: false
- id: SR004
  unit_id: U02
  statement: A general semiotics layer concerns meaning and representation through ContentBearingObjects and
    Contents.
  basis: OWNER_SUMMARY_REPORTED
  primary_verified: false
- id: SR005
  unit_id: U02
  statement: A communication layer concerns Discourses used by Agents to communicate Information.
  basis: OWNER_SUMMARY_REPORTED
  primary_verified: false
- id: SR006
  unit_id: U02
  statement: The domain includes signs and intentional acts that create or use signs.
  basis: OWNER_SUMMARY_REPORTED
  primary_verified: false
- id: SR007
  unit_id: U02
  statement: The summary names DOLCE as backbone and associates the construction with OntoClean.
  basis: OWNER_SUMMARY_REPORTED
  primary_verified: false
- id: SR008
  unit_id: U03
  statement: Strong coupling connects a knowledge base of modeled assertions with a collection of textual resources
    holding information.
  basis: OWNER_SUMMARY_REPORTED
  primary_verified: false
- id: SR009
  unit_id: U03
  statement: Knowledge is distributed across the KB and CTR; this complements weaker annotation-based access
