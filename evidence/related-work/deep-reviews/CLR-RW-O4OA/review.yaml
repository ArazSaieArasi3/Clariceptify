  catalog_boundary: 'Complete selected paper: all 20 pages, all eight figures (seven OntoUML fragments and one tool
    example), ten numbered footnotes and 66 bibliography entries. Complete paper-level type/role/relator and relational
    distinctions are cataloged; all machine class counts remain unknown. Mental Concept and Concept-as-Term-role
    remain separate. No numbered tables, formulas or appendices; no full OCL/Alloy listing. Source abbreviations
    in Figure 8 are not reconstructed. Current linked CQs are separate, not silently counted as printed paper questions.'
