- id: S12
  label: Information roles
  statement: 'Positive: a representation can be data during processing and also information/knowledge in the
    appropriate exchange/learning episodes; this is not a temporal class replacement.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
findings:
- id: F01
  label: Strong level separation
  statement: The form/content/carrier distinction is substantial existing work; future comparison cannot claim
    that distinction itself is new.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E09
- id: F02
  label: Realization is not instantiation
  statement: Algorithm and car cases give direct counterexamples to treating execution or product as an instance
    of its specification.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
- id: F03
  label: Aboutness deliberately bracketed
  statement: Neutrality on aboutness is a design boundary, not evidence that truth/reference has been solved
    or is irrelevant to every downstream use.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E16
- id: F04
  label: Mental scope deliberately limited
  statement: M1 and agent recognition/understanding are acknowledged but excluded from core analysis; do not
    reframe this as universal absence of agency.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E03
- id: F05
  label: Meaningful expression assumption
  statement: Ambiguity is internalized into content relative to a chosen language/semantics; this does not
    itself give a practical disambiguation procedure.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E04
- id: F06
  label: Role account needs more than labels
  statement: Processing/informing/learning ground cumulative roles, but the paper explicitly leaves a complete
    act/event account for later.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E17
- id: F07
  label: Impossible OREO versus consistent specification
  statement: The broad impossible-procedure example and the stricter consistent-specification definition need
    distinct typing conditions.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E07
- id: F08
  label: Creator intent and multiple readings
  statement: Dominance classifications admit co-realization and creator-sensitive focus; no empirical reliability
    of assigning that focus is demonstrated.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E12
- id: F09
  label: Literary performance is stipulated
  statement: Recitation is classed as form realization under the authors' vocabulary; it is not a blanket finding
    about all uses of performance.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
  - E15
- id: F10
  label: Table level sensitivity
  statement: Table 1 checked entities span form/content/physical realization, and Table 2 form dominance points
    to a physical form-realization; this needs reconciliation with semiabstract OREO identity before implementation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E12
- id: F11
  label: Nested style matters
  statement: Primary-content equivalence alone can hide style differences; nested representation conditions
    are left partly open by the formal module.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
  - E14
  - E19
- id: F12
  label: Identity is relative
  statement: Four preservation levels organize copies, but exact translation and pattern tolerance remain idealized
    assumptions.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E14
- id: F13
  label: IAO critique remains attributed
  statement: Authors' ICE/IQE and ink-pattern conclusions require a separate check against exact IAO versions
    before adopting them as comparative facts.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E16
- id: F14
  label: Foundational neutrality is qualified
  statement: Portability requires a host with semiabstracts and suitable mereology/pattern/satisfaction relations;
    no automatically valid mapping into every upper ontology follows.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E18
  - E19
  - E22
  - E23
- id: F15
  label: Strict encoding functionality
  statement: Ax7-Ax9 impose pairwise uniqueness; alternative methods and method specialization are explicitly
    constrained, with weakening offered as a variant.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
- id: F16
  label: Theorems depend on background
  statement: T1-T4 invoke assumptions about mereological sums, decomposition and semiabstract closure that
    need the exact host theory for proof. Author theorem labels are not executed proofs.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
  - E22
- id: F17
  label: Existence constraints are selective
  statement: Ax10 constrains co-presence when the representation exists; Ax11-Ax12 require representation participation
    for forms/contents. Creation and disappearance histories are not fixed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
- id: F18
  label: Unique physical pattern is strong
  statement: Ax15 uniqueness needs a declared granularity if one physical object supports several useful patterns;
    this is a semantic question, not a demonstrated inconsistency.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E20
- id: F19
  label: Pattern and feature theories are assumed
  statement: PATTERN, FEATUREOF, mereology and satisfaction need additional host constraints; the two predicate
    tables are not a complete executable signature specification.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E20
  - E22
- id: F20
  label: Potential D11 free variable
  statement: Both retrieved appendix renderings show f in D11 without f in the printed existential list. Preserve
    this as a potential source/quantifier issue; raw-PDF glyph confirmation and repair are not claimed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E21
- id: F21
  label: No mixed primitive forms in B
  statement: Appendix B excludes a primitive mixed form and models co-realized representations; main language
    scope permits mixtures. Preserve this specialization boundary.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E21
- id: F22
  label: Content-realization typing is delegated
  statement: D10 uses CONTENT plus SATISFIES without an explicit SPECIFICATION conjunct. Its intended applicability
    depends on the imported satisfaction interpretation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E20
- id: F23
  label: Evidence is theoretical
  statement: Illustrative breadth and author-stated FOL consequences are valuable but do not establish measured
    effectiveness, solver consistency or independent expert validation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - E15
  - E17
  - E19
- id: F24
  label: Supplement access is not byte retention
  statement: 'All 884 extracted lines were captured across all ten pages, but supplement raw bytes and visual
    glyph inspection remain unverified. This limits literal formal conclusions and #244 closure.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
  - E20
  - E21
  - E22
- id: F25
  label: No immediate adoption
  statement: 'Candidate uses remain terminology, identity and test-case proposals until #255/#126 and an owner
    decision. No Clariceptify element is changed by this review.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E07
  - E14
