    and encoding exist.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
- id: S05
  label: Impossible instructions
  statement: 'Adverse: an impossible procedure may still be an OREO; calling its content a consistent specification
    requires an additional check.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E07
- id: S06
  label: Book translation
  statement: 'Positive with idealization: same primary content can have distinct language forms and distinct
