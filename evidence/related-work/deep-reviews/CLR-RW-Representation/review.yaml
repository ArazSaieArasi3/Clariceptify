dimensions:
  D1_identity_coverage:
    id: D1
    label: Identity
    statement: 'Exact 2025 two-author journal text: all 16 supplied PDF pages, one figure, two tables, ten
      notes and 25 references. All ten pages of publisher-parsed supplement A-C were read. Remote supplement
      bytes/glyph fidelity is an explicit remaining technical limitation.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E17
    - E19
    - E20
    - E21
    - E22
  D2_problem_contribution:
    id: D2
    label: Problem
    statement: The proposal isolates form/content from aboutness and explains representations and their realizations
      across heterogeneous cases. Its data/information/knowledge account is role-based rather than an empirical
      superiority result.
    basis: AUTHOR_REPORTED
    evidence:
    - E02
    - E04
    - E05
    - E12
  D3_method:
    id: D3
    label: Method
    statement: Conceptual analysis, contrastive cases, identity analysis and partial modular FOL. No prescribed
      engineering lifecycle or reproduced empirical study is established by these pages.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E07
    - E14
    - E19
  D4_requirements:
    id: D4
    label: Requirements
    statement: Disambiguating questions in note 10 and music/book/algorithm cases function as explanatory adequacy
      targets. Review scenarios below are labeled reconstructions, not an author CQ benchmark.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E08
    - E18
  D5_concepts:
    id: D5
    label: Concepts
    statement: Catalog separates paper notions from 10 background and 31 introduced tabulated predicates, and
      from additional unlisted formal symbols. None is a machine class count.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E06
    - E09
    - E22
  D6_relations_formalization:
    id: D6
    label: Formal commitments
    statement: 'All 49 labeled supplement records indexed: three f assumptions, 18 axioms, 17 definitions and
      11 author-labeled theorems. Encoding uniqueness, identity and realization restrictions warrant bounded
      checks; no solver/proof execution is claimed.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E19
    - E20
    - E21
    - E22
  D7_grounding:
    id: D7
    label: Grounding
    statement: Semiabstract temporal/nonspatial ontology is assumed. DOLCE NASO and YAMATO are compatibility
      examples; the module is not foundation-free, and examples do not establish formal imports or an edition-specific
      mapping.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E18
    - E19
    - E23
  D8_artifact_correspondence:
    id: D8
    label: Artifact
    statement: 'Publisher supplement and an author-posted appendix text are identified. Two dated GitHub repository
      searches returned none. No executable original ontology, complete class census or import chain has been
      established; #244 remains open.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E17
    - E19
    - E22
  D9_evaluation:
    id: D9
    label: Evaluation
    statement: Worked cases and formal claims are theoretical assessment evidence. No participant sample, accuracy
      metric, controlled comparison, automated proof or reproduced reasoner result is reported in the inspected
      work.
    basis: NOT_REPORTED
    evidence:
    - E03
    - E12
    - E15
    - E17
    - E19
