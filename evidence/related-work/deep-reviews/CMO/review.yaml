scenarios:
- id: S01
  label: Search via NCIt
  statement: 'Positive: education/person fields annotated through the shared vocabulary can be queried without model-specific
    property names. Adverse: a concept related only by a longer broader chain or exact term is not matched by a
    direct skos:broader pattern under simple graph matching.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E09
- id: S02
  label: Concept versus instance
  statement: 'Positive: a Cat concept represents a class whose members are cats. Adverse: typing the concept itself
    as a cat confuses class extension with idea-of-class; punning alone does not supply the required bridge.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
- id: S03
  label: Shared primary anchor
  statement: 'Manual countercase: AdultPerson and MinorPerson concepts both point to Person; one adult individual
    need not be an instance of MinorPerson. This refutes an unconditional shared-anchor-to-retyping rule, not every
    task-specific mapping. No solver countermodel executed.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E10
- id: S04
  label: Conceptual broader versus subclass
  statement: 'Positive: a task may explicitly approve a mapped subclass assertion. Adverse: broader term can organize
    topics rather than denote set inclusion; its existence plus primary-concept annotations does not prove the proposed
    subclass.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
- id: S05
  label: Clinical encounter to Alive
  statement: 'Positive: a valid patient encounter attested on a date can support a dated derived record under an
    approved rule. Adverse: a planned/cancelled encounter, unrelated subject, time-zone mismatch or historical record
    requires explicit guards and provenance.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
- id: S06
  label: No baseline change
  statement: 'Positive: selected passive metadata can be managed separately. Adverse: imported domain/range/class
    axioms or an added subclass rule can create new typing/contradiction in the combined theory. Noninterference
    is scope-dependent.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E05
  - E10
  - A01
- id: S07
  label: Composite concept fidelity
  statement: 'Positive: Tissue qualifier plus Specimen primary concept expresses an intended decomposition. Adverse:
    two qualified types sharing a primary anchor need not be interchangeable, and qualifier omission can erase a
    clinically meaningful distinction.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
- id: S08
  label: Permissible values
  statement: 'Positive: permitted concepts populate a CDE enumeration range. Adverse: annotation valuesCanBe alone
    is not a closed-world data-validation check and source strings may map ambiguously.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
- id: S09
  label: Query/plot reproduction
  statement: 'Positive: printed query and chart illustrate the desired search task. Adverse: current syntax parser
    rejects the printed form; unavailable source dataset/engine means chart counts and semantics are not rerun.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - S01
- id: S10
  label: Punning statement
  statement: 'Positive: an individual facet can be explicitly typed as a SKOS Concept. Adverse: class-extension
    constraints are not automatically inherited by that facet, nor does this mean the individual facet has no semantics
    whatsoever.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - S02
- id: S11
  label: Defeasible-looking bird association
  statement: 'Positive: a conceptual birds-can-fly relationship can remain outside automatic instance inference.
    Adverse: it is not therefore a default-logic implementation with sound exception handling for injured/flightless
    birds.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
- id: S12
  label: Granularity difference
  statement: 'Positive: same-granularity classes may be related under an approved model policy. Adverse: a direct
    edge versus an intervening event/entity requires a transformation not provided by this CMO paper.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
- id: S13
  label: Mirror identity and date
  statement: 'Positive: pin the exact matching-namespace candidate for bounded analysis. Adverse: its v2006 path
    or matching class names does not establish release 2006 or fidelity to the2011 paper.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
- id: S14
  label: Zero cardinality
  statement: 'Positive: minQualifiedCardinality0 does not reject an entity without a representation edge. Adverse:
    describing it as a mandatory conceptual representation witness invents a stronger axiom.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
findings:
- id: F01
  label: Direct prior conceptualization coverage
  statement: CMO directly models conceptual knowledge and its relation to logical models/common vocabularies; later
    novelty claims must compare concrete scenarios, not claim no prior conceptualization model.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E02
  - E06
- id: F02
  label: Complete work/version boundary
  statement: Selected CEUR text uses Level 2 concepts, nine pages and 37 references. Other layouts/version wording
    are not substituted. Technical PDF creator metadata is not scholarly authorship.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E06
  - E13
- id: F03
  label: Concept versus artifact grounding tension
  statement: Level 2 cognitive framing and asserted SKOS-to-IAO information-content inheritance require an explicit
    content/cognition distinction; the paper does not prove these are one category.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E06
  - E07
- id: F04
  label: Foundation hierarchy discrepancy
  statement: Fig. 1 prints GenericallyIndependentContinuant under IndependentContinuant, unlike dependent terminology
    in prose. Preserve the observed conflict; no corrected foundation hierarchy or consistency proof is inferred.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
- id: F05
  label: Prefix not edition
  statement: Paper family BFO is explicit; bfo2 display prefix alone does not specify version. Mirror actually names
    BFO1.1 namespace IRIs, without pinning a BFO import or original paper edition.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E07
  - A01
- id: F06
  label: Shared concept anchor is insufficient
  statement: Fig. 5-6 additions are explicit rule-policy actions. A common conceptual anchor does not, without stronger
    premises, guarantee instance membership/subsumption.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
- id: F07
  label: Fig. 5 caption versus arcs
  statement: Parent/broader wording conflicts with two primary-concept arrows in the graph. Do not silently replace
    an arrow with broader or accept the rule as universally sound.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
- id: F08
  label: Representation bridge availability
  statement: Fig. 3 uses representedBy; Fig. 5-6 use representedByType absent from Fig. 2 and mirror. This is a
    source/version correspondence question, not proof that no historical implementation had it.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E09
  - E10
  - A01
- id: F09
  label: Printed-query reproducibility limit
  statement: Executed parser rejection is specific to current RDFLib7.6.0 and the literal printed form. Missing
    GROUP BY/rdfs prefix and aggregate syntax matter for modern reproduction; historical dialect and results remain
    unknown.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - S01
- id: F10
  label: Evaluation shows illustration, not accuracy
  statement: One query plot and two rule diagrams demonstrate intended use; no controlled alignment precision/recall,
    expert validation, multi-resource fidelity/error study or reasoner log is identified.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E10
  - E12
- id: F11
  label: Minimal semantics shifts obligation to policy
  statement: Task-tailored weak/strict alignment is flexible, but mapping soundness, conflict handling, qualification
    and preservation conditions must be supplied elsewhere.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E10
- id: F12
  label: Noninterference claim requires scope
  statement: Adding passive concept metadata and adding active class/instance conclusions have different consequences.
    No blanket conservative-extension theorem is supplied for all imports and optional rules.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E05
  - E10
  - A01
- id: F13
  label: Explicit unsupported granularity
  statement: Direct-relation versus intervening-class mapping is an author-stated future limitation; preserve it
    as a comparison constraint rather than inventing implemented support.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
- id: F14
  label: All candidate classes inspected, original unknown
  statement: 'Third-party candidate supplies seven local named classes and 14 local object properties, all inventoried
    with constraints; seven local classes manually reviewed. FiatEntity is missing there, as is representedByType.
    Original distribution and imported definitions remain unresolved #245.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E10
  - A01
- id: F15
  label: Comment absence is not all-definition absence
  statement: UniversalQuality lacks rdfs:comment but has a descriptive seeAlso literal; do not count a missing comment
    as a complete missing-source-definition claim.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
- id: F16
  label: Candidate zero lower bounds
  statement: Four minimum-qualified cardinality 0 restrictions do not require representation witnesses; any stronger
    interpretation must be separately justified.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
