dimensions:
  D1_identity_coverage:
    statement: Pin the exact nine-page proceedings source and all content units. OCR was only a reading aid; every
      page and small diagram/query label was visually checked. Conference2011, proceedings 2012, PDF technical metadata
      and other layouts are not interchangeable identities.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E13
  D2_problem_contribution:
    statement: CMO seeks conceptual interoperability through a reusable vocabulary layer over logical models without
      unintended baseline inference. Its contribution includes a metamodel and swBIG prototype. This directly overlaps
      conceptualization knowledge; universal correctness/noninterference is not proved.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E02
    - E08
    - E12
  D3_method:
    statement: Requirements derive from prior caBIG-to-OWL modeling difficulties. BFO/IAO/SKOS reuse, OWL2 punning,
      conceptual annotations and an application proxy form the method. No systematic elicitation sample, full construction
      protocol or independent evaluation design is reported.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E05
    - E06
    - E08
  D4_requirements:
    statement: All three author use cases and five requirements are retained below, with patient/search, clinical-date/vital-status
      and BRIDG examples. Examples are not a comprehensive CQ benchmark; application-dependent alignment fidelity
      requires an explicit policy.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E04
    - E05
    - E09
    - E10
  D5_concepts:
    statement: Catalog all ontology-bearing distinctions, eight prose/diagram CMO category names, reused foundation
      categories, logical/physical/lexical layers, permissible-value concepts and rule variables. Figure1 has seven
      local class labels, while FiatEntity is additional prose content. Neither number is the complete original
      distribution census.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E06
    - E07
    - E08
    - E10
  D6_relations_formalization:
    statement: Record every visible property and all inverses/subproperties/signatures, the printed query, and both
      mapping patterns. Separate class hierarchy, concept hierarchy, punning and inference-rule policy. No numbered
      mathematical displays occur. Shared concept anchors alone do not prove class subsumption.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E06
    - E07
    - E09
    - E10
    - S01
    - S02
  D7_grounding:
    statement: BFO family and IAO reuse are explicit, not inferred from a citation. Paper edition unknown; bfo2
      prefix is not an edition identifier. Candidate uses actual BFO1.1 namespace IRIs but imports only unversioned
      IAO/SKOS endpoints. GenericallyIndependentContinuant in Fig. 1 conflicts with dependent terminology in prose
      and is preserved, not repaired.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E06
    - E07
    - A01
  D8_artifact_correspondence:
    statement: 'Official paper PURL redirects to a Google Code SVN file returning 404. A pinned third-party DBpedia
      tracker candidate matches the CMO namespace and several paper terms; original 2011 byte/axiom identity is
      not established. All 12 declared named classes and 20 object properties are inventoried, all seven local class
      definitions/constraints manually reviewed below. Imports, original missing terms and selected semantic execution
      remain #245.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - A01
    - E06
    - E07
    - E10
  D9_evaluation:
    statement: Authors show query/result and two mapping diagrams as evaluation. They provide no identified expert
      sample, controlled accuracy/precision/recall or reasoner/profile log. A current parser rejects the literal
      printed query; this syntax-only result does not refute an undocumented historical dialect or reproduce its
      dataset. Five VVEAA functions remain distinct.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E09
    - E10
    - E12
    - S01
  D10_critical_synthesis:
    statement: Positive prior coverage includes conceptual/logical/real separation, vocabulary-mediated interoperability
      and task-specific conversion/mapping. Limits include implicit policy, unsupported granularity, foundation/version
      discrepancies and missing reproducibility. All proposed uses remain owner-deferred.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E05
    - E06
    - E10
    - E11
    - A01
catalog:
- id: C01
  label: Level 1 reality
  statement: Objects/processes/qualities/states in reality; paper then describes realist logical classes/properties
    at this level. Distinguish universal, class and instance interpretation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E06
- id: C02
  label: Level 2 cognitive representation
  statement: Paper treats conceptual models and CMO concepts as Level 2; later asserting SKOS concepts under IAO
    information-content category raises a modeling-level grounding question, not an automatic identity of mental
    act and information artifact.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E06
  - E07
- id: C03
  label: Level 3 representational artifact / term
  statement: Textual/graphical concretization and lexicographic labels; label string is not identical to the concept
    or represented thing.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
- id: C04
  label: Conceptual model
  statement: Set of Level 2 entities representing Level 1 or Level2 classes/properties; model members may also have
    separate logical-model roles. No complete ConceptualModel class declaration is shown.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E06
- id: C05
  label: Logical model
  statement: Collection of classes/properties from Level 1 or 2; distinguish extensional class interpretation from
    concept-individual use of a shared name.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E06
- id: C06
  label: Physical model
  statement: Implementation-layer representation mentioned in the introduction; not developed as a separate formal
    class family in this paper.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
- id: C07
  label: Common vocabulary
  statement: Reusable term/concept system kept distinct from an individual conceptual/logical model to avoid privileging
    one source. Common anchors provide candidates, not guaranteed equivalence.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E05
- id: C08
  label: Conceptual interoperability
  statement: Interoperation intended to match human conceptual alignment, through search, conversion and mapping.
    Alignment fidelity is a task-dependent premise.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E04
  - E10
- id: C09
  label: cmo:Type
  statement: Conceptual generalization associated with a collection of instances; it is an idea-of-type rather than
    automatically the represented class or one of its members.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
- id: C10
  label: cmo:Quality
  statement: Conceptualized inherent property or assigned attribute; source deliberately groups these. This is not
    automatically a BFO quality or OWL property.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
- id: C11
  label: cmo:Relation
  statement: Conceptual relation between independent entities; endpoints are expressed through Type role links.
    Not an executable RDF predicate solely from its class label.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
- id: C12
  label: cmo:Universal
  statement: Realist-side category, prose grounded under independent continuant; punning/class-versus-individual
    commitments need exact semantics.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
- id: C13
  label: cmo:UniversalClass
  statement: Fig. 1 Universal subtype; candidate comment describes natural groupings and its minQualifiedCardinality0
    restriction imposes no positive representation witness.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - A01
- id: C14
  label: cmo:UniversalQuality
  statement: Fig. 1 Universal subtype; candidate has no rdfs:comment but has a descriptive rdfs:seeAlso literal.
    Do not label all source definition text absent or silently invent a comment.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - A01
- id: C15
  label: cmo:UniversalRelation
  statement: Fig. 1 Universal subtype for real-side relations; distinguish from conceptual cmo:Relation and punned
    OWL object property.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - A01
- id: C16
  label: cmo:FiatEntity
  statement: Explicit prose category under generically dependent continuent; absent fromFig.1 and the selected mirror.
    Absence in that file is not absence in the paper or all historical sources.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
  - A01
- id: C17
  label: skos:Concept
  statement: Common conceptual/vocabulary entity, source asserted under IAO information content entity. New foundation
    typing can affect other SKOS-typed individuals when combined, so noninterference requires a scoped proof.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
  - A01
- id: C18
  label: iao:information content entity; iao:is about
  statement: Information-content category and aboutness predicate reused for CMO concepts/represents. A representational
    content item is not automatically a cognitive episode or truth guarantee.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E06
  - E07
- id: C19
  label: bfo2:Entity; snap:Continuant; snap:IndependentContinuant
  statement: Printed foundation nodes above Universal; bfo2 is a prefix name and does not prove BFO2. Candidate
    IRIs explicitly use ifomis.org/bfo/1.1.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - A01
- id: C20
  label: snap:GenericallyIndependentContinuant / generically dependent continuent
  statement: Preserve conflicting figure/prose strings. Figure1 sends the printed independent category under IndependentContinuant;
    do not publish this as a verified BFO hierarchy.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
- id: C21
  label: OWL class / individual / property; punning
  statement: Same IRI can be used at different entity levels; source metamodel argument requires explicit bridge
    policy. Assigning skos:Concept to the individual facet does not automatically transfer class-extension facts.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - S02
- id: C22
  label: Self-representation / concept versus represented thing
  statement: Source permits concept/class self-representation but rejects universal self-representation. These are
    ontological claims; the mirror explicitly makes representsUniversal irreflexive only.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E06
  - A01
- id: C23
  label: Concept composition / primary concept / qualifier
  statement: Tissue Specimen example uses Specimen primary anchor and Tissue qualifier. This decomposition lacks
    a generally specified compositional identity, qualifier order or inverse reconstruction.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
- id: C24
  label: Conceptual quality values / permissible concepts
  statement: valuesCanBe relates Quality to permissible conceptual values; CDE conversion uses an OWL enumeration
    range of concepts rather than raw strings. Graph linkage alone is not a closed value validator.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
- id: C25
  label: Source/target roles / generic relation role
  statement: Conceptual Relation-to-Type links and inverses. No displayed cardinality makes every relation binary,
    uniquely sourced/targeted, total or directionally symmetric.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
- id: C26
  label: UML generalization / attribute / association
  statement: Input-model structures claimed preserved by swBIG conversion. Prior one-to-one attribute/property mapping
    failure motivates the separation; preservation is not formally verified here.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E08
- id: C27
  label: CDE / semantic metadata
  statement: Common Data Elements supply conceptual annotations and permitted values. Their version, curation policy
    and mappings affect data correctness; no complete snapshot supplied.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
- id: C28
  label: swBIG / caBIG / caGrid
  statement: Prototype linked-data proxy, originating biomedical infrastructure and service calls. These are implementation
    architecture, not additional invented CMO ontology classes.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E08
- id: C29
  label: NCIt / SKOS conversion / OWLtoSKOS
  statement: Vocabulary transformation supports concept-individual queries; loss of logical semantics or alignment
    provenance must be assessed, not inferred correct from successful conversion.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
- id: C30
  label: GEO / ArrayExpress / caArray; MAGE / MIAME
  statement: Author motivating resources/models with overlapping conceptual content; no actually reproduced multi-resource
    search/conversion experiment is reported.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
- id: C31
  label: HL7-RIM / PML / domain-specific model
  statement: Cross-cutting clinical/provenance model examples and interoperability targets; these are not established
    equivalents or necessarily imported ontologies.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E04
- id: C32
  label: Search / query
  statement: Author use case hides logical-model details behind common concepts; education and adverse-event examples
    provide functional motivation, not exhaustive recall guarantees.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E09
- id: C33
  label: Conversion / fidelity
  statement: Task-selected data translation, including Clinical Service on a Date to an Alive-status record on that
    Date. Requires event/date/subject evidence and explicit fidelity policy.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E10
- id: C34
  label: Direct mapping / BRIDG / AIM Person
  statement: Vocabulary-mediated generation of model relationships; a shared NCIt Person anchor is not proof that
    two class extensions coincide or one contains the other.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E10
- id: C35
  label: Person / Education Level / HINTS2005
  statement: Query/example domain roles and dataset. Fig. 4 contains nine education categories; these labels are
    not newly declared CMO classes.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
- id: C36
  label: Clinical Service / Date / Vital Status / Alive
  statement: Conversion scenario predicates/concepts; temporal and evidential adequacy of inferred Alive requires
    task-specific guards, not merely concept similarity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
- id: C37
  label: Tissue Specimen / Specimen / Tissue; Adverse Event / Drug class
  statement: Search/composition illustrations and type-of-drug abstraction. They do not establish corresponding
    actual CMO class declarations.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E07
- id: C38
  label: Bird / flying / flightless / injured
  statement: Concept-level defeasible-sounding association without automatic class entailment; this does not implement
    a default logic, exceptions policy or validated biological rule.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
- id: C39
  label: Common Vocabulary requirement
  statement: Separate portable vocabulary must not favor one particular conceptual/logical representation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
- id: C40
  label: Distinction from Logical Models requirement
  statement: Separate metamodel roles to prevent idea-of-thing versus thing-instance conflation. Expressing both
    in OWL does not alone invalidate the distinction if entity roles are explicit.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E06
- id: C41
  label: Natural, Idiomatic Expression requirement
  statement: Annotation should preserve natural logical/data representation without requiring baseline modifications.
    This is a scoped noninterference goal, not a proved conservative extension.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E10
- id: C42
  label: Types, Properties, and Relations requirement
  statement: Represent conceptual structure and its relations across the relevant modeling roles, not only class
    names.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E07
- id: C43
  label: Additional Relationships requirement
  statement: Allow extra concept relationships as appropriate for interoperability. No automatic logical-class inference
    is intended solely from all such relationships.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E10
- id: C44
  label: Granularity / reified relationship
  statement: 'Explicit future-work gap: one source has a direct relation while another introduces an intervening
    entity. The selected CMO does not yet map these generally.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
- id: C45
  label: Provenance / biomedical experiment / TMO
  statement: Stated future conceptual integration targets; not a completed current domain-model/provenance experiment.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
- id: C46
  label: ?x / ?class / ?otherClass / ?typeConcept / ?otherTypeConcept / ?commonConcept
  statement: Fig. 5 rule variables, distinct from released class names. Complete before/after graph is retained
    in diagrams.yaml.
  basis: REVIEWER_INTERPRETATION
  evidence:
