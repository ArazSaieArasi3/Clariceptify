  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
commitments:
- id: K01
  label: Modeling levels and identity
  statement: Paper separates reality, cognitive/conceptual layer and representational artifact, while allowing conceptual/logical
    facets to share identifiers. Explicit level and bridge semantics are required; no global disjointness or identity
    theorem is supplied.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E06
- id: K02
  label: Core hierarchy
  statement: Type/Quality/Relation below SKOS Concept; Concept asserted under IAO information content entity. Universal
    and its three specializations form a separate displayed branch. FiatEntity is prose-only in this retained source.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
- id: K03
  label: Representation / inverse / aboutness
  statement: represents goes from concept to represented entity, inverse representedBy; represents subproperty of
    IAO is about; representsUniversal specializes it. Role/filler typing does not establish correctness of what
    is represented.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
- id: K04
  label: Self-representation limit
  statement: Source allows self-representation for concepts but rules it out for universals conceptually. Candidate
    representsUniversal irreflexivity does not establish global irreflexivity of represents, class/concept disjointness
    or every intended prohibition.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - A01
- id: K05
  label: Primary/qualifier composition
  statement: hasPrimaryConcept/hasQualifier specialize broadMatch in the conceptual layer. Shared anchor or qualifier
    omission cannot be assumed to preserve set inclusion or distinguish two composites.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E10
- id: K06
  label: Quality relations
  statement: hasQuality Type->Quality, inverse qualityOf; valuesCanBe Quality->SKOS Concept. Signatures are not
    totality, unique-value or closed-enumeration conditions.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
- id: K07
  label: Relation roles
  statement: hasRole Relation->Type; hasRoleIn inverse. Source/target role properties specialize these and have
    corresponding inverse properties. No existential, exactly-two endpoint or functional constraint is printed in
    Fig. 2.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
- id: K08
  label: Proxy preservation
  statement: Authors claim UML generalizations, attributes, associations, typing and cardinality preserved through
    linked-data proxy generation; CDE permissible concepts become enumeration range. No proof/run log of complete
    preservation is supplied.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
- id: K09
  label: Fig. 3 query dependencies
  statement: Graph patterns use class/properties represented by concepts whose skos:broader points directly to NCIt
    Person/Education_Level. Direct broader is not an arbitrary transitive path; returned rows depend on dataset/entailment
    configuration, labels and vocabulary versions.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
- id: K10
  label: Fig. 3 syntax check
  statement: Current RDFLib7.6.0 parseQuery rejects the visually transcribed printed query at count (line4,col8).
    Printed aggregate alias lacks standard parentheses; GROUP BY and rdfs prefix are also absent. The historical
    engine/dialect is unknown; no corrected query, endpoint or HINTS result was run.
  basis: EXECUTED
  evidence:
  - E09
  - S01
  execution_ref: evaluation/related-work/cmo/printed-query-parse.json
- id: K11
  label: Fig. 4 evidence boundary
  statement: Nine bars visualize an author-reported education query. Exact count labels, missing-value population,
    sample provenance, weights and raw records are absent; no chart number is reconstructed as exact.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
- id: K12
  label: Fig. 5 instance rule
  statement: Before/after rule adds ?x rdf:type ?otherClass when two concepts point to the same primary anchor.
    Both arrows are hasPrimaryConcept despite broader/parent wording. This requires a policy/guard; shared anchors
    alone do not logically entail instance retyping.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
- id: K13
  label: Fig. 6 subclass rule
  statement: broaderTransitive/domain-concept and primary/BRIDG-concept paths meet at a common concept, then a subclass
    assertion is added. Concept hierarchy plus annotation links alone does not entail logical subsumption.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
- id: K14
  label: Noninterference and optional rules
  statement: Passive annotation and actively generated subclass/instance assertions have different effects. A general
    no-undesired-inference claim must specify signature, import closure and rule policy rather than assume all mappings
    conservative.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E05
  - E10
- id: K15
  label: Candidate restriction boundaries
  statement: All four candidate qualified minimum cardinalities are0, which imposes no positive filler witness.
    No local FiatEntity or representedByType declaration exists; unversioned imported source contents were not resolved.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
  - E06
  - E10
