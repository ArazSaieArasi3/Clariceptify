evaluation:
  Verification:
    statement: Paper gives hierarchy/properties/query and transformation sketches, but no reasoner/profile or complete
      mapping-preservation proof. Candidate RDF parsing and current printed-query parser rejection were actually
      executed; neither is ontology consistency or historical HINTS execution.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E07
    - E08
    - E09
    - A01
    - S01
  Validation:
    statement: Use cases and five requirements derive from author modeling experience. No independently recruited
      expert sample, validated CQ study or human agreement analysis is identified in the complete selected paper.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E04
    - E05
  Evaluation:
    statement: Author query plot and two mapping diagrams illustrate use. No reproducible benchmark, alignment accuracy,
      conversion fidelity metric, controlled baseline or raw chart population is supplied. Future targets remain
      future.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E09
    - E10
    - E11
  Assessment:
    statement: Source-linked AI-assisted critique separates modeling levels, rule-policy assumptions, source/figure/candidate
      discrepancies and conditional countercases. It is not independent expert acceptance or exhaustive consequence
      analysis.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E06
    - E07
    - E09
    - E10
    - A01
  Assurance:
    statement: Pinned paper/mirror hashes, all-page OCR/visual recovery record, complete figures/properties, all
      seven local candidate-class reviews and bounded dated discovery support traceability. CI/source retention
      do not establish semantic or scientific adequacy.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E13
    - A01
