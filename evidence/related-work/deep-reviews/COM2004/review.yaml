  basis: AUTHOR_REPORTED
  evidence:
  - E04
  - E13
  - E15
- id: S05
  label: Dante perception and remembrance
  statement: The three numbered Dante statements distinguish a percept, a computed belief and a computed remembrance
    in different intervals. The text calls them two examples but prints three; no complete remembrance class is
    defined.
  basis: AUTHOR_REPORTED
  evidence:
  - E09
- id: S06
  label: Courtney / sound belief
  statement: A computed belief historically follows a percept of sound; this is an illustrative dependency vignette,
    not an empirical case study.
  basis: AUTHOR_REPORTED
  evidence:
  - E11
- id: S07
  label: Homer / goal and belief
  statement: A desire for cold beer depends on a belief about relative refreshment; the supporting percept is background
    to the dependency story.
  basis: AUTHOR_REPORTED
  evidence:
  - E11
- id: S08
  label: Neo / intended action
  statement: The red-pill story sketches COI-to-COD-to-COB-to-PRC dependency and corresponding states, without a
    runnable agent policy.
  basis: AUTHOR_REPORTED
  evidence:
  - E11
- id: S09
  label: Private nested attitudes
  statement: Neo/Trinity/Morpheus have distinct private objects/states despite coincident time; cross-agent observation
    does not imply shared mental-object identity.
  basis: AUTHOR_REPORTED
  evidence:
  - E13
- id: S10
  label: Sleeping or unexperienced agent
  statement: A5 allows no present active belief state if a computed belief persists. Agents with no previous belief
    motivate a provisional innate/designed-belief response.
  basis: AUTHOR_REPORTED
  evidence:
  - E14
- id: S11
  label: Positive intended tuple
  statement: At the intended diagram/vignette level, one agent a and one private object z participate in state s
    at t, with OSD(z,a), so D9 makes AB(a,s,z,t). This local reading is not a witness satisfying the full theory,
    whose D1/D4 problem remains.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E10
- id: S12
  label: Adverse self-dependence
  statement: 'Set y=x in D1: BOX(P->P) holds in normal modal logic. For any assumed MOB(x), y=x witnesses the existential
    forbidden by D4. Thus literal D1/D4 make PRC empty under unrestricted quantification; D6 then makes COB empty
    and A5 excludes any present APO. This is a written derivation, not executed whole-theory unsatisfiability.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
  - E10
  - E14
- id: S13
  label: Adverse multiple state contents
  statement: Suppose objects z 1:COB and z 2:COD both depend on a and participate in s at t. D9 yields aboutness
    for each, and D11/D12 classify s as BEL and DES. Object-level differences alone do not establish disjoint state
    classes. Conditional fragment reasoning only, no full-theory model claimed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
  - E11
- id: S14
  label: Adverse shared private object
  statement: If the same z is OSD on distinct APO agents a and b, A2 forces a=b. Equal intended content in different
    agents should therefore not be modeled by sharing this private token. A2 does not force existence of an owner
    by itself.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E13
- id: S15
  label: Adverse external-document substitution
  statement: A public diagram/book/information artifact about a domain does not automatically meet private MOB/APO/co-participation
    requirements; D9 is not a binary documentary aboutness relation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E10
- id: S16
  label: Adverse generic agent sufficiency
  statement: An entity with a stored computed belief need not thereby meet autonomy/reactivity/proactiveness/social
    ability. A5 supplies a necessary implication, not a sufficient agent classification theorem.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E14
- id: S17
  label: Adverse lifetime interpretation
  statement: A3 permits t=t 1, so an object may have an aboutness-state over its whole lifetime rather than necessarily
    surviving it. A4 existence does not make the witness unique. Neither is an executed memory benchmark.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
- id: S18
  label: Adverse unexplained computed content
  statement: Even after considering a hypothetical self-dependence repair, D5/A1 do not establish a finite/well-founded
    path to percepts or that every COJ lies in COB/COD/COI. No repair is applied or solved.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
  - E10
