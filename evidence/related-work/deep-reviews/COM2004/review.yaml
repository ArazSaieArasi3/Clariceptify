    No other-object/inequality restriction is printed. The literal formula includes y=x, making self-GED a critical
    issue. Do not silently insert y!=x.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  formula_label: D4
  formula_page: 6
  normalized_formula: PRC(x) := MOB(x) and not exists y (MOB(y) and GED(x,y))
