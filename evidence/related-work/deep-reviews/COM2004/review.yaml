commitments:
- id: K01
  label: D1 / General Dependence
  statement: 'Printed D1 (PDF 6), visually normalized ASCII: GED(x,y) := BOX((exists t PRE(x,t)) -> (exists t 1
    PRE(y,t 1))). Weak existence dependence has no irreflexivity guard. Substituting y=x gives a necessary tautological
    implication. This affects D4; see F03, reviewer analysis, not a solver run.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  formula_label: D1
  formula_page: 6
  normalized_formula: GED(x,y) := BOX((exists t PRE(x,t)) -> (exists t1 PRE(y,t1)))
  transcription: VISUAL_ASCII_NOT_MACHINE_AXIOM
  universal_closure: Free variables left implicit as in source; no extra type/inequality guard inserted.
  source_proposal_basis: AUTHOR_REPORTED
- id: K02
  label: D2 / Historical Dependence
  statement: 'Printed D2 (PDF 6), visually normalized ASCII: HD(x,y) := BOX((exists t PRE(x,t)) -> forall t (PRE(x,t)
    -> exists t 1 (t 1 < t and PRE(y,t 1)))). Earlier y is required for every presence of x in each relevant world.
    The outer existential and inner universal t have distinct scopes despite repeated glyphs. Not mere asserted
    data provenance.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  formula_label: D2
  formula_page: 6
  normalized_formula: HD(x,y) := BOX((exists t PRE(x,t)) -> forall t (PRE(x,t) -> exists t1 (t1 < t and PRE(y,t1))))
  transcription: VISUAL_ASCII_NOT_MACHINE_AXIOM
  universal_closure: Free variables left implicit as in source; no extra type/inequality guard inserted.
  source_proposal_basis: AUTHOR_REPORTED
- id: K03
  label: D3 / Direct Historical Dependence
  statement: 'Printed D3 (PDF 6), visually normalized ASCII: DHD(x,y) := HD(x,y) and not exists z (HD(x,z) and HD(z,y)).
    Cover-like dependence excludes any intermediate z; it is not simply non-transitive HD or a generic graph immediate-parent
    assertion. Discrete time alone does not ensure this relation is populated.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  formula_label: D3
  formula_page: 6
  normalized_formula: DHD(x,y) := HD(x,y) and not exists z (HD(x,z) and HD(z,y))
  transcription: VISUAL_ASCII_NOT_MACHINE_AXIOM
  universal_closure: Free variables left implicit as in source; no extra type/inequality guard inserted.
  source_proposal_basis: AUTHOR_REPORTED
- id: K04
  label: D4 / Percept
