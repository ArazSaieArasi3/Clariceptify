- id: F03
  label: Critical / reflexive GED empties PRC under literal D4
  statement: 'D1 entails GED(x,x) by BOX(P->P). D4 disallows any MOB(y) with GED(x,y), including y=x; with assumed
    MOB(x) this blocks PRC(x). D6 then blocks COB, and A5 forbids an APO present at any t. This is reviewer derivation
    under the printed unrestricted normal-modal reading. It is not a full theory inconsistency proof: without existence
    axioms empty agent populations can satisfy implications, and inherited background/guard conventions need recovery
    in #243. No inequality is silently inserted.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
  - E10
  - E14
  followup_issue: 243
- id: F04
  label: Critical / PER versus PES
  statement: D14 visibly uses PER; D10 and Fig.1 visibly use PES. PER is not defined elsewhere in the selected paper.
    Treat as unresolved notation rather than silently fixing a supposed typo or proving the desired state covering.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
  - E16
  followup_issue: 243
- id: F05
  label: Private object uniqueness is conditional
  statement: A2 enforces at-most-one APO owner for a qualifying MOB; it neither supplies an owner nor determines
    identity across different objects or uniquely assigns a state/content pair. Equal shared propositions need a
    separate account.
  basis: REVIEWER_INTERPRETATION
  evidence:
