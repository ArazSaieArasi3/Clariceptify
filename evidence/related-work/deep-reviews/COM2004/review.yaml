- id: F02
  label: Strength / state-content separation
  statement: Mental states as perdurants and private mental objects as endurants, linked by four-place AB, supply
    substantive prior overlap for agency/content/time modeling; this constrains novelty wording without establishing
    conceptual equivalence to Clariceptify.
