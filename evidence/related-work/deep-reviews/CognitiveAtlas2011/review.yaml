evidence:
- id: E01
  pages:
  - 1
  - 11
  locator: Title/authors/abstract, editor/reviewer information, dates, DOI and rights on pp.1/11
  summary: Nine authors; received 31 March, accepted 17 August, published 6 September 2011; DOI10.3389/fninf.2011.00017.
    Scholarly peer-review metadata is not independent expert acceptance of this dossier.
- id: E02
  pages:
  - 1
  - 2
  locator: Introduction; What is the problem?; Ambiguous terminology; footnote 1
  summary: 2011 background query 2613 papers; working-memory maintenance/manipulation/temporal senses, synonym/polysemy
    problems and broad cognitive scope including emotion/motivation. Not a current PubMed result.
- id: E03
  pages:
  - 2
  locator: Complete Tasks versus constructs subsection
  summary: Sternberg task contrasts, disputed Stroop inhibition and N-back validity; cognitive-control/task many-to-many
    associations and changing literature links. Task labels do not establish construct measurement.
- id: E04
  pages:
  - 2
  - 3
  locator: Complete Toward an ontology for cognition; footnote 2
  summary: Gruber-style shared specification, GO analogy, MeSH category critique, ACT-R/SOAR contrast and little
    consensus about mental units. Authors choose to capture disagreement instead of imposing small-group consensus.
- id: E05
  pages:
  - 3
  locator: The Cognitive Atlas; Structure of the knowledge base; Mental concepts; footnote 3
  summary: Ease of participation, machine access, separate linked process/task ontologies, initial >800 terms curated
    by three authors; latent construct versus brain realization; optional representation/process subdivision and
    SKOS Concept modeling.
- id: E06
  pages:
  - 3
  - 4
  - 5
  locator: Mental tasks; Experimental conditions; Indicators; Contrasts, including continuation on p.5
  summary: Prescribed task activity need not produce overt response; CogPO task/condition/contrast categories; quantitative/qualitative
    indicators; contrast is a function over conditions, including simple, linear and nonlinear comparisons.
- id: E07
  pages:
  - 4
  locator: Figure 1, complete concept schema and caption
  summary: Mental-concept cards plus SKOS, Dublin Core, SIOC and SWAN Citation vocabularies; ten central field labels,
    working-memory relation examples and measured-by continuation. Dashed reuse/inheritance drawing is not a complete
    OWL mapping.
- id: E08
  pages:
  - 5
  locator: Figure 2, complete task schema and caption
  summary: Task metadata/indicators, task collection, descended-from task, conditions, contrast and measured-by
    concept. CogPO/SWAN/NEMO references; imaging database line explicitly empirical. Example contrast is 0-back
    minus 2-back, not silently reversed.
- id: E09
  pages:
  - 5
  - 6
  locator: Relations and Basic ontological relations
  summary: OBO RO is-a, part-of, transformation-of and preceded-by adopted conceptually; spatial and has_participant/has_agent
    relations deliberately excluded. Not all proposed relations implemented in current release.
- id: E10
  pages:
  - 6
  locator: Relations between processes/tasks; Relations among tasks
  summary: measured by targets a task contrast; descended-from expresses task phylogeny/adaptation, with meta-analytic
    commensurability guiding task-versus-variant distinction. These are not formal cardinality, inverse or identity
    axioms.
- id: E11
  pages:
  - 6
  locator: Literature relations; Relations to observed data
  summary: All entities including relations can carry citations; CiTO support/refutation is described but only citesForInformation
    is currently implemented. CA links to external data/entities rather than storing empirical data.
- id: E12
  pages:
  - 6
  locator: Complete Technical infrastructure; footnote 4 and author GitHub link
  summary: Native MySQL store, generated OWL, RDF/SPARQL interfaces and LAMP/AJAX/JSON infrastructure. Author-reported
    export/accessibility is distinguished from present or historical independent execution.
- id: E13
  pages:
  - 6
  - 7
  locator: Benefits and challenges of collaborative knowledge building; Capturing and resolving disagreement; Curation;
    footnote 5
  summary: Wikipedia lessons motivate integrated concept/relation discussion, evidence-based as-needed curation
    and fork/merge dispute handling; no measured CA agreement/quality outcome is supplied.
- id: E14
  pages:
  - 7
  - 8
  locator: Utility introduction; Clearer vocabulary; Figure 3 and caption
  summary: Concept forking creates sense-specific pages plus a disambiguation page; synonyms retain separate terms.
    Figure 3 behavioral inhibition cognitive versus temperament meanings; screenshot license badge is site-specific.
- id: E15
  pages:
  - 7
  - 8
  locator: Improved query expansion, complete example
  summary: Historical sublexical-route expansion wrongly brings in drug-administration routes; specific phrase/related-concept
    expansion proposed, with no precision/recall benchmark or current query execution.
- id: E16
  pages:
  - 8
  locator: Metadata annotation/meta-analysis; Theory testing
  summary: Potential fine-grained brain-process mapping, cited eight-task prior study and future covariance-structure
    comparison. Paper explicitly says system cannot yet support proposed theory testing.
- id: E17
  pages:
  - 9
  locator: Translational mental health research; Figure 4 and caption
  summary: 'Five levels: syndromes, cognition, neural systems, signaling pathways and genes, with 13 named nodes.
    Links are proposed empirical relations, width tied to PubMed Jaccard association; six-reference annotation callout
    is illustrative, not clinical or causal validation.'
- id: E18
  pages:
  - 9
  - 10
  locator: Present status and future plans, complete; footnotes 6-10
  summary: Development began 2008; reports 904 terms=708 constructs+196 tasks, 795 definitions mostly acknowledged
    insufficient, fewer than 900 relations. Personalization/mining/finer tasks and new database/animal-literature
    links are future scope; some integrations already reported.
- id: E19
  pages:
  - 10
  - 11
  locator: Conclusion, Acknowledgments, complete 39-item bibliography and conflict-of-interest statement
  summary: All 39 references read; funding and author declarations retained. Related ontology citations are not
    automatically imports or evidence that this project reproduced their experiments.
