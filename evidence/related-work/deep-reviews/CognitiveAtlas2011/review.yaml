commitments:
- id: K01
  label: Task/construct separation
  statement: The schema separates latent mental concepts from prescribed tasks and uses contrast-level measurement
    links; it does not equate tasks with the processes they are named after.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E05
  - E06
  - E10
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K02
  label: Theory-neutral optional subdivision
  statement: Representations/processes are possible mental-concept subclasses but not required; this accommodates
    non-representational theories. No mandatory covering axiom is printed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K03
  label: SKOS and export representation levels
  statement: Paper models mental concepts with skos:Concept; later script rewrites source SKOS elements into owl:Class.
    Actual interpretation and identity require separate technical comparison.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - R02
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K04
  label: Prescribed task without overt behavior
  statement: A task can be an experimental stimulation without motor response; observable behavior is not a necessary
    condition for this task category.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K05
  label: Condition versus indicator versus contrast
  statement: Condition is manipulation context, indicator is recorded variable, contrast is a function of condition
    measurements. A contrast edge alone does not encode the numeric function.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E08
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K06
  label: Stroop signed contrast examples
  statement: Source prose gives incongruent minus congruent and incongruent minus neutral as Stroop-effect contrasts.
    This is illustrative arithmetic, not numbered ontology axioms or independently computed scores.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K07
  label: N-back contrast sign retained
  statement: Figure 2 labels its example 0-back minus 2-back. Retain that orientation, rather than silently substituting
    2-back minus 0-back; its relation to expected measurement polarity needs an explicit interpretation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K08
  label: Basic relation selection and exclusion
  statement: is-a/part-of/transformation-of/preceded-by are adopted; spatial and process-participant/agent relations
    are excluded. Property characteristics are not stated as DL axioms.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K09
  label: Contrast-bound measured-by
  statement: Mental process is related to the contrast that is hypothesized to manipulate/measure it. The claim
    is theoretical and does not prove construct validity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K10
  label: Task descent and commensurability
  statement: descended-from is historical/conceptual adaptation, not automatically subclassing. The source uses
    meta-analysis compatibility to distinguish derivation from minor variants without an operational criterion.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K11
  label: Informative citation implementation limit
  statement: Current cited implementation has one literature relation equivalent to citesForInformation; richer
    CiTO support/refutation is described, not implemented as reported.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K12
  label: Native store/export distinction
  statement: MySQL is the native store; OWL is generated for interoperability. No lossless semantic round-trip or
    complete export of discussion/conflict metadata is demonstrated.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - R02
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K13
  label: No empirical data storage
  statement: The paper repeatedly distinguishes storing knowledge/annotations from linking to external empirical
    datasets; do not claim internal patient, genetic or imaging data.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
  - E18
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K14
  label: Discussion and evidence-based curation
  statement: Concept/relation disagreements are exposed and curated with community evidence; consensus quality,
    traceable decisions and preservation of minority theories are not formally guaranteed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K15
  label: Forked senses versus synonyms
  statement: Forking produces distinct sense pages with separate task relations; synonym designation retains terms.
    Neither operation automatically establishes OWL equivalence or identity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E14
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K16
  label: Empirical cross-level association
  statement: Figure 4 edges reflect proposed empirical links and literature Jaccard association, not inheritance,
    causation or a biological mechanism proof.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E17
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K17
  label: 2011 status is author-reported population
  statement: Initial >800 curated terms differs from later 904 entries (708 constructs+196 tasks).795 definitions
    are explicitly often insufficient; fewer than 900 relation statements is not a relation-type count.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E18
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K18
  label: Future utility boundary
  statement: Precision/recall improvement, richer meta-analysis, theory testing and translation are proposed uses;
    theory testing is explicitly unsupported at that time. No new controlled utility experiment is reported.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E15
  - E16
  - E17
  - E18
  commitment_kind: PAPER_PROSE_OR_FIGURE_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
scenarios:
- id: S01
  label: Working-memory polysemy
  statement: Maintenance, manipulation and temporal/spatial memory senses share a label but differ in intended construct/task
    context. A query over the label alone can mix evidence.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  scenario_kind: AUTHOR_EXAMPLE
- id: S02
  label: Synonym-aware maintenance retrieval
  statement: Short-term memory and active-maintenance terminology can inform retrieval for a specified sense, with
    relevance/noise tradeoffs preserved.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E15
  scenario_kind: AUTHOR_EXAMPLE
- id: S03
  label: Sternberg within-task contrast
  statement: High-versus-low load and probe-match-versus-mismatch contrasts in one task need not measure the same
    process. Do not attach all measurement claims directly to the task name.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  scenario_kind: AUTHOR_ADVERSE_EXAMPLE
- id: S04
  label: Stroop inhibition dispute
  statement: Alternative accounts dispute active inhibition as the cause of the Stroop effect; citation and claimant
    context matter even if the task and contrast are agreed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E10
  scenario_kind: AUTHOR_ADVERSE_EXAMPLE
- id: S05
  label: N-back construct validity
  statement: A task commonly labeled working memory may have disputed construct validity; the generated ontology
    label is not empirical confirmation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E08
  scenario_kind: AUTHOR_ADVERSE_EXAMPLE
- id: S06
  label: Passive stimulation task
  statement: A movie-viewing imaging experiment can be a task without an overt motor response. Requiring an action
    output would exclude this intended case.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  scenario_kind: AUTHOR_EXAMPLE
- id: S07
  label: Signed Stroop difference
  statement: Incongruent-minus-congruent and incongruent-minus-neutral are distinct contrast functions, requiring
    conditions and indicators rather than one task-level link.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  scenario_kind: AUTHOR_EXAMPLE
- id: S08
  label: N-back sign reversal
  statement: Figure 2 source contrast is 0-back minus 2-back; reversing it changes the sign even if both link the
    same conditions. includes_condition edges alone do not encode weights or polarity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  scenario_kind: REVIEWER_ADVERSE_CASE
- id: S09
  label: Task adaptation versus variant
  statement: A descended-from task may require separate meta-analysis treatment if its outputs are not commensurate;
    same name or superficial structural similarity is insufficient.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
  scenario_kind: AUTHOR_EXAMPLE
- id: S10
  label: Informative citation without support
  statement: A citation mentioning a claim can supply context or opposition rather than support. citesForInformation
    must not be promoted to an evidential-support relation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
  scenario_kind: REVIEWER_ADVERSE_CASE
- id: S11
  label: Behavioral-inhibition sense split
  statement: Cognitive inhibition of actions and temperament/shyness senses occupy separate pages and measurement
    relations after disambiguation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E14
  scenario_kind: AUTHOR_EXAMPLE
- id: S12
  label: Synonyms without forced merge
  statement: Declarative/explicit-memory expressions are retained while marked synonymous; this does not by itself
    authorize collapsing every concept/version resource.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E14
  scenario_kind: AUTHOR_EXAMPLE
- id: S13
  label: Fork with stale measurement links
  statement: If a disputed concept is split, earlier citations/contrasts may apply to only one new sense. Paper
    does not define automatic reassignment or versioned provenance rules.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
  - E14
  scenario_kind: REVIEWER_ADVERSE_CASE
- id: S14
  label: Sublexical route query
  statement: Historical PubMed expansion adds drug-administration routes to a cognitive phrase. Proposed sense-specific
    expansion has no independently measured precision/recall gain here.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E15
  scenario_kind: AUTHOR_ADVERSE_EXAMPLE
- id: S15
  label: Latent variables and eight tasks
  statement: The cited 2009 task/process analysis motivates future meta-analysis. Its eight-task dataset is not
    a new evaluation or rerun of this 2011 CA prototype.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E16
  scenario_kind: AUTHOR_CITED_PRIOR_EXAMPLE
- id: S16
  label: Competing categorization theories
  statement: Single-versus-separate cognitive processes could yield different covariance predictions. Authors explicitly
    say CA cannot yet perform this theory testing.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E16
  scenario_kind: AUTHOR_FUTURE_EXAMPLE
- id: S17
  label: Stop-go response inhibition and VLPFC
  statement: Figure 4 callout relates a task contrast, cognitive label and brain activation, with six cited reports.
    Neither citation count nor edge width proves a causal neural mechanism.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E17
  scenario_kind: AUTHOR_ILLUSTRATION
- id: S18
  label: Same literature association, different mechanism
  statement: Co-occurrence can reflect shared terminology or publication patterns; the same Jaccard value need not
    mean the same biological relation or construct validity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E17
  scenario_kind: REVIEWER_ADVERSE_CASE
- id: S19
  label: Present-but-insufficient definition
  statement: 795 defined terms out of 904 does not imply expert-accepted definitions; authors say most are insufficient.
    Missing 109 is arithmetic from reported totals, not a recreated database audit.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E18
  scenario_kind: AUTHOR_EXPLICIT_LIMIT
- id: S20
  label: Class versus concept record
  statement: Converting a SKOS concept record to owl:Class can change what it denotes and how relations are interpreted.
    A byte-level string replacement is not a proved semantics-preserving transformation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - R02
  scenario_kind: REVIEWER_ADVERSE_CASE
- id: S21
  label: External linked data
  statement: Imaging/genetic/brain-structure resources are linked rather than stored; reproducible results depend
    on external versions, query dates and availability.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
  - E18
  scenario_kind: AUTHOR_EXAMPLE
- id: S22
  label: Excluded agency participation
  statement: A request for the agent participating in a latent process is outside the implemented relation set described
    in the paper. A curator/contributor metadata field is not a substitute has_agent relation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E13
  scenario_kind: REVIEWER_BOUNDARY_CASE
evaluation:
  Verification:
    statement: 'Authors describe schema relations, database-to-OWL and RDF/SPARQL services, but provide no executed
      OWL profile/reasoner/regression results in this selected paper. We verified retained hashes/API blob correspondence
      and parsed selected header metadata only. Figures and prose are not a machine satisfiability proof; #241 owns
      exact declarations/constraints and tests.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E07
    - E08
    - E09
    - E12
    - R01
    - R02
    - R03
    - R04
  Validation:
    statement: Manual vocabulary curation by three authors and feedback from a small investigator group support
      design relevance. Sample size/protocol/agreement statistics and expert adequacy criteria are not reported;
      most available definitions are explicitly judged insufficient. A published paper's reviewer names do not validate
      this dossier.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E05
    - E13
    - E18
  Evaluation:
    statement: Prototype figures/screenshots and 2011 content totals characterize development. No controlled retrieval,
      mapping accuracy, curation outcome, usability or performance benchmark is reported. Eight-task earlier research,
      six-reference edge illustration and Wikipedia/GO evidence are cited prior examples rather than fresh CA evaluation.
      Proposed theory testing is explicitly unsupported.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E04
    - E13
    - E14
    - E15
    - E16
    - E17
    - E18
  Assessment:
    statement: The paper candidly preserves disagreement, optional representations, excluded agency/spatial relations,
      coarse task detail and incomplete definitions. Reviewer adverse cases delimit measurement/context, synonym/fork
      semantics, empirical association and later class-export differences without a corpus-wide quality score.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E05
    - E09
    - E10
    - E11
    - E13
    - E14
    - E17
    - E18
    - R02
  Assurance:
