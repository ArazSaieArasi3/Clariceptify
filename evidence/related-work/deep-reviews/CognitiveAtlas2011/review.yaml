dimensions:
  D1_identity_coverage:
    statement: All 11 PDF/article pages, four figures including every schema field and the 13-node five-layer empirical
      illustration, 10 numbered footnotes and 39 references were read and visually checked. No tables, appendices
      or numbered equations occur. Nine authors/date/DOI match publisher metadata. 2011 paper, 2015 export header
      0.3, paper-linked repository and current website remain version-distinct.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E07
    - E08
    - E14
    - E17
    - E19
    - M01
    - R01
    - R03
    - R04
  D2_problem_contribution:
    statement: The paper addresses ambiguous cognitive terminology and the task/construct conflation that undermines
      cross-study integration. It contributes a collaborative knowledge base separating mental constructs from experiments
      and contrast-specific measurement claims, with discussion/sense management and standard access. It does not
      claim a complete cognitive theory or validate all mental-to-brain mappings.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E03
    - E04
    - E05
    - E06
    - E10
    - E13
    - E14
    - E18
  D3_method:
    statement: Manual source analysis and three-author curation seed >800 terms; schema/interaction design, native
      relational implementation and feedback from a small investigator group support iterative development. The
      paper cites interaction-design work and describes collaborative curation but no named ontology-engineering
      protocol, systematic search/inclusion method, quantified usability/expert agreement study or reproducible
      requirements-to-test matrix.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E05
    - E12
    - E13
    - E18
    - E19
  D4_requirements:
    statement: Needs include precise sense selection, distinguishing a task from a contrast/construct, recording
      relations/disagreement/citations and linking external data. Source examples and reviewer adverse cases below
      retain the intended use. There is no numbered CQ suite or complete operational acceptance test set; reviewer
      reconstructed query needs are not attributed as author-tested CQs.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E03
    - E06
    - E10
    - E11
    - E14
    - E15
    - E16
    - E18
  D5_concepts:
    statement: Catalog covers latent construct versus physical realization, optional process/representation distinction,
      task/condition/indicator/contrast, task collections, sense/term/definition and contributor/curator/discussion/citation
      roles. Every named diagram vocabulary and example is included. These are paper concepts, not a complete list
      of all 904 2011 terms or selected OWL class IRIs.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E05
    - E06
    - E07
    - E08
    - E11
    - E13
    - E14
    - E17
    - E18
  D6_relations_formalization:
    statement: Selected is-a/part-of/transformation-of/preceded-by, contrast-bound measured-by, task descent and
      citation/lexical/collaboration links are preserved with scope. Spatial and participation/agent relations are
      expressly excluded. No numbered DL/FOL axioms, property characteristics, cardinalities, signed arithmetic
      implementation or exact class/individual semantics are supplied. Figure captions distinguish empirical associations
      from formal ontological relations.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E06
    - E07
    - E08
    - E09
    - E10
    - E11
    - E17
  D7_grounding:
    statement: Paper reuses SKOS, CogPO and selected OBO RO relations plus Dublin Core/SIOC/SWAN/CiTO/NEMO metadata
      or application vocabularies. It does not establish BFO/DOLCE/UFO upper grounding or an exact imported edition.
      Later export includes BFO1.1/CogPO2011 namespace hints but no declared imports. Latent constructs, neural
      realizations, agency participation and temporal identity remain delimited rather than silently completed.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E05
    - E07
    - E08
    - E09
    - E11
    - E12
    - R02
    - R03
  D8_artifact_correspondence:
    statement: Exact paper author GitHub link was followed, current public commit/tree checked and generator bytes
      pinned. Official retained 13-file export and separate two-file discussion repository are independently identified;
      selected source blobs match API hashes. Header metadata parse succeeded, while generation, pickle loading,
      complete class glossary, imports, reasoning and SPARQL were not executed. Source license notices and historical
      correspondence remain separate.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E12
    - E18
    - R01
    - R02
    - R03
    - R04
  D9_evaluation:
    statement: Evidence is an implemented prototype with schema figures and sense screenshot, author-reported 904
      entries/795 definitions/<900 relations, external prior studies and proposed utility. Most initial definitions
      are expressly insufficient; no controlled precision/recall, mapping accuracy, user agreement or reasoning
      benchmark is reported. Eight-task prior work, six-reference illustration and literature Jaccard association
      are not fresh CA evaluation populations.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E07
    - E08
    - E14
    - E15
    - E16
    - E17
    - E18
    - E19
  D10_critical_synthesis:
    statement: 'Strong overlap with Clariceptify concerns theory-bound conceptual claims, terms/senses, contributors,
      rationale/disagreement and evidence links. Limits include optional undeclared formal semantics, missing measured-claim
      context, citation polarity implementation gap, incomplete definitions, coarse tasks and later export/type
      differences. Retain these as comparison/test proposals in #241/#254/#126; no automatic alignment, new novelty
      claim or model/release change follows.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E05
    - E10
    - E11
    - E13
    - E14
    - E16
    - E18
    - R02
    - R03
catalog:
- id: C001
  label: Mental concept / latent construct
  statement: A theoretically postulated unobservable construct; the knowledge-base entity denotes the construct
    rather than its physical brain instantiation. Not every concept is required to be categorized as a process or
    representation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C002
  label: Mental process
  statement: A proposed kind of mental concept operating on representations; paper permits non-representational
    cognition and does not mandate this taxonomy for every concept.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C003
  label: Mental representation
  statement: A possible mental entity standing in relation to a physical arrangement or abstract concept, including
    another mental entity. Its existence is not mandatory for all accepted theories.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C004
  label: Physical instantiation / brain tissue
  statement: Realization of a mental construct is distinguished from what the knowledge-base record refers to. Paper
    supplies no complete realization/dependence axiom.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C005
  label: Mental task / psychological task
  statement: A prescribed activity to engage/manipulate mental function for investigation, not identical to the
    latent process being studied; overt response is optional.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E06
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C006
  label: Experimental condition
  statement: Subset of an experiment defining a manipulation, including categorical or parametric conditions. Reuses
    CogPO condition schema.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C007
  label: Indicator
  statement: A recorded quantitative or qualitative analysis variable, including response time/accuracy and physiological
    measurements. The original implementation emphasizes behavioral indicators.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C008
  label: Contrast
  statement: A function over experimental conditions and their indicators; may be one condition, a baseline comparison
    or a linear/nonlinear combination. The process-measurement claim attaches here rather than directly to the task
    label.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E10
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C009
  label: Task collection / battery
  statement: Collection of related tasks, illustrated by CNP Memory Battery and SWAN collection reuse; distinct
    from a task subtype or contrast.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C010
  label: Concept definition
  statement: Editable initial definition attached to a term; source explicitly acknowledges most 2011 definitions
    would be insufficient to experts. Text presence is not logical sufficiency.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E18
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C011
  label: Concept sense
  statement: A separate meaning of a term created when conceptual disagreement is irreconcilable; has its own page
    and task relationships.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E14
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C012
  label: Disambiguation page
  statement: Routes an ambiguous original term to distinct sense pages rather than treating them as equivalent.
    Figure 3 gives cognitive and temperament behavioral-inhibition senses.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E14
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C013
  label: Synonym / alternate label
  statement: Different expressions considered to refer to the same process while retaining original terms. Lexical
    synonymy is not by itself owl:equivalentClass or sameAs.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E14
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C014
  label: Term / label / title
  statement: Surface expression used to identify a mental concept/task; multiple meanings or multiple names motivate
    explicit concept/term separation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E07
  - E14
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C015
  label: Assertion / theoretical claim
  statement: Relations express theoretical commitments linking concepts or contrasts, which can be discussed and
    cited. A relation statement is not automatically an uncontested scientific fact.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E10
  - E11
  - E13
  kind: PAPER_CONCEPT
  source_definition: Attributed reviewer paraphrase of selected paper; not a released-class definition glossary.
- id: C016
  label: Discussion / forum
  statement: Integrated discussion for concepts and relations keeps disagreements/history available beside editable
    content. It is not the mental process being described.
  basis: REVIEWER_INTERPRETATION
