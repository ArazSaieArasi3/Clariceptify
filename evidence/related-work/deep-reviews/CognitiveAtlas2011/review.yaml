findings:
- id: F01
  label: Specific measurement granularity
  statement: Separating latent construct, prescribed task, condition, indicator and contrast is a substantial prior
    contribution. It avoids treating the name of an experiment as a validated process measurement.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E05
  - E06
  - E10
  finding_kind: STRENGTH
  followup_issue: 241
- id: F02
  label: Explicit disagreement and sense lifecycle
  statement: Discussion, evidence-sensitive curation, forking and synonym retention address conceptual plurality
    directly. This overlaps with conceptualization/rationale/agent concerns and must be included in later novelty
    comparison.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
  - E14
  finding_kind: STRENGTH
  followup_issue: 241
- id: F03
  label: Representation neutrality has a formal cost
  statement: Optional process/representation categories accommodate broad theories but provide no complete covering/disjointness/identity/dependence
    axioms. Do not infer a fully axiomatized cognitive foundation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E09
  finding_kind: LIMIT
  followup_issue: 241
- id: F04
  label: Schema arrows do not settle class/individual semantics
  statement: SKOS concepts, examples, class inheritance, metadata-property references and empirical database links
    appear in visual schemas. A uniform mapping of all arrows to OWL subclass or all records to classes is not justified.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
  - R02
  finding_kind: FORMAL_LIMIT
  followup_issue: 241
- id: F05
  label: Measured-by needs claim and context provenance
  statement: A measurement link is a disputed theoretical claim about a specific contrast, not a universal causal
    guarantee. A binary relation alone may lose theory, condition/indicator choice, population, evidence and disagreement
    context.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E06
  - E10
  - E11
  finding_kind: LIMIT
  followup_issue: 241
- id: F06
  label: Condition membership omits arithmetic
  statement: A contrast may be nonlinear or signed; includes_condition alone does not preserve coefficient, ordering,
    baseline or indicator. Figure 2's 0-minus 2 orientation is kept literally for later technical testing.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E08
  finding_kind: FORMAL_LIMIT
  followup_issue: 241
- id: F07
  label: Task descent is not subclass identity
  statement: Historical adaptation, subtype relations and meta-analytic commensurability are different concepts.
    The paper gives no executable threshold for deciding task speciation or inheritable features.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
  finding_kind: LIMIT
  followup_issue: 241
- id: F08
  label: Agency and spatial semantics expressly excluded
  statement: has_participant/has_agent and spatial relations are omitted. Bibliographic contributors and community
    curators are represented socially, without resolving participation in a latent mental process.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E13
  finding_kind: EXPLICIT_AUTHOR_LIMIT
  followup_issue: 241
- id: F09
  label: Citation polarity implementation gap
  statement: Paper discusses CiTO support/refutation capability but reports only informative citation implemented.
    Figure 1 SWAN citation references are not automatically identical to CiTO typed evidence.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E11
  finding_kind: EXPLICIT_AUTHOR_LIMIT
  followup_issue: 241
- id: F10
  label: Definition presence is not adequacy
  statement: 904 entries=708 mental constructs+196 tasks;795 have definitions but authors judge most insufficient
    to experts. These are 2011 author-reported records, not complete valid class definitions or present website
    counts.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E18
  finding_kind: EXPLICIT_AUTHOR_LIMIT
  followup_issue: 241
- id: F11
  label: Relation quantities are not property populations
  statement: Fewer than 900 relations means database relation statements, not 900 property types; >800 initial terms
    and 904 later entries describe different stages. Neither is an independently parsed OWL class count.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E18
  finding_kind: ACCOUNTING_LIMIT
  followup_issue: 241
- id: F12
  label: Utility gains remain largely prospective
  statement: Schema/screenshot and developmental status demonstrate a prototype, not controlled gains in precision/recall,
    neuroscientific prediction, mapping accuracy or expert agreement. Theory testing is explicitly future functionality.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - E14
  - E15
  - E16
  - E18
  finding_kind: EVALUATION_LIMIT
  followup_issue: 241
- id: F13
  label: Cross-level edges are empirical proposals
  statement: Figure 4 Jaccard association and six-reference callout are not entailment, causal direction, molecular
    mechanism or clinical validation. No reproducible query/date/count table is supplied for the illustrated weights.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E17
  finding_kind: VALIDITY_LIMIT
  followup_issue: 241
- id: F14
  label: Native database versus OWL export
  statement: Paper uses MySQL with generated OWL, leaving richer data outside formal export. A lossless or semantically
    equivalent round-trip of statements/discussions/claims is not shown.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - R02
  finding_kind: REPRODUCIBILITY_LIMIT
  followup_issue: 241
- id: F15
  label: Later generator changes representation
  statement: 'Pinned generator rewrites skos:Concept to owl:Class and introduces its own measured_by/measures/domain/range
    choices. These need exact all-class/constraint reconciliation in #241, not silent attribution to the 2011 diagrams.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E07
  - E08
  - R02
  - R03
  finding_kind: ARTIFACT_QUESTION
  followup_issue: 241
- id: F16
  label: Formal version and repository roles differ
  statement: Selected cogat.v 2.owl has formal header 0.3, not version 2. Export repository is distinct from the
    two-file MIT discussion repository and the author link printed in 2011. Current-source availability does not
    establish historical byte identity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - R01
  - R03
  - R04
  finding_kind: VERSION_LIMIT
  followup_issue: 241
- id: F17
  label: Namespace does not establish foundation edition
  statement: Paper reuses SKOS/CogPO/OBO RO; later BFO 1.1 namespace strings without declared imports do not establish
    paper BFO grounding, exact imported definitions or an accepted alignment.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E08
  - E09
  - R02
  - R03
  finding_kind: FOUNDATION_LIMIT
  followup_issue: 241
- id: F18
  label: Forking and curation execution not measured
  statement: Evidence-based consensus is a design goal. The paper supplies no fork/merge lineage rule, decision
    threshold, conflict-resolution success metric or measured curator agreement.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
  - E14
  - E18
  finding_kind: LIMIT
  followup_issue: 241
- id: F19
  label: License and source identity stay separate
  statement: Open-access paper notice, screenshot site badge, generator author terms and discussion-repository MIT
    notice concern different materials. No blanket reuse permission or upstream change is inferred.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E14
  - R02
  - R04
  finding_kind: ASSURANCE_LIMIT
  followup_issue: 241
- id: F20
  label: Editorial and integration boundaries
  statement: p.10 CogPO cross-reference points to footnote 2 though CogPO is footnote 3. Existing PubAtlas/PubBrain/PhenoWiki
    and NeuroSynth-map reports remain distinct from planned NeuroLex/finer-task/animal-literature integration. No
    current endpoint or integration test was performed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E18
  - E19
  finding_kind: SOURCE_LIMIT
  followup_issue: 241
questions:
- id: Q01
  label: Exact root, every class and historical provenance
  statement: Choose the already-scoped cogat.v 2.owl candidate, inventory every local/external/referenced/deprecated
    class and missing definition, and compare selected export header 0.3 with the separate paper-linked generator/source.
    Record any true 2011 correspondence limits; do not sum releases or reuse paper 904 as a class count.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - E18
  - R01
  - R02
  - R03
  - R04
  followup_issue: 241
- id: Q02
  label: SKOS concept to OWL class semantics
  statement: Reconcile lexical concept records, class declarations, stable identifiers and class/instance/reference
    levels in raw RDF and generated OWL. Assess whether transformation preserves the intended meaning rather than
    merely syntactic output.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E07
  - E08
  - R02
  followup_issue: 241
- id: Q03
  label: Measurement direction, domain, range and inverse
  statement: Inspect measured_by and measures IRIs, task-versus-contrast targets, declared domain/range and any
    inverse relation. Preserve exact generated source differences and test a correct contrast link plus an adverse
    task-only or wrong-kind filler.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E08
  - E10
  - R02
  - R03
  followup_issue: 241
- id: Q04
  label: Conditions, indicators and signed contrast structure
  statement: Check every selected contrast/condition class and restriction against diagrams, including source 0-back
    minus 2-back orientation, task nesting and indicator provenance. Distinguish membership from signed functional
    semantics and missing expression fields.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E08
  - R02
  followup_issue: 241
- id: Q05
  label: Basic relation mappings and foundations
  statement: Trace is-a/part-of/transformation-of/preceded-by/descended-from mappings, all referenced undeclared
    classes, namespaces and direct imports. Distinguish OBO RO conceptual reuse and BFO1.1/CogPO2011 namespace hints
    from a verified foundation edition/import closure.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E09
  - E10
  - R02
  - R03
  followup_issue: 241
- id: Q06
  label: Definitions, citation polarity and source provenance
  statement: For all selected classes locate author definition annotations or explicit missing states. Inspect CiTO/SWAN,
    informative citations versus support/refutation and whether contributor/date/relation evidence survives export.
    No comment text or citation count becomes logical adequacy.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E11
  - E18
  - R02
  followup_issue: 241
- id: Q07
  label: Disagreement, synonym and fork lineage
  statement: Determine which sense/discussion/synonym/merge assertions actually exist in the selected artifact.
    Check a two-sense example and a stale-link counterexample without inventing identity or expert consensus semantics.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
  - E14
  - R02
  - R03
  followup_issue: 241
- id: Q08
  label: Reproducible generation and bounded semantic execution
  statement: Bind raw data tables/dumps, source licenses and exact generator/tool versions. Use only declared safe,
    reproducible parsing/profile/query/reasoner checks; generator and serialized input execution are not assumed
    by paper closure. Report concrete blockers and no historical/current-equivalence claim.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - E18
  - R01
  - R02
  - R03
  - R04
  followup_issue: 241
synthesis:
- id: Y01
  label: Prior conceptualization workflow
  statement: Preserve explicit discussion, curators/contributors, sense forks and evidence-sensitive decisions as
    prior conceptual knowledge lifecycle structure; do not claim such concerns absent from prior cognitive ontologies.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
  - E14
  decision: DEFER_TO_OWNER_AFTER_SYNTHESIS
- id: Y02
  label: Measurement versus mental-content mapping
  statement: Use construct/task/contrast distinctions and theory-sensitive measured-by as candidate comparisons.
    Shared labels or RDF access do not justify equivalence with Clariceptify entities.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E05
  - E06
  - E10
  decision: DEFER_TO_OWNER_AFTER_SYNTHESIS
- id: Y03
  label: Candidate scenario bank
  statement: Keep disputed Stroop/N-back interpretation, signed contrast, informative-but-opposing citation and
    stale links after sense fork as later candidate tests, not adopted fixtures or requirements.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E08
  - E11
  - E14
  decision: DEFER_TO_OWNER_AFTER_SYNTHESIS
- id: Y04
  label: Provenance and representation lessons
  statement: Separate native knowledge base, generated OWL, current API and historical paper; report all-class definitions/imports
    and missing source semantics before alignment proposals.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - E18
  - R01
  - R02
  - R03
  - R04
  decision: DEFER_TO_OWNER_AFTER_SYNTHESIS
- id: Y05
  label: Comparison and queue routing
  statement: 'Paper #79 is complete within its reading boundary; technical #241, comparison #254 and synthesis #126
    remain open. All three batch 4 paper inputs have complete deep dossiers but artifact work is unfinished. Next
    acquired full paper is #262.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E18
  - E19
  decision: DEFER_TO_OWNER_AFTER_SYNTHESIS
- id: Y06
  label: Owner decision
  statement: All candidate reuse/extension decisions remain DEFER_TO_OWNER_AFTER_SYNTHESIS; no model, manuscript,
    requirement or release changes follow from this paper review.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E19
  decision: DEFER_TO_OWNER_AFTER_SYNTHESIS
