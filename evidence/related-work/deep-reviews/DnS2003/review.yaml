scenarios:
- id: S01
  label: Contextual classification
  statement: 'Positive reconstruction: a communication method describes a situation, a message-bearing
    information object plays Expression and a description plays Meaning. Adverse: shared URI spelling
    alone does not identify the same meaning or referent.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E08
  - E09
- id: S02
  label: Role versus performer
  statement: 'Positive: one endurant plays a selected communication role. Adverse: identifying role with
    performer erases the possibility of different roles in different descriptions. No role rigidity or
    global identity criterion is established by the signature alone.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E06
  - E09
- id: S03
  label: Parameter values
  statement: 'Positive: a parameter has a Region witness as required by 21. Adverse: multiple regions
    remain possible; neither21 norFig.1 imposes a unique address or value.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E10
- id: S04
  label: Local versus joint coherence
  statement: 'Manual adverse argument, not solver execution: each of P(a) and not P(a) can be individually
    compatible with a ground theory that decides neither; their conjunction is inconsistent. The SoA wording
    therefore needs a joint-consistency condition before such a guarantee can be claimed.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
- id: S05
  label: One shared description
  statement: 'Positive: all setting constituents may have witnesses through one description. Adverse:13
    permits separate w,z witnesses per edge; it does not force that common-description choice or identify
    the witness from 4.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E05
- id: S06
  label: Indexed category scope
  statement: 'Positive: one course-only description is allowed by prose. Adverse: a naive universal per-Pi
    reading of 9 could demand components from every category. Treat this as a schema reconstruction question
    before executable checks.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E06
- id: S07
  label: Filler existence asymmetry
  statement: Positive:21 supplies a parameter-value existential. Adverse:18-19 are implication signatures,
    so a role or course without a playedBy/sequences edge is not rejected by those signatures alone.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
- id: S08
  label: Message-dependent agent roles
  statement: 'Positive: Resolver decodes a query then encodes an answer. Adverse: assigning it permanently
    to just Encoder or Decoder loses the different-message qualification in Fig. 5.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
- id: S09
  label: Human/software intentionality
  statement: 'Positive: the SWAP model assumes human-derived software intentionality. Adverse: a running
    peer or successful network transfer does not establish autonomous understanding or human semantic
    agreement.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
  - E11
- id: S10
  label: Context homonymy
  statement: 'Positive: distinguish Jakobson Context/referent from the S-description filling interpretation
    S-context. Adverse: merging them merely because both are called context collapses modeling levels.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E10
- id: S11
  label: Paper-to-file substitution
  statement: 'Positive: retain ExtendedDnS397 as a later related artifact for investigation. Adverse:
    treating its58 local classes or2005 README counts as the 2003 paper class population invents historical
    fidelity.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
  - A02
  - A03
- id: S12
  label: Structural versus semantic success
  statement: 'Positive: parse11 supplied modules and resolve declared imports without network access.
    Adverse: this does not demonstrate OWL-DL profile, consistency, correct individual counts or complete
    manual definitions.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
  - A02
  - A03
- id: S13
  label: Temporal/systemic component
  statement: 'Positive: use t_component for a source-described systemic relation. Adverse: inferring a
    full time-indexed identity history from a binary printed predicate invents omitted temporal parameters.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
- id: S14
  label: Partial communication model
  statement: 'Positive: the visible diagrams support a worked communication/query illustration. Adverse:
    missing Code box, omitted participation/setting links and absent refined process description prevent
    a claim of complete executable SWAP coverage.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E10
  - E11
  - E12
findings:
- id: F01
  label: Direct prior overlap
  statement: D&S explicitly treats conceptualization, context, communication and interpretation; later
    novelty arguments cannot characterize all prior work as static concept taxonomies. Compare exact unmet
    scenarios after synthesis.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E01
  - E03
  - E08
  - E09
- id: F02
  label: Joint coherence not guaranteed by wording
  statement: Individually coherent assertions do not suffice for joint consistency. The adverse case is
    reviewer reasoning, not an executed countermodel or a claim that every source example is inconsistent.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
- id: F03
  label: Layering is not complete semantic preservation
  statement: First-order reification of partial theories/models enables contextual entities, but the paper
    does not prove faithful reconstruction of all model-theoretic satisfaction or all source-theory consequences.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E04
  - E13
- id: F04
  label: Category-index scope
  statement: Pi/PiD/SDi/Si are presentation-level schema indices. A universal instantiation policy must
    be specified before(9) is treated as a demand for every category. Conditional ambiguity is not proven
    inconsistency.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E06
- id: F05
  label: Missing selectedBy inverse display
  statement: 'Only satisfies/satisfiedBy has an explicit numbered inverse axiom. selectedBy in 13 cannot
    be substituted with selects solely from its name; external artifact inspection remains #235.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E05
- id: F06
  label: Per-edge versus common-description witness
  statement: Display13 has local existential witnesses; no explicit joint condition ties every constituent
    to one selected description or the witness of 4. This limits the derived unification claim.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E05
- id: F07
  label: Unparenthesized display 14
  statement: Preserve its source grouping defect and distinguish proposed reconstruction. Do not publish
    a repaired formula as the author transcription.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
- id: F08
  label: Part direction and time boundary
  statement: Part orientation/constitution is delegated to ground definitions; t_component is binary here
    despite temporal terminology. No complete temporal trace or corrected part-of direction is inferred.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E10
- id: F09
  label: Existence and disjointness limits
  statement: Parameter-value existence21 differs from role/course typing18-19. Explicit PiD/SD disjointness6
    does not establish all-category or Description/Situation disjointness.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E06
- id: F10
  label: Semiotic role/filler discipline
  statement: Expression/message are roles filled by information objects, meanings by descriptions and
    S-context by S-descriptions. This distinction is prior conceptual machinery, not automatically identical
    to later LMM classes.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E10
- id: F11
  label: Six constituents versus figure coverage
  statement: Jakobson prose discusses six constituents, including Code. Fig. 3 omits an explicit Code
    box and adds Address; diagram coverage alone is not complete executable six-role modeling.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E10
- id: F12
  label: Three-versus-four editorial count
