dimensions:
  D1_identity_coverage:
    statement: Exact author PDF identity and all content units are pinned. Roman author pagination is
      kept separate from publisher pp. 689-706; the later formal distribution is not the exact paper version.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E14
    - A01
  D2_problem_contribution:
    statement: D&S addresses how descriptions contextualize situations and supports social communication/interpretation
      for Semantic Web consensus. Contribution is conceptual reification plus a SWAP application; global
      semantic interoperability is not demonstrated.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E03
    - E08
    - E13
  D3_method:
    statement: Method moves partial theories/models into first-order description/situation entities over
      DOLCE, then specializes a communication template using Jakobson/Saussure and applies it to SWAP.
      No reproducible systematic ontology-engineering protocol, elicitation sample or experiment specification
      is reported.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E03
    - E09
    - E10
    - E13
  D4_requirements:
    statement: Intended users include ontology/agent designers and SWAP users/peers. Context retention
      and interpretation are stated needs; no formal competency-question suite is provided. Positive/adverse
      scenarios below are explicitly reviewer reconstructions.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E08
    - E10
    - E11
    - E12
  D5_concepts:
    statement: All ontology-bearing paper categories, display labels, core metatheoretic distinctions
      and application-role/filler primitives are catalogued. Figure spelling variants are preserved; process
      actions and examples are not silently converted into OWL classes.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E05
    - E06
    - E08
    - E09
    - E10
    - E11
    - E12
  D6_relations_formalization:
    statement: All 23 numbered displays are transcribed with source grouping preserved, plus the separate
      interpretation map and every visible figure slot. Signature typing, existential witnesses, inverse
      omission, indexed-schema scope and Fig. 1 multiplicities are analyzed without silently repairing
      formulas or claiming satisfiability.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E04
    - E05
    - E06
    - E07
    - E09
  D7_grounding:
    statement: Paper explicitly uses DOLCE and says the descriptive construction can adapt to other foundations.
      Exact DOLCE edition is not established. Role/filler, content/carrier, mental/social interpretation
      and temporary-component distinctions are retained; no BFO/UFO grounding is asserted.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E03
    - E05
    - E09
    - E10
    - A02
  D8_artifact_correspondence:
    statement: 'Three bounded GitHub repository searches did not identify a corresponding development
      repository. Official LOA overview led to retained DLP3971.zip with 11 OWL modules; ExtendedDnS397
      is a later candidate with 58 local named classes. All IRIs/comment availability are indexed, manual
      definitions and 2003 correspondence remain #235.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - A01
    - A02
    - A03
  D9_evaluation:
    statement: No reasoner/profile log, independent validation sample, controlled benchmark or formal
      verification is identified in this paper. Worked communication/SWAP examples and unreplicated WordNet
      count are separated from executed archive parsing. All five evaluation functions below retain this
      boundary.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E10
    - E11
    - E12
    - E13
    - A01
  D10_critical_synthesis:
    statement: Strong direct prior overlap includes context, conceptualization and expression/meaning/referent
      distinctions. Countercases expose local-versus-joint consistency, description-witness and version
      gaps. These are synthesis inputs, not adopted Clariceptify changes.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E05
    - E06
    - E09
    - E12
    - E13
