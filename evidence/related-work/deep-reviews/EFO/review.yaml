scenarios:
- id: S01
  label: Positive perspective pair
  statement: Common-sense color quality and scientific surface-process account provide different thought objects/conceptions
    of one physical reality; they must not be collapsed into numerically different material objects merely because
    their descriptions differ.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E05
- id: S02
  label: Positive world-relative fiction
  statement: Distinguish the created Holmes cultural artifact from the person in the fictional world; physical/mental
    status is relative to the relevant world and level of analysis.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E09
- id: S03
  label: Positive aspect representation
  statement: Different ephemeral Paul concepts can represent the encyclopedic file object without asserting that all
    concepts themselves are identical or that Paul has temporal parts.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
- id: S04
  label: Adverse mixed reference propagation
  statement: If one concept x represents both a referential concept and a nonreferential concept, A14-A15 derive both
    statuses for x. Under D1-D2 with normalized predicate names this entails a contradiction. This is a conditional
    manual consequence, not an executed prover result or proof that the whole ontology is inconsistent.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E14
- id: S05
  label: Adverse uniqueness shortcut
  statement: A11 constrains the inverse object relation; a candidate model in which one concept has two different
    entity objects is not excluded by that formula alone. Do not claim the formula enforces one object per concept.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
- id: S06
  label: Uncovered collective subject
  statement: A jointly authored reference ontology cannot simply be assigned a collective possessor under A8-A9, because
    HumanBeing is the explicit range and collective subjects are deferred.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
