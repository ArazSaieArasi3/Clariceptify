findings:
- id: F001
  label: Exact independent source
  statement: This four-author8-page2015 journal paper differs from the16-page2014 predecessor, its PrEmo evaluation
    and the later December cognition extension.
  evidence:
  - E01
  - E14
  - E16
  - E17
  basis: REVIEWER_INTERPRETATION
- id: F002
  label: Contextual modeling strength
  statement: The model explicitly joins situation descriptions, sensing channels, memory and emotion expression,
    helping avoid a flat list of emotion labels.
  evidence:
  - E02
  - E05
  - E06
  basis: REVIEWER_INTERPRETATION
- id: F003
  label: Structured collaborative input
  statement: FrameNet-guided forms and roles provide a concrete interaction path for structured emotion associations
    rather than unrestricted text alone.
  evidence:
  - E08
  basis: REVIEWER_INTERPRETATION
- id: F004
  label: Emotion versus detection
  statement: The paper explicitly separates modeling associations from recognizing emotion; storing an emotion
    label is not an emotion-classification result.
  evidence:
  - E09
  basis: REVIEWER_INTERPRETATION
- id: F005
  label: Theory agnostic is an objective
  statement: Categorical/dimensional/appraisal flexibility is a design goal, without complete instantiated
    mappings or comparative evaluation of every theoretical model.
  evidence:
  - E02
  - E03
  - E04
  basis: REVIEWER_INTERPRETATION
- id: F006
  label: Restricted affective coverage
  statement: Full-blown emergent emotion is selected; broader moods, stances, bonds and other affective categories
    are background or future work.
  evidence:
  - E02
  - E12
  basis: REVIEWER_INTERPRETATION
- id: F007
  label: Foundation evidence
  statement: DOLCE family,Description/Situation and FrameNet reuse are explicit. No exact foundational software
    edition follows from the family name or unversioned import paths.
  evidence:
  - E05
  - E15
  - E16
  basis: REVIEWER_INTERPRETATION
- id: F008
  label: Literal context direction
  statement: Figure2 DULSituation-to-SocialContext/EnvironmentalContext and Interface-to-PersonalContext arrows
    must not be silently inverted; selected Maysource repeats these directions.
  evidence:
  - E07
  - E15
  basis: REVIEWER_INTERPRETATION
- id: F009
  label: Paper versus local class population
  statement: Figure2 has39 labels including12prefixed categories; selected candidate has28local declarations,
    including Context. Neither count is the original full imported/inferred ontology population.
  evidence:
  - E07
  - E15
  basis: REVIEWER_INTERPRETATION
- id: F010
  label: Multiple inheritance scope
  statement: BiologicalSensor has a PhysicalAgent parent in Figure2 but not in the selected root. Imported
    inference might add consequences, but none has been run or presumed.
  evidence:
  - E07
  - E15
  basis: REVIEWER_INTERPRETATION
- id: F011
  label: Frame role distinctions
  statement: Arriving Goal is a destination role, score Themegoal a filler and Feeling experiencer a participant;
    these are not interchangeable with BDI goals, agents or classes.
  evidence:
  - E05
  - E08
  - E09
  basis: REVIEWER_INTERPRETATION
- id: F012
  label: Figure spelling/type gaps
  statement: Figure1 Stimuli and Figure5 EmotionalState/hasOuput differ from other names. Plausible aliases
    or typography repairs are not printed formal equivalences.
  evidence:
  - E06
  - E09
  - E15
  basis: REVIEWER_INTERPRETATION
- id: F013
  label: Expression/content/referent
  statement: Description, sentence/media, frame and represented situation must be distinguished; the image-as-situation
    shorthand is not a sufficient identity theory.
  evidence:
  - E05
  - E08
  basis: REVIEWER_INTERPRETATION
- id: F014
  label: OWL quantifier distinction
  statement: Paper trigger prose is unquantified; candidate uses allValuesFrom, so only restrictions do not
    generate inputs, outputs, memories or emotions.
  evidence:
  - E04
  - E15
  basis: REVIEWER_INTERPRETATION
- id: F015
  label: Global imported-name side effects
  statement: The selected root constrains imported DULDescription and DULSituation names without local owl:Class
    declarations. A local-only class census alone would omit these outgoing assertions.
  evidence:
  - E15
  basis: REVIEWER_INTERPRETATION
- id: F016
  label: Missing source definitions
  statement: 'All28candidate local classes/constraints are accounted for: one source comment candidate,27missing.
    Reviewer paper/hierarchy explanations do not fill the author-comment field.'
  evidence:
  - E15
  basis: REVIEWER_INTERPRETATION
- id: F017
  label: Prototype evidence limit
  statement: Screenshots and worked examples support representation/interaction feasibility; no reported controlled
    user study, confusion matrix, benchmark or operational ontology-consistency log is supplied.
  evidence:
  - E08
  - E09
  - E10
  - E11
  - E12
  - E14
  basis: REVIEWER_INTERPRETATION
- id: F018
  label: Manual BCI procedure
  statement: SDK outputs were manually transcribed into annotations. The automatic six-Ekman pipeline remains
    ongoing/future rather than a demonstrated result.
  evidence:
  - E10
  - E11
  - E12
  basis: REVIEWER_INTERPRETATION
- id: F019
  label: Four metric families
  statement: Excitement,Frustration,Meditation,Engagement/Boredom are proprietary metric names with acknowledged
    ambiguity. Five plotted traces include two excitement timescales, not five discrete emotions.
  evidence:
  - E10
  - E11
  basis: REVIEWER_INTERPRETATION
- id: F020
  label: No borrowed participant count
  statement: Neither one person in a photograph nor the predecessor's14PrEmo students establishes this2015
    study sample; participants,training size,calibration and accuracy are unreported here.
