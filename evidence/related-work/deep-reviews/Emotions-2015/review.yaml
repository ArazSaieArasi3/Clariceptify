commitments:
- id: K001
  label: Restricted affective scope
  statement: The paper chooses full-blown emergent emotion instead of claiming coverage of the complete affective-state
    taxonomy.
  evidence:
  - E02
  basis: REVIEWER_INTERPRETATION
- id: K002
  label: Theory-flexibility objective
  statement: Categorical, dimensional and appraisal theories motivate agnosticism; the text supplies no universal
    compatibility proof or complete instantiated mapping for all three.
  evidence:
  - E02
  - E03
  - E04
  basis: REVIEWER_INTERPRETATION
- id: K003
  label: Class/property construction
  statement: Figure1 ovals become OWL classes and relation arrows become object properties; additional restrictions
    enrich the model.
  evidence:
  - E04
  - E06
  basis: REVIEWER_INTERPRETATION
- id: K004
  label: Trigger restriction in prose
  statement: The Description-to-EmergentEmotion example states a target type without printing a quantifier;
    do not silently make it an existential causal rule.
  evidence:
  - E04
  basis: REVIEWER_INTERPRETATION
- id: K005
  label: Upper-ontology grounding
  statement: DOLCE family and Description/Situation reuse are explicit; exact legacy edition and historical
    import identity require separate evidence.
  evidence:
  - E05
  basis: REVIEWER_INTERPRETATION
- id: K006
  label: Frame specialization
  statement: Figure2 shows ofntb:Frame as a Description subtype; formal correspondence with the selected ofntb
    import is not proved by the diagram alone.
  evidence:
  - E05
  - E07
  basis: REVIEWER_INTERPRETATION
- id: K007
  label: Literal context direction
  statement: Figure2 DULSituation has outgoing subclass arrows to SocialContext/EnvironmentalContext; Interface
    points to PersonalContext. Preserve the source rather than reverse the arrows.
  evidence:
  - E07
  basis: REVIEWER_INTERPRETATION
- id: K008
  label: Multiple inheritance
  statement: Sensor, biological/artificial sensor and expression channels have multiple parents; imported disjointness/compatibility
    must be assessed on an exact module version.
  evidence:
  - E07
  - E15
  basis: REVIEWER_INTERPRETATION
- id: K009
  label: Input-output loop
  statement: Sensing/perception/expression relations organize a conceptual loop; no explicit timing, automatic
    state estimation or causal fusion procedure is printed.
  evidence:
  - E06
  basis: REVIEWER_INTERPRETATION
- id: K010
  label: Frame role identity
  statement: Arriving Goal is a destination frame role; goal in the Torres sentence is a scored-object filler,
    not a BDI goal or adopted plan.
  evidence:
  - E05
  - E08
  basis: REVIEWER_INTERPRETATION
- id: K011
  label: User-entered emotional association
  statement: EmoCS stores structured frame/emotion input and multimedia references; this does not establish
    truth, unique interpretation, consensus or individual calibration.
  evidence:
  - E08
  basis: REVIEWER_INTERPRETATION
- id: K012
  label: Representation boundary
  statement: Figure4 sentence/description and Figure5 instance labels are illustrative; no complete URI-bound
    instance graph or alias equivalence is printed.
  evidence:
  - E08
  - E09
  basis: REVIEWER_INTERPRETATION
- id: K013
  label: Emotion recognition exclusion
  statement: The text explicitly says the ontology models associations and does not recognize emotional responses;
    do not promote storage/UI modeling into a detector.
  evidence:
  - E09
  basis: REVIEWER_INTERPRETATION
