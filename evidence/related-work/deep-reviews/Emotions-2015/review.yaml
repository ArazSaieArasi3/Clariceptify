dimensions:
  D1_identity_coverage:
    label: Identity
    statement: Exact8-page four-author2015journal610-617, DOI10.1016/j.chb.2014.11.100; all units/figures/notes/references
      inspected. Independent from2014 and later cognition source.
    evidence:
    - E01
    - E14
    - E17
    basis: REVIEWER_INTERPRETATION
  D2_problem_contribution:
    label: Problem/contribution
    statement: Context-sensitive flexible representation and structured collaborative emotion input; ontology
      models rather than detects emotion. BCI recognition is ongoing/future.
    evidence:
    - E02
    - E08
    - E09
    - E10
    - E12
    basis: REVIEWER_INTERPRETATION
  D3_method:
    label: Method
    statement: Named García2006 classical methodology, conceptual model to OWLclasses/properties/restrictions,
      DOLCE/FrameNet reuse and EmoCS demonstration; the thesis is cited, not wholly executed/reviewed here.
    evidence:
    - E04
    - E05
    - E08
    basis: REVIEWER_INTERPRETATION
  D4_requirements:
    label: Requirements
    statement: Flexibility across people/cultures/theories,context,multimodal input and reuse motivate the
      model. No numbered CQ suite or original controlled validation protocol is supplied.
    evidence:
    - E02
    - E03
    - E08
    - E12
    basis: REVIEWER_INTERPRETATION
  D5_concepts:
    label: Concepts
    statement: All39 taxonomy labels,14background affect labels and source-bearing process/context/role/measurement
      distinctions cataloged. Paper terms and28candidate root classes remain separate.
    evidence:
    - E02
    - E05
    - E07
    - E10
    - E15
    basis: REVIEWER_INTERPRETATION
  D6_relations_formalization:
    label: Relations/formalization
    statement: All figure relation labels/role bindings and prose restrictions indexed. No numbered axioms.
      Selected root only/exactly restrictions and referenced imported-name constraints are separate source
      evidence, not a silently completed paper theory.
    evidence:
    - E04
    - E06
    - E07
    - E08
    - E09
    - E15
    basis: REVIEWER_INTERPRETATION
  D7_grounding:
    label: Grounding
    statement: DOLCE family and FrameNet contextualization are explicit; exact edition unknown. Agent/role,expression/description/situation
      and observed/input/state levels require care; broad internal cognition is outside current paper scope.
    evidence:
    - E02
    - E05
    - E08
    - E09
    - E15
    basis: REVIEWER_INTERPRETATION
  D8_artifact_correspondence:
    label: Artifact
    statement: Selected author-linked Maycandidate28classes/6object/3data properties, one comment27missing,
      complete local constraints and raw annotation reconciliation. Three legacy imports unacquired; original-release
      equivalence and later-cognition parity not assumed.
    evidence:
    - E15
    - E16
    basis: REVIEWER_INTERPRETATION
  D9_evaluation:
    label: Evaluation
    statement: EmoCS screenshots and SDKmanual annotation support author-reported feasibility; no quantified
      participant/recognition/causal result. Fourmetric families and future six targets are distinct; no2014PrEmo
      results imported.
    evidence:
    - E08
    - E09
    - E10
    - E11
    - E12
    - E14
    basis: REVIEWER_INTERPRETATION
  D10_critical_synthesis:
    label: Critical synthesis
    statement: Contextual role-based input is a useful comparison candidate; formal range/witness,definition/import,measurement/conflict
      and version limits remain239/253/126. Next84limited summary, no model/manuscript/release adoption.
    evidence:
    - E05
    - E09
    - E10
    - E15
    - E16
    basis: REVIEWER_INTERPRETATION
