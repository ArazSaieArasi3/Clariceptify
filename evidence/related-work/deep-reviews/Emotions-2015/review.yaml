evidence:
- id: E01
  pages:
  - 1
  locator: PDF1 / printed610, title, authors, journal block, DOI, online date and license
  summary: 'Four authors: Rosa Gil, Jordi Virgili-Goma, Roberto Garcia, Cindy Mason; CHB51:610-617,2015, online6March2015;
    article CC BY4.0, not a license grant for every linked OWL file.'
- id: E02
  pages:
  - 1
  - 2
  locator: PDF1-2 / printed610-611, section1 and note1
  summary: Flexible/contextual emotion representation, emotional affordance and cultural/individual variation;14
    broad affective labels, focus on full-blown emergent emotion and detection/expression interfaces rather
    than human internal processing.
- id: E03
  pages:
  - 2
  - 3
  locator: PDF2-3 / printed611-612, section2 opening and2.1
  summary: Categorical/dimensional/appraisal theories, subjective/behavioral/physiological channels, socialized
    expression masking, context and modality; related lexical and multimodal ontologies are background rather
    than imported classes.
- id: E04
  pages:
  - 3
  locator: PDF3 / printed612, section3 opening and note2
  summary: Named Garcia2006 classical methodology; conceptual-model ovals become OWL classes, edges properties
    and range-like restrictions; prose triggers example has no explicit DL quantifier.
- id: E05
  pages:
  - 3
  - 4
  locator: PDF3-4 / printed612-613, section3 foundation/model details and note3
  summary: DOLCE Description/Situation, generic Event/Process/Action, physical/social categories and contextual
    types; FrameNet Frame specializes Description. Arriving ThemeJohn/Goalroom illustrates frame roles, not
    adopted planning goals.
- id: E06
  pages:
  - 4
  locator: PDF4 / printed613, Figure1
  summary: Nine ovals plus Interface boundary; core sensing/perception/memory/description/emotion/expression
    loop, seven property labels. Stimuli plural is a drawing label; temporal/fusion/learning constraints are
    not printed.
- id: E07
  pages:
  - 5
  locator: PDF5 / printed614, Figure2
  summary: All39 taxonomy labels and literal arrowheads inspected:27unprefixed,11DUL,1ofntb. DULSituation points
    to SocialContext/EnvironmentalContext; Interface points to PersonalContext. No silent hierarchy repair.
- id: E08
  pages:
  - 4
  - 5
  locator: PDF4-5 / printed613-614, section4 opening, Figures3-4 and notes4-5
  summary: EmoCS guided FrameNet autocomplete, structured manual emotional sliders, multimedia situation descriptions
    and RDF storage; Torres example binds Recipient/Result/Theme/Time. Browser/site statements are historical.
- id: E09
  pages:
  - 5
  - 6
  locator: PDF5-6 / printed614-615, section4 continuation and Figure5
  summary: Ontology models associations and explicitly does not recognize emotion. Happy media in response
    to sadness is illustrative; bootstrapping is acknowledged. Figure5 uses EmotionalState and literal hasOuput
    spelling, not an accepted formal alias.
- id: E10
  pages:
  - 6
  locator: PDF6 / printed615, section4.1 and notes6-10
  summary: Historical EEG/BCI device and suites; annotations manually produced from SDK screen. Four metric
    families do not match an established categorization; fear/surprise ambiguity. Six-Ekman recognition is
    work in progress.
- id: E11
  pages:
  - 7
  locator: PDF7 / printed616, Figures6-7
  summary: Headset photographs and SDK2.0.0.20 screenshot. Five traces include instantaneous/long-term excitement,
    not five independent categorical emotions or a participant/sample-size report.
- id: E12
  pages:
  - 6
  - 7
  - 8
  locator: PDF6-8 / printed615-617, section5 and acknowledgements
  summary: Scope/standards/application claims; extending affective states, automatic EEG annotations, training
    data/model processing, skin-conductance complement and broader social/user models remain future or ongoing,
    without reported accuracy or causal efficacy.
- id: E13
  pages:
  - 8
  locator: PDF8 / printed617, references38 entries
  summary: All38 bibliography entries inspected; methodological thesis and background references do not constitute
    a completed method, formal import edition or independently replicated emotion benchmark.
- id: E14
  pages:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  locator: Complete page/visual census, all seven figures and ten notes
  summary: All8 pages and renders inspected, with individual Figures2/5/6/7 zooms. Seven figures, ten footnotes,38references;
    no numbered table, appendix or numbered formula. No2014 PrEmo participant/results table is present.
