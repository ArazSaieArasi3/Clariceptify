evidence:
- id: E01
  pages:
  - 1
  locator: Printed1813/PDF1 title, four authors, dates, abstract, keywords and copyright
  summary: J.UCS 20(13), 1813-1828; submitted 15 January 2014, accepted 6 September 2014, appeared 28 November 2014.
    Article scope is a generic emotion/detection/expression/context model, not the later cognition extension.
- id: E02
  pages:
  - 1
  - 2
  - 3
  locator: Complete sec.1 Introduction, taxonomy/scope, theories and application motivation
  summary: Fourteen affective-state categories cited; focus restricted to full-blown Emergent Emotion and detection/expression
    rather than internal human processing. Context, personalization, theory flexibility, DOLCE/FrameNet and EPF
    introduced.
- id: E03
  pages:
  - 4
  - 5
  locator: Complete sec.2 and 2.1 Related Work
  summary: Categorical/dimensional/appraisal theories; subjective, behavioral and psychophysiological channels;
    culture/socialization/context and multimodality; WordNetAffect, speech and contextual ontology examples. These
    are related work, not executed comparisons.
- id: E04
  pages:
  - 5
  - 6
  - 7
  locator: 'Sec.3 Contribution: methodology, core definitions and Figure 1'
  summary: Classical engineering methodology cited, OWL classes for diagram ovals; external world, interface and
    internal world with nine core concepts. Figure 1 has seven distinct property labels and a feedback model.
- id: E05
  pages:
  - 7
  locator: Sec.3 property/restriction paragraph, DOLCE grounding and footnote 1
  summary: hasInput/hasOutput/hasPart/describes/triggers/stores/uses; Description triggers targets EmergentEmotion,
    without a printed DL quantifier. Author ontology URL provided, original bytes not thereby established.
- id: E06
  pages:
  - 8
  locator: Complete Figure 2 and surrounding foundational/context discussion
  summary: Thirty-nine named taxonomy nodes:27 non-prefixed, 11 dul-prefixed and ofntb:Frame. Event/process/action/object
    categories, expression/sensor specializations and contexts. Literal Situation-to-context and Interface-to-PersonalContext
    arrows are retained, not repaired.
- id: E07
  pages:
  - 8
  - 9
  locator: FrameNet discussion and John-enters-room example; footnote 2
  summary: Frame is modeled under Description; enter.v/Arriving has Theme=John and Goal=room. Lexical unit, frame,
    role and filler remain different representation levels.
- id: E08
  pages:
  - 9
  - 10
  locator: Sec.4 EPF architecture, interfaces and learning behavior; Figure 3; footnote 3
  summary: Phidgets prototype, Picture/Feeling areas, buttons, heart/history/replay/delete controls, camera/microphone
    possibilities and picture/music outputs. Eight printed Plutchik labels include submission. Random favorites
    seed user associations; sadness-to-happy-content response described.
- id: E09
  pages:
  - 11
  locator: Complete Figure 4, caption and explicit modeling-versus-recognition limitation
  summary: Sad button input and Emotion/Feeling/Cause_to_make_noise frame example; diagram has EmotionalState sadness
    labels. Paper explicitly says ontology does not recognize emotions; initial knowledge needed for useful behavior.
- id: E10
  pages:
  - 11
  locator: Sec.4.1 study purpose and 4.1.1 Participants
  summary: 'Experience of EPF stimuli evaluated in 14 computer-science students at University of Cauca, Colombia:
    seven women/seven men. No classifier test set or ontology-expert sample claimed.'
- id: E11
  pages:
  - 12
  locator: Complete 4.1.2 Materials/instruments, 4.1.3 Procedure and Figure 5
  summary: 'PrEmo uses 14 product-experience emotions: seven pleasant/seven unpleasant. Free use for 30 minutes
    followed by one emotion selection per participant; not repeated intensity scores or a multi-label recognition
    benchmark.'
- id: E12
  pages:
  - 12
  - 13
  locator: Complete 4.1.4 Results and Table 1
  summary: 'All 14 counts inspected: admiration 6, satisfaction 4, fascination 4, all 11 remaining categories 0.
    Total 14 agrees with participants; positive selections describe reported experience, not verified emotion detection
    or causal efficacy.'
- id: E13
  pages:
  - 13
  - 14
  locator: Complete sec.5 Conclusions/future work and Acknowledgements
  summary: Broader theory/technology utility claimed; conclusion describes explicit emotion buttons and screen outputs.
    Extension beyond EmergentEmotion, disability-aware models and social networks remain future work.
- id: E14
  pages:
  - 14
  - 15
  - 16
  locator: All 36 bibliography entries and three paper footnotes
  summary: "All entries read. Method citation Garc\xEDa 2006 differs from bibliography Garc\xEDa 2010; intro Neyem\
    \ 2007 versus Collazos 2007 and Douglas-Cowie 2005 versus other keys remain editorial uncertainties. Phidgets\
    \ footnote URL is printed phidgtes.com; no silent correction or execution inferred."
