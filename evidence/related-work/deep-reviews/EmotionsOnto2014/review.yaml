commitments:
- id: K01
  label: Restricted affective scope
  statement: The full-blown emergent-emotion case is selected from a broader taxonomy; do not call the core a complete
    model of all affect or internal emotional processing.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K02
  label: Theory flexibility versus demonstration
  statement: Authors aim at categorical/dimensional/appraisal neutrality. Demonstrated categorical application does
    not verify all alternative theory mappings.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E03
  - E08
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K03
  label: Nine model ovals as classes
  statement: Source states all Figure 1 ovals become OWL classes; diagram arrows/prose do not specify a complete
    profile, full axiom set or machine population.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K04
  label: Input/output/reference distinctions
  statement: External stimulus, internal sensation, process and contextual description have separate roles. hasInput/hasOutput
    orientation must not be inverted into an ontology-generated classifier.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E05
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K05
  label: Description trigger restriction
  statement: Targets of Description triggers are EmergentEmotion in the example restriction. Exact DL quantification/existence/causal
    strength is not printed; no some/only formula is invented.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K06
  label: Foundation and frame reuse
  statement: DOLCE Description/Situation contextualize the model; ofntb:Frame is drawn under dul:Description. Exact
    upper-ontology edition/import closure remains an artifact question.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E06
  - E07
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K07
  label: Literal context arrows
  statement: Figure 2 shows dul:Situation pointing to SocialContext/EnvironmentalContext and Interface pointing
    to PersonalContext. Retain drawing/prose ambiguity rather than silently asserting the reverse hierarchy.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K08
  label: Sensor and expression specializations
  statement: Taxonomy includes physical and interface multiple inheritance and process/event expression categories;
    joint satisfiability and type commitments require exact source definitions.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K09
  label: Frame role versus filler
  statement: Arriving Theme=John and Goal=room distinguish semantic role from its instance; Figure 4 similarly separates
    person, emotion-state and action/song fields.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E09
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K10
  label: Recognition excluded from ontology role
  statement: Authors explicitly say ontology models emotion associations but does not recognize emotional responses;
    sensor recognition is an external capability.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K11
  label: Association bootstrapping
  statement: Random favorites and explicit user responses seed situation/emotion associations; no formal learning
    objective, confidence threshold or executable rule set supplied.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E09
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K12
  label: Intervention is not observed causal success
  statement: Sadness detection followed by formerly happy-associated media is intended behavior; source drawing
    labels sadness and study does not measure a controlled sadness-to-happiness effect.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E09
  - E10
  - E12
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K13
  label: PrEmo outcome boundary
  statement: Fourteen students use EPF freely 30 minutes then choose one experience category; result is count 6
    admiration, 4 satisfaction, 4 fascination, not emotion-recognition accuracy.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
  - E11
  - E12
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
- id: K14
  label: Extension/version boundary
  statement: Later Emotions & Cognition files and missing 2015 paper remain separate. Identical two-path retained
    extension bytes are not an original 2014 release or independent validation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - S01
  - A01
  - A02
  commitment_kind: PAPER_PROSE_DIAGRAM_NOT_EXECUTABLE_AXIOM
  source_proposal_basis: AUTHOR_REPORTED
