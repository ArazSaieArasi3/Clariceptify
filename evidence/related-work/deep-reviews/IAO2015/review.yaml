commitments:
- id: K01
  label: Existing ICE definition
  statement: Entity generically dependent on some MaterialEntity and standing in aboutness to some Entity; this is
    the definition criticized, not the final broadening.
  basis: AUTHOR_REPORTED
  evidence:
  - E01
- id: K02
  label: generic dependence
  statement: a and b exist, b instantiates some universal B, and necessarily if a exists then some B exists. Specific
    bearer b is not required across all realizations.
  basis: AUTHOR_REPORTED
  evidence:
  - E01
- id: K03
  label: specific dependence
  statement: The dependent cannot exist without its particular bearer; contrasted with migration/copying.
  basis: AUTHOR_REPORTED
  evidence:
  - E01
- id: K04
  label: IQE definition
  statement: IQE is a Quality concretizing some ICE.
  basis: AUTHOR_REPORTED
  evidence:
  - E02
- id: K05
  label: Artifact definition
  statement: MaterialEntity created, modified or selected by some agent to realize Function or Role.
  basis: AUTHOR_REPORTED
  evidence:
  - E02
- id: K06
  label: InformationArtifact definition
  statement: Artifact with the function of bearing an IQE.
  basis: AUTHOR_REPORTED
  evidence:
  - E02
- id: K07
  label: Proposed target broadening
  statement: Replace aboutness to some Entity by aboutness to some POR, allowing universals, relations, other ICEs
    and configurations. Not all are BFO entities as understood in this paper.
  basis: AUTHOR_REPORTED
  evidence:
  - E03
- id: K08
  label: Representation definition
  statement: Quality that is_about or is intended to be about a POR; successful aboutness and mere intention are disjuncts.
  basis: AUTHOR_REPORTED
  evidence:
  - E05
- id: K09
  label: MentalQuality definition
  statement: Quality specifically dependent on an AnatomicalStructure in an Organism cognitive system.
  basis: AUTHOR_REPORTED
  evidence:
  - E05
- id: K10
  label: CognitiveRepresentation definition
  statement: Representation and MentalQuality; no consciousness or image-like form is entailed by the definition.
  basis: AUTHOR_REPORTED
  evidence:
  - E05
- id: K11
  label: RU and five unit categories
  statement: RU denotes minimal subrepresentation; RRU succeeds, NRU fails, UNRU/RNRU distinguish recognition, RUC
    is not intended to refer independently. The list mixes granularity/status and requires an implementation decision.
  basis: AUTHOR_REPORTED
  evidence:
  - E05
  - E06
- id: K12
  label: is_about primitive
  statement: Domain representations; range POR; if x is_about y then y exists. Intended aboutness does not carry this
    existential success condition.
  basis: AUTHOR_REPORTED
  evidence:
  - E07
- id: K13
  label: concretizes at t primitive
  statement: 'x is Quality, y is GDC, and for some material bearer z at t: x specifically depends on z and y generically
    depends on z. Migration to another bearer creates a copy of x, not numerical identity of quality across bearers.'
  basis: AUTHOR_REPORTED
  evidence:
  - E07
- id: K14
  label: direct cognitive representation primitive
  statement: x is CognitiveRepresentation in subject s, x is_about y and x arises in s through an appropriate causal
    process initiated by y. Appropriateness is not operationally defined.
  basis: AUTHOR_REPORTED
  evidence:
  - E07
- id: K15
  label: is_a_representation_of definition
  statement: x is Representation and x is_about y, where y is POR. Unlike the Representation class alone, this relation
    entails successful reference.
  basis: AUTHOR_REPORTED
  evidence:
  - E08
- id: K16
  label: is_conformant_to definition
  statement: x is IQE, y is CognitiveRepresentation and some GDC g is concretized by both. The relation connects qualities
    through shared content; it does not itself assert truth or the same bearer.
  basis: AUTHOR_REPORTED
  evidence:
  - E08
- id: K17
  label: Continuation-to-process aboutness hypothesis
  statement: Cognitive occurrent representations inherit intended aboutness from underlying continuant representation;
    explicitly a hypothesis.
  basis: AUTHOR_REPORTED
  evidence:
  - E05
- id: K18
  label: Temporal target non-contemporaneity
  statement: A POR need not exist when its representation exists; past disorders remain direct targets rather than
    memories being substituted as targets.
  basis: AUTHOR_REPORTED
  evidence:
  - E09
- id: K19
  label: Component/composite reference
  statement: Components may refer while an entire false or fictional sentence fails to target an obtaining configuration;
    preserve levels.
  basis: AUTHOR_REPORTED
  evidence:
  - E04
- id: K20
  label: Context and truth history
  statement: The original context-indexed ICE is not claimed to change truth simply because the world changes; a new
    use may involve a different historical/indexical content. Identity conditions are not fully axiomatized.
  basis: AUTHOR_REPORTED
  evidence:
  - E04
- id: K21
  label: Time-dependent reference recognition
  statement: Unit classification can change as a target belief is corrected; the same string is insufficient to identify
    the semantic status across uses/times.
  basis: AUTHOR_REPORTED
  evidence:
  - E04
  - E06
scenarios:
- id: S01
  label: Positive observed measurement
  statement: A nurse observes a pulse, forms a direct cognitive representation and enters a value in a record. The
    record quality and mental quality can concretize shareable content grounded in that pulse. Causal provenance is
    doing more work than a bare string label.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E07
  - E08
- id: S02
  label: False composite
  statement: The paper presidential counterexample retains reference of some components while denying a corresponding
    configuration for the whole. An implementation that assigns the whole sentence an obtaining target merely because
    two names refer would overstate its truth.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
- id: S03
  label: Failed reference and correction
  statement: Vulcan as believed in 1860 and a later acknowledged error illustrate UNRU versus RNRU. A static same-label
    lookup cannot encode belief-history and corrected reference status by itself.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E06
- id: S04
  label: Adverse shared-content shortcut
  statement: Two qualities sharing a GDC satisfy the printed conformity definition, but that definition alone does
    not establish truthful content or reliable observation. Add a separate reference/grounding argument before making
    those claims.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
- id: S05
  label: Past and unknown targets
  statement: A past disorder can be represented now, and a child/cat can perceive an object without knowing its universal.
    Do not require contemporaneous existence or correct type knowledge for every successful representation.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
evaluation:
  Verification:
    statement: Definitions/elucidations and examples support conceptual inspection; there is no machine-checked consistency,
      entailment or completed CQ execution in this paper.
