dimensions:
  D1_identity_coverage:
    statement: The selected work is the 2015 five-page Smith/Ceusters proposal, reviewed in full. It critiques an
      existing ICE definition and proposes broader aboutness/representation foundations; those proposals are not assumed
      to be accepted by current IAO releases.
    basis: AUTHOR_REPORTED
    evidence:
    - E01
    - E10
  D2_problem_contribution:
    statement: Existing IAO treatment of ICE, cognitive representation and aboutness is insufficient for information
      creation, reference failure, misinformation, fiction and time/context. The proposed contribution links content
      and material/mental concretizations, broadens targets to portions of reality and distinguishes successful reference
      from intended reference.
    basis: AUTHOR_REPORTED
    evidence:
    - E01
    - E03
    - E04
    - E05
    - E07
    - E08
  D3_method:
    statement: 'The method is foundational conceptual analysis: critique a definition, distinguish dependency/representation
      levels, analyze counterexamples and propose English logical definitions and elucidations. Nurse/pulse, false
      presidential claims, fiction and Vulcan are argumentative cases; there is no implemented study protocol or formal-model
      experiment in this text.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E03
    - E04
    - E06
    - E07
    - E08
  D4_requirements:
    statement: The paper targets domain-neutral information modeling, especially scientific/biomedical records. A
      satisfactory account should handle shareable content across bearers, cognitive grounding, past or misidentified
      targets, false composites and corrected reference beliefs. These are reconstructed requirements from the paper
      arguments, not author-declared competency questions or a passing CQ suite.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E03
    - E04
    - E06
    - E09
  D5_concepts:
    statement: ICE is generically dependent content, IQE its specifically dependent quality concretization and an
      information artifact its material bearer. Cognitive representation is a mental quality; Representation allows
      intended reference to fail. Referring/non-referring units and recognition status distinguish what exists, what
      is intended and what is believed. ICE is explicitly historical rather than an abstract proposition.
    basis: AUTHOR_REPORTED
    evidence:
    - E01
    - E02
    - E03
    - E05
    - E06
  D6_relations_formalization:
    statement: Definitions and primitive elucidations are inventoried without turning them into OWL axioms. Successful
      is_about entails target existence; intended-to-be-about does not. Conformity shares a GDC and alone does not
      encode truth, reliable observation or identity of targets. Time is explicit for concretization/dependence and
      context-dependent reference histories require more than a static class label.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E04
    - E07
    - E08
  D7_grounding:
    statement: BFO dependence and material/quality/GDC distinctions ground the account; MFO adds mental qualities
      and cognitive representation. Intentional acts ground artifact aboutness. A target need not exist contemporaneously
      with its representation, and veridical representation need not identify its target universal correctly. These
      realist commitments differ from treating all content as private DOLCE mental objects or as atemporal propositions.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E02
    - E03
    - E05
    - E09
  D8_artifact_correspondence:
    statement: 'The retained IAO repository contains current release/development roots and many historical releases.
      The reviewed 2015 proposal does not pin that repository commit or show adoption of every proposal. Repository
      README distinguishes iao.owl and iao-edit.owl; the retained release root identifies 2026-03-30. Detailed selection/import/count/axiom
      work remains #240, with no summation across release directories.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E07
    - E10
    - R01
    - R02
  D9_evaluation:
    statement: Arguments are illustrated by philosophical/clinical examples; no recruited expert sample, quantitative
      experiment, full CQ suite or executed consistency proof is reported. Neuroscientific grounding is explicitly
      uncertain and several language/mental questions are future work. Reviewer critical analysis is separate from
      author evidence and independent scientific acceptance.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E04
    - E06
    - E09
    - E10
  D10_critical_synthesis:
    statement: Useful prior distinctions cover content versus carrier/quality, intentional versus successful reference,
      temporal provenance and representational error. Weak points for computational reuse are the lack of an operational
      account of intention/recognition, an executable configuration semantics and a complete identity rule across
      contexts. Their resolution is not supplied by generic aboutness or a current IAO class count.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E04
    - E06
    - E07
    - E08
    - E09
