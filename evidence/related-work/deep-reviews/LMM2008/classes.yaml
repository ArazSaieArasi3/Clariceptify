  namespace: http://www.ontologydesignpatterns.org/ont/lmm/LMM_L1.owl#
  version:
  - "1.8\n1.2 \n- contains fine-tuning of cross-context relations. Now, the formalization pathway goes from expression\
    \ to meaning to reference to formal entity to formal expression.\n1.3 \n- has all elements with English labels.\
    \ Moreover, I added the relatedMeaning property, which allows to query across all object properties that have\
    \ a Meaning in both domain and range.\n1.4 \n- has a new relation: hasInterpretant, based on Peirce's semiotics,\
    \ which is applied between any two Expression(s), where the second provides an interpretive context for the\
    \ first.\n1.5 \n- fixes a bug in the domain and range of isContextOf, now both generalized to dul:Entity, and\
    \ consequently, Context is equivalently defined as anything that isContextOf some dul:Entity; some comments\
    \ have also been edited.\n1.6 \n- added equivalentClass axiom between lmm:Meaning and dul:SocialObject (simplifies\
    \ applications).\n1.7 \n- aligned all locally defined object properties to dul:associatedWith.\n1.8\n- simplified\
    \ several restrictions in the semiotic pattern core, for improving reasoning performance."
  census_path: evidence/related-work/deep-reviews/LMM2008/LMM_L1-census.json
