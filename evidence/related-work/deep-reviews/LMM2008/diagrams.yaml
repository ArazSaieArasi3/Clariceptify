- number: 1
  pdf_page: 2
  printed_page: 2414
  label: The structure of Semiotic Triangle
  inspection: VISUALLY_REVIEWED
  nodes:
  - label: THOUGHT OR REFERENCE
    slots: []
  - label: SYMBOL
    slots: []
  - label: REFERENT
    slots: []
  interpretation_limit: 'Three semiotic positions and three labeled sides: symbolizes (a causal relation), refers
    to (other causal relations), stands for (an imputed relation, dotted). The diagram is historical/conceptual, not
    a three-rule OWL program. The top label is not equated automatically with the LMM Reference class.'
