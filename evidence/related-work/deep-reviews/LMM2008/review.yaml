findings:
- id: F01
  label: Direct prior overlap
  statement: LMM already integrates expression/meaning/reference, context and social conceptualization. A future novelty
    claim must be scenario- and evidence-specific rather than state that prior ontologies only describe static concepts.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E04
  - E07
  - E08
  - E10
  - E11
- id: F02
  label: Three core classes versus current distribution
  statement: Sec.3 three-class core is a conceptual presentation. Current L1 declares8 local classes and L2 declares21;
    they are not a contradictory count of one frozen population. Added context/construction categories belong to the
    retained version.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - A01
  - A02
  - R01
  - R02
- id: F03
  label: Interpretation names and cardinality differ
  statement: Fig.2 interprets/isInterpretedAs changes to hasInterpretation/isInterpretationOf in later diagrams. Fig.6
    expresses minimum 1 differs from current Expression union. These are correspondence questions, not evidence that
    either complete ontology is inconsistent.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
  - E09
  - E13
  - A01
- id: F04
  label: Meaning / reference overlap needs level discipline
  statement: The paper permits metalinguistic referents and constructed situations to serve interpretive roles. Do
    not invent pairwise disjointness or translate concept-instance specialization directly to subclassing of domain
    individuals.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E07
  - E08
  - E12
  - E14
- id: F05
  label: Context story exceeds operational binding
  statement: Speech act, agent, frame/topic and intention appear in the explanation. Neither those prose links nor
    generic current hasContext provide a demonstrated interpretation-specific disambiguation or agreement algorithm.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E10
  - A01
- id: F06
  label: Diagram mappings are not equivalence proofs
  statement: Fig.5 places several resource categories under Concept while the text also distinguishes SKOS topics
    from concepts. Without the exact alignment axioms and domain/range consequences, semantic equivalence and all-resource
    compatibility remain unestablished.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E11
  - E12
- id: F07
  label: Evaluation claims exceed supplied measurements
  statement: No actual extraction, multilingual, reasoner or alignment-quality benchmark supports the broad ease/robustness
    claims in this paper. Schema-level coverage should not be reported as measured performance or task adequacy.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E11
  - E14
- id: F08
  label: Future integration stays future
  statement: Conclusion marks automatic DBpedia/YAGO connection as planned despite earlier general integration language.
    Record availability/schema intent separately from completed automatic population.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E11
  - E14
- id: F09
  label: Reference membership wording and OWL differ
  statement: Sec.3.1 says IndividualReference can have individual members while the example/figure assign collection
    membership to MultipleReference. Current IndividualReference also requires some collection membership. Preserve
    the source ambiguity and open-world interpretation rather than silently repair it.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - A02
- id: F10
  label: Information content versus realization
  statement: The paper explicitly separates information objects from concrete realizations. It does not provide a
    full identity criterion for expression tokens across time, carriers, languages and interpretations.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
  - E13
- id: F11
  label: Original alignment root not acquired
  statement: Four actual 2026-10-27 endpoint probes yield 403 responses or HTML after redirect; current L1/L2 availability
    does not recover the historical full alignment distribution. Bounded repository searches do not prove no repository
    exists.
  basis: EXECUTED
  evidence:
  - E02
  - A01
  - A02
  execution_ref: evaluation/related-work/lmm/deep-review-discovery.json
- id: F12
  label: Definition and annotation gaps remain explicit
  statement: All 29 current local classes are catalogued. Four have no definition comment. AssociativeContext starts
    its comment by calling itself a rule. EnumeratedExpression uses AnaphoricExpression in its comment although its
    asserted superclass is ContextualExpression; SimpleConceptExpression uses ClassReference as a comment denotation
    target whereas its asserted target is ConceptReference. The earlier catalogue note is clarified here; source aliases
    are not silently equated.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
  - A02
  - R02
- id: F13
  label: Current hierarchy differs from illustrative coverage
  statement: Retained L1 places Situation under Reference/Context; L2 places Concept and Description under Meaning.
    The paper statement that Situation can also function as Meaning does not itself assert that every current Situation
    is a Meaning. Current PhysicalArtifact is not globally made Reference by the L1 local declarations.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
  - E09
  - A01
  - A02
- id: F14
  label: Existential restrictions are not complete definitions
  statement: Current collection, naming and syntactic-function restrictions give some/min/max obligations. They do
    not alone establish full enumeration, common observer, tokenization, truth or algorithmic feature extraction.
    Empty MultipleReference and an ExtensionalReference requiring a witness are different cases.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E16
  - A01
  - A02
