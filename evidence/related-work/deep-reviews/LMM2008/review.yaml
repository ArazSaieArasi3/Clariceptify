scenarios:
- id: S01
  label: RQ1 resource interoperability
  statement: 'AUTHOR GOAL: Integrate heterogeneous lexical resources without erasing their distinct units. Candidate
    check: retain source identity when a synset and frame element both specialize the common concept layer. An alignment
    row is evidence of mapping intent, not measured correctness.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E11
  - E12
- id: S02
  label: RQ2 multilinguality
  statement: 'AUTHOR GOAL: Represent different-language expressions and their relations. Reviewer adverse case: shared
    denotation or spelling does not ensure identical senses, context or cross-language equivalence. No multilingual
    benchmark is reported.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E04
  - E10
  - E14
- id: S03
  label: RQ3 extraction compatibility
  statement: 'AUTHOR GOAL: Accommodate named-entity, relation and frame extraction outputs. Candidate check keeps
    extracted mention, selected sense, confidence and target distinct; the latter provenance/confidence additions
    are reviewer test candidates, not claimed paper features.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E07
- id: S04
  label: RQ4 OWL/reasoner compatibility
  statement: 'AUTHOR GOAL: Semantic-Web implementation compatibility. Adverse case: a readable diagram or parseable
    RDF is not proof of OWL-DL profile membership, consistency or desired entailments.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E06
  - E13
- id: S05
  label: RQ5 social semiotics
  statement: 'AUTHOR GOAL: Accommodate established semiotic accounts. Reviewer check asks which agent, shared description
    and communicative act support a chosen interpretation; generic pairwise edges alone leave those witnesses unspecified.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E03
  - E04
- id: S06
  label: RQ6 open-domain reference
  statement: 'AUTHOR GOAL: Include individuals/facts from collaborative knowledge resources. Distinguish reported
    schema mapping from the conclusion planned automatic DBpedia/YAGO connection.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E11
  - E14
- id: S07
  label: Positive individual / collective case
  statement: 'AUTHOR EXAMPLE: Employee membership connects a named individual to an employee collection and its covering
    concept. Reviewer check preserves individual-versus-collection-versus-concept levels. Not executed as a CQ.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
- id: S08
  label: Positive frame / occurrence case
  statement: 'AUTHOR EXAMPLE: A drinking frame describes possibilities; a particular drinking event instantiates a
    situation. Reviewer check rejects treating every frame description as an actual occurrence.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
- id: S09
  label: Metalinguistic reference
  statement: 'AUTHOR EXAMPLE: A word can itself be the referent of a statement about its letters. Reviewer adverse
    case: global disjointness of Expression and Reference would rule out this intended use, so do not invent that
    disjointness.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
- id: S10
  label: Polysemy and contextual resolution
  statement: 'AUTHOR ARGUMENT: Context narrows interpretation. Reviewer adverse case: two agents can interpret one
    expression differently in the same coarse topic; without interpretation-specific context links there is no established
    uniqueness/resolution guarantee.'
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E10
- id: S11
  label: Singular / plural naming
  statement: 'AUTHOR EXAMPLES: Proper nouns can denote people or a community. Reviewer adverse case: a collective
    reference cannot be collapsed into an individual just because both have names; contextually determined membership
    also needs time/observer scope.'
  basis: REVIEWER_INTERPRETATION
  evidence:
