dimensions:
  D1_identity_coverage:
    statement: The exact 2008 work is fully inspected with printed/PDF numbering and complete figure/footnote/bibliography
      coverage. Current L1/L2 files and the unavailable original alignment root are separate versioned evidence, not
      interchangeable editions.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E02
    - E15
    - R01
  D2_problem_contribution:
    statement: The gap is interoperability between heterogeneous lexical resources and ontology-based interpretation.
      The proposed mechanism separates expression, meaning and reference while reusing contextual descriptions, situations
      and lexical alignments. This directly overlaps conceptualization concerns; novelty cannot be claimed merely
      from those three distinctions.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E01
    - E03
    - E04
    - E08
    - E11
    - E14
  D3_method:
    statement: The engineering method reconstructs semiotic distinctions, reuses DOLCE/DnS and information-object
      patterns, modularizes core/linguistic/alignment layers and illustrates resource specialization. No explicit
      SABiO/DSR/ORSD workflow, systematic-review selection method, recruited expert protocol or reproducible comparative
      experiment is supplied. Their absence is scoped to this paper, not the authors entire work.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E03
    - E06
    - E11
    - E14
    - E15
  D4_requirements:
    statement: Six feature bullets serve as author-reported goals. Reviewer scenarios operationalize resource integration,
      multilingual/polysemic expressions, shared meaning, constructed context and explicit individual-versus-collection
      reference. They are reconstructed candidate CQs/adverse cases, not author-declared executable requirements or
      passing tests.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E04
    - E07
    - E08
    - E10
    - E16
  D5_concepts:
    statement: The three semiotic positions are extended with Description/Concept/Situation/Collection, information
      objects, linguistic forms and imported lexical categories. A concept individual related by specializes is not
      automatically an OWL class connected by rdfs:subClassOf. Topics collect conceptual content while concepts classify
      individuals; expression type, token and physical realization require separate identity decisions.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E06
    - E07
    - E08
    - E09
    - E10
    - E12
    - E14
  D6_relations_formalization:
    statement: The paper offers prose and six diagrams, not numbered equations or a complete axiom listing. The diagram
      ledger preserves every visible property slot/range/cardinality and legacy spelling. Displayed slots and arrows
      alone do not establish exact OWL restrictions, equivalence, global consistency or all claimed alignments. Current
      module constraints are analyzed separately and have not been reasoned over.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E05
    - E06
    - E07
    - E09
    - E12
    - E13
    - A01
    - A02
  D7_grounding:
    statement: The paper explicitly chooses DOLCE-Ultralite and DnS; speech acts, agents, shared social objects, conceptual
      descriptions and constructed situations provide cognitive/social grounding. Information content is distinguished
      from concrete realization; frame possibility from observed occurrence. The retained import chain is L2 1.2 ->
      L1 1.8 -> IOLite 1.8 -> DUL 4.2. That actual chain establishes neither the exact 2008 edition nor BFO/UFO grounding.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E04
    - E07
    - E08
    - E10
    - E11
    - A01
    - A02
    - A03
    - A04
    - R01
  D8_artifact_correspondence:
    statement: Standalone official formal files and complete local glossaries are retained. Bounded repository searches
      do not confirm an author-controlled historical development repository. Four fresh endpoint probes record403
      responses or HTML, so the cited alignment root is not acquired. Current named-class counts, changed property
      names, added context classes, annotation gaps and missing external alignment modules remain explicit version
      limits.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E06
    - E11
    - E12
    - E13
    - A01
    - A02
    - R01
    - R02
    - R03
  D9_evaluation:
    statement: Resource mappings and graphical examples support a descriptive demonstration. The text contains no
      identified reasoner/version/log, complete CQ suite, expert sample, alignment precision/recall, multilingual
      benchmark or measured disambiguation improvement. Reviewer reading, parsing and prior catalogue reconciliation
      are actual limited evidence; generic OWL-DL compatibility and planned integrations are not experimental success.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E11
    - E14
    - R01
    - R03
  D10_critical_synthesis:
    statement: Strong prior overlap includes mediated/direct reference, context-sensitive interpretation, conceptual
      individuals, lexical interoperability and social grounding. Reuse limits concern identity/context binding, type/instance
      discipline, diagram-to-current-version fidelity and unverified alignment coverage. Later opportunities are evidence-qualified
      research candidates pending cross-corpus synthesis and the owner decision.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E03
    - E04
    - E07
    - E08
    - E10
    - E11
    - E12
    - E13
    - E14
    - A01
    - A02
