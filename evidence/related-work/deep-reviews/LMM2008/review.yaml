commitments:
- id: K01
  label: Semiotic separation
  statement: Three interpretive positions are distinguished; the triangle does not require them globally disjoint
    or uniquely identified. Treat reification and metalinguistic use explicitly.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E03
  - E05
  - E06
- id: K02
  label: Expression / denotation / interpretation
  statement: Direct denotation and meaning-mediated interpretation are both allowed. A pairwise edge is not automatically
    a complete agent/context/time-specific interpretation event.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E06
  - E10
- id: K03
  label: Description defines Concept / Situation satisfies Description
  statement: Definition, classification, satisfaction and unification connect different levels. Reusing a Concept
    in another Description is not copying the same domain extension by default.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E09
- id: K04
  label: Concept classification versus object membership
  statement: The employee example distinguishes individual membership in a multiple reference and classification by
    a concept. A collection member is not its collection superclass.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E07
  - E08
- id: K05
  label: Frame / occurrence
  statement: A descriptive possibility differs from an observed event or satisfying Situation. Reification is needed
    to preserve the distinction through a knowledge graph.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
- id: K06
  label: Topic broader / similar
  statement: Subject-area inclusion/overlap is distinguished from concept extension/subsumption. Automatically treating
    every broader relation as a strict subclass edge loses this distinction.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E09
- id: K07
  label: Lexical specialization
  statement: The prose claims WordNet hyperonymy as a specializes subrelation holding between Synset individuals.
    Direction and historical predicate spelling must be checked in an actual alignment source.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
  - E12
  - E14
- id: K08
  label: Class versus instance level
  statement: Synset/Concept class subsumption and specializes between instances are separate constructions; diagrams
    do not authorize unrestricted OWL metamodeling or equivalence.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E08
  - E12
  - E14
- id: K09
  label: Printed cardinalities
  statement: Fig.6 displays expresses minimum 1 and hasSyntacticFunction maximum 1. Fig.5 prints frame/component and
    identifier multiplicities. These are exact diagram observations, not a profile/consistency result.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - E13
- id: K10
  label: Current L1 union definitions
  statement: Retained Expression is equivalent to expresses some Meaning OR denotes some Reference; Reference similarly
    uses hasInterpretation some Meaning OR isDenotedBy some Expression. Meaning requires some expressed-by Expression.
    This is not the same statement as every diagram Expression having an explicit known meaning.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
  - E06
  - E13
- id: K11
  label: Current L2 reference existentials
  statement: IndividualReference requires some concept classification and some membership in MultipleReference. MultipleReference
    has no local membership existential; ExtensionalReference requires a member with some setting and a ContextualExpression
    denotation. Open-world existence is not an explicit named record or validation success.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A02
  - E07
  - E16
- id: K12
  label: Current context and type restrictions
  statement: CoText adds a rule-unified neighborhood; KnowledgeCommunity comment requires shared paradigm but its
    local logical axioms do not encode that full common-paradigm condition. Name/ConceptExpression/ContextualExpression
    are pairwise disjoint in retained L2. These are current-version commitments, not silently transferred to2008.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - A01
  - A02
  - E04
  - E16
- id: K13
  label: Formalization population boundary
  statement: There are no numbered equations, displayed FOL axiom set or complete machine-readable source listing
    in this paper. Its formal evidence is prose and diagrams; the diagram ledger is manual research transcription,
    not a replacement ontology.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E07
  - E09
  - E12
  - E13
  - E14
