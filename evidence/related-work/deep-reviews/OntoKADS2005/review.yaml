findings:
- id: F01
  label: Prior overlap
  statement: Reasoning as purposeful mental transformation with content participants is explicit prior art. It prevents
    an unsupported universal claim that prior ontologies only model static concepts.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E06
  - E08
- id: F02
  label: Classification-level discipline
  statement: A concept changing its Task/Inference label is a model-building event; it is not evidence that a domain
    entity changed its essential type. Treat both temporal axes explicitly in later comparisons.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
- id: F03
  label: D4 variable scope
  statement: The printed definition has an unbound y. Executable reuse requires an explicit, reviewed quantification
    decision; silently inserting exists-y would conceal a source discrepancy.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
- id: F04
  label: A13 weaker than prose
  statement: The displayed existential cutoff does not by itself force a nonempty prefix of participation. The positive
    prose intent and the weaker printed formula must be retained separately.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
- id: F05
  label: Method claim remains untested
  statement: The proposed ontology-first modeling workflow is clear, but paper evidence does not establish that it
    improves correctness, reuse, effort or agreement over CommonKADS.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E02
  - E11
  - E13
- id: F06
  label: Proposed mappings are not equivalences
  statement: The COM merger and DnS/I&DA correspondences are tentative and qualified by differences over regions,
    signs, mental objects and content. They cannot be imported as exact semantic equivalences.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
