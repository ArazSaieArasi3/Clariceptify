dimensions:
  D1_identity_coverage:
    statement: The acquired item is the May2005 LaRIA report, including its cover. PDF numbering avoids inventing
      publisher pagination. The complete text, figures and formulas are covered; the earlier workshop reference is
      kept distinct.
    basis: AUTHOR_REPORTED
    evidence:
    - E01
    - E14
  D2_problem_contribution:
    statement: The problem is semantic treatment of the interface between domain knowledge and reasoning in CommonKADS.
      The contribution combines a DOLCE problem-solving ontology with meta-properties for modeling primitives, giving
      knowledge roles an explicit content/participation interpretation. The claimed improvement is conceptual and
      methodological; comparative effectiveness is not established.
    basis: AUTHOR_REPORTED
    evidence:
    - E01
    - E02
    - E10
    - E11
  D3_method:
    statement: The authors analyze CommonKADS examples, specialize DOLCE, borrow I&DA mental-object distinctions and
      role meta-properties, then derive modeling questions and an ontology-to-expertise-model workflow. This is a
      constructive conceptual analysis using car diagnosis and code calibration. Participant recruitment, a reproducible
      annotation protocol and quantitative comparison are not reported in this selected text.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E04
    - E07
    - E10
    - E11
    - E13
  D4_requirements:
    statement: 'Intended user: knowledge engineer constructing expertise models. The paper explicitly asks what participates
      in reasoning/communication, how participation works and how meta-properties characterize it. It requires application-independent
      methods and richer semantic commitments before primitive assignment. These are author questions/requirements,
      not an executed CQ suite. Collaboration/coordination is explicitly outside the current treatment.'
    basis: AUTHOR_REPORTED
    evidence:
    - E01
    - E04
    - E06
    - E11
  D5_concepts:
    statement: The central separation is between perdurant reasoning/communication, endurant contents, content subjects
      and real-world referents. Expression is code-dependent; Content is code-independent. Document is a physical
      carrier; propositions and concepts are mental objects. A second classification level assigns modeling primitives
      to concepts at building times. Formal/material knowledge roles distinguish whether identity comes from the role
      or an underlying type.
    basis: AUTHOR_REPORTED
    evidence:
    - E03
    - E05
    - E07
    - E08
    - E10
  D6_relations_formalization:
    statement: All 22 labeled items are catalogued individually, with participation/classification/subsumption relations.
      A1-A3/D1 characterize action types, A4-A8 meta-level labels and restrictions, A9/D2 subject structure and A10-A13/D3-D6/T1-T3
      input roles. D4 has an unbound variable; A13 alone permits a vacuous early cutoff. The source is not silently
      repaired and no prover result is claimed.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E04
    - E05
    - E07
    - E09
  D7_grounding:
    statement: DOLCE supplies particulars, endurants/perdurants and time-indexed participation. Role anti-rigidity
      and external dependence are inherited conceptual criteria; formal/material roles concern identity. Classifying
      a concept by a meta-property is different from a domain object instantiating that concept. Model-building times
      and action-participation times have different intended uses. The paper permits human/system reasoners and intentionally
      distinguishes reasoning from communication.
    basis: AUTHOR_REPORTED
    evidence:
    - E03
    - E04
    - E05
    - E09
    - E10
  D8_artifact_correspondence:
    statement: 'The text describes OntoSpec semi-informal specifications and an environment extending TERMINAE as
      being developed. No version-pinned executable OntoKADS module is present in the retained corpus. Its exact availability
      and machine-checkable correspondence are open in #236; no source absence, license, class count, consistency
      or generation success is inferred.'
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E13
  D9_evaluation:
    statement: Car diagnosis and calibration illustrate the proposed semantics, and calibration is described as an
      ongoing evaluation application. Discussion says comparisons with CommonKADS are current work. There is no reported
      test population, effect estimate or completed independent expert study here. The reviewer inspects source coherence
      but does not reproduce an author experiment or execute ontology reasoning.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E04
    - E11
    - E13
  D10_critical_synthesis:
    statement: Strong prior coverage exists for mental reasoning activity, content/expression separation, temporally
      classified modeling primitives and context-dependent knowledge roles. This narrows any later novelty claim.
      Limits include conceptual/prototype status, deliberately narrow coordination scope, untested identity/role commitments
      and formula defects. Comparisons must keep foundational and classification-level differences explicit. All later
      uses remain proposals for the owner.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E05
    - E07
    - E09
    - E10
    - E11
    - E12
    - E13
