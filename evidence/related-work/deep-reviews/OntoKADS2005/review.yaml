scenarios:
- id: S01
  label: Author questions
  statement: What entities participate in reasoning/communication; how they participate; and which meta-properties
    characterize these roles. These are the three explicit kernel questions.
  basis: AUTHOR_REPORTED
  evidence:
  - E06
- id: S02
  label: Positive car diagnosis
  statement: Treat the empty-fuel-tank hypothesis as a Proposition whose Subject is the state Concept; let it play
    a diagnosis-result role. The actual fuel tank is not the direct mental-content participant.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E07
  - E08
  - E10
- id: S03
  label: Positive calibration
  statement: A mathematical Model plays CalibrationData for a Calibrating occurrence, yielding ModelToCalibrate through
    D6. Model-building primitive labeling is a different relation from participation in that occurrence.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E05
  - E09
  - E10
- id: S04
  label: Adverse temporal input
  statement: Choose a cutoff earlier than every time at which y is present. Then the antecedent inside A13 is false
    throughout, so the displayed implication alone need not require x to participate at the action start. This is
    a logical reading, not a solver execution; added premises could block it.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
- id: S05
  label: Scope adverse case
  statement: A collaborative joint design meeting needs coordination of multiple reasoners and decisions. The current
    paper explicitly omits collaborative problem solving and coordination; no global claim about later OntoKADS is
    made.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E11
