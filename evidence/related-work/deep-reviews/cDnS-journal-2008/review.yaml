  evidence:
  - E06
  - E18
  basis: AUTHOR_REPORTED
- id: C065
  label: Normative multiagent system
  statement: Normative intentional collective plus description of its dynamics; dynamics and norm negotiation
    are not fully supplied here.
  evidence:
  - E06
  - E18
  - E22
  basis: AUTHOR_REPORTED
- id: C066
  label: Social practice
  statement: Plan shared within a knowledge community; not every norm must be causally learned from observed
    practice merely from121.
  evidence:
  - E18
  basis: AUTHOR_REPORTED
- id: C067
  label: Conventionalized norm
  statement: Uses concepts defined in a social practice; imposing a norm rather than following existing practice
    is a stated qualification.
  evidence:
  - E06
  - E18
  basis: AUTHOR_REPORTED
- id: C068
  label: Compliance interpretation
  statement: Agent uses a norm to redescribe behavior; goal belongs to the interpretation plan rather than
    necessarily the norm itself.
  evidence:
  - E06
  - E18
  basis: AUTHOR_REPORTED
- id: C069
  label: Norm as behavioral constraint
  statement: Norm as part of an agent plan; executing this aspect requires distinguishing Norm from Plan under
    disjointness119.
  evidence:
  - E06
  - E18
  basis: AUTHOR_REPORTED
- id: C070
  label: Constitutive norm
  statement: Norm and constitutive description; introduces social agents rather than only classifying pre-existing
    behavior.
  evidence:
  - E18
  basis: AUTHOR_REPORTED
- id: C071
  label: Meta-norm / secondary rule
  statement: Norm describing a distinct norm; priority, entrenchment and conflict resolution require further
    theory.
  evidence:
  - E18
  - E22
  basis: AUTHOR_REPORTED
- id: C072
  label: Reactive plan
  statement: Plan describing a behavior/execution and norm for judgment or sanction;127 itself does not implement
    sanctions.
  evidence:
  - E18
  basis: AUTHOR_REPORTED
- id: C073
  label: Norm application
  statement: Interpretive situation satisfying a plan containing a norm in128; this differs from current OWL
    direct norm satisfaction.
  evidence:
  - E18
  - E25
  basis: AUTHOR_REPORTED
- id: C074
  label: AppliedIn
  statement: Norm/application relation with a plan-part witness; distinct from plan execution falling under
    a norm.
  evidence:
  - E18
  basis: AUTHOR_REPORTED
- id: C075
  label: FallsUnder
  statement: A plan execution has a scoped situation satisfying a norm; applies to positive or negative interpretation
    and does not mean compliance.
  evidence:
  - E18
  basis: AUTHOR_REPORTED
- id: C076
  label: Outside scope
  statement: Negated interpretive scope; absence of an OWL assertion does not establish this negation.
  evidence:
  - E18
  basis: AUTHOR_REPORTED
