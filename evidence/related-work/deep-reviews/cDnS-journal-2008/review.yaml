dimensions:
  D1_identity_coverage:
    label: Exact work and full coverage
    statement: One-author2008journal,43PDFpages/printed70-112; all147 displays,20 informal definitions,2figures,24notes
      and62references inspected. Distinct2007 source is not a substitute.
    evidence:
    - E01
    - E23
    - E24
    basis: REVIEWER_INTERPRETATION
  D2_problem_contribution:
    label: Problem and contribution
    statement: NIC integrates social agents/collectives, descriptions/information and norm-plan interplay;
      broad explicit/implicit collective action and contextual unification are supported conceptual contributions,
      not an empirical detector.
    evidence:
    - E02
    - E19
    - E20
    - E22
    basis: REVIEWER_INTERPRETATION
  D3_method:
    label: Method
    statement: Constructive conceptual analysis, reification, FOL pattern construction, OWL projection and
      legal/social/plan examples with extensive literature dialogue. No named complete lifecycle or original
      benchmark is reported in this text.
    evidence:
    - E03
    - E08
    - E17
    - E18
    - E22
    - E23
    basis: REVIEWER_INTERPRETATION
  D4_requirements:
    label: Requirements and scenarios
    statement: Users are knowledge/normative-MAS modelers; expressive requirements concern shared context,
      identity, plan/norm use and physical grounding. No numbered operational CQ suite is supplied; positive/adverse
      reviewer scenarios are separately labeled.
    evidence:
    - E02
    - E05
    - E06
    - E15
    - E17
    - E18
    basis: REVIEWER_INTERPRETATION
  D5_concepts:
    label: Paper conceptual scope
    statement: Catalog covers source categories, relations, stance/method primitives, examples and critical
      distinctions without an eight-item cap. Artifact-only additions are explicit;51 machine classes belong
      to a separately pinned file map.
    evidence:
    - E03
    - E04
    - E08
    - E17
    - E18
    - E19
    - E20
    - E25
    - E26
    - E27
    basis: REVIEWER_INTERPRETATION
  D6_relations_formalization:
    label: Formal content
    statement: Every147 numbered display has its own page/role/critical record; informal Definition1-20 are
      separate. Modal/list/equality assumptions, free variables, arity and witness/vacuity issues remain literal
      and are not silently repaired or proved globally inconsistent.
    evidence:
    - E08
    - E09
    - E10
    - E11
    - E12
    - E13
    - E15
    - E16
    - E17
    - E18
    - E19
    - E20
    basis: REVIEWER_INTERPRETATION
  D7_grounding:
    label: Grounding and identity
    statement: Foundation-independent c.DnS; social agent versus physical agent, information versus realization,
      classifier versus instance and situation versus description are maintained. Internal construction, shared
      assumption, time and parthood need explicit context and witnesses.
    evidence:
    - E03
    - E08
    - E12
    - E13
    - E15
    - E16
    - E19
    basis: REVIEWER_INTERPRETATION
  D8_artifact_correspondence:
    label: Artifact and reproducibility
    statement: Paper-linked collInt1.0 has25 classes; selected ground14 and retained core1.1 with12 give51
      unique classes and76 declared object properties. All source-comment paraphrases/constraints reconciled;
      original-host parity and root/core compatibility remain unestablished, with undeclared shares/isSharedBy.
    evidence:
    - E25
    - E26
    - E27
    - E28
    basis: REVIEWER_INTERPRETATION
  D9_evaluation:
    label: Evaluation evidence
    statement: Five functions distinguish author conceptual arguments and examples from executed acquisition/parsing/glossary
      reconciliation. No independent reasoner/profile, replicated study, correctness benchmark or expert acceptance
      is claimed.
    evidence:
    - E22
    - E23
    - E25
    - E26
    - E27
    basis: REVIEWER_INTERPRETATION
