    - E03
    - E13
    - E17
    - E18
    - E19
    - E20
    - E22
    - E28
    basis: REVIEWER_INTERPRETATION
catalog:
- id: C001
  label: NIC framework
  statement: Journal framework integrating agents, collectives, plans, norms and epistemic influence; NIC is
    also the acronym of one collective subtype, so context disambiguates the two uses.
  evidence:
  - E01
  - E02
  - E19
  basis: AUTHOR_REPORTED
- id: C002
  label: Constructive DnS / c.DnS
  statement: Foundationally independent contextual construction pattern, distinct from DOLCE-grounded earlier
    DnS; no supplied ground ontology is mandatory.
  evidence:
  - E03
  - E04
  basis: AUTHOR_REPORTED
- id: C003
  label: DnS / DOLCE+
  statement: Earlier framework is discussed as provenance and contrast; DOLCE is not automatically the actual
    NIC import foundation.
  evidence:
  - E03
  basis: AUTHOR_REPORTED
- id: C004
  label: Description / D
  statement: Reified conceptual relation or action/norm schema; first-order individual, not an OWL class identified
    with its extension.
  evidence:
  - E03
  - E08
  - E09
  basis: AUTHOR_REPORTED
- id: C005
  label: Situation / S
  statement: Reified context whose entities participate in a setting and satisfy descriptions; can itself occur
    in another interpretive context.
  evidence:
  - E03
  - E10
  - E11
  basis: AUTHOR_REPORTED
- id: C006
  label: Concept / C
  statement: A description-defined classifier; role/task/parameter and other domain concepts are special uses
    rather than individual classified objects.
  evidence:
  - E04
  - E09
  - E10
  basis: AUTHOR_REPORTED
- id: C007
  label: Entity / E
  statement: Generic domain with schematic and non-schematic aspects; boxed modality and complement presentation
    need an explicit logical interpretation.
  evidence:
  - E08
  basis: AUTHOR_REPORTED
- id: C008
  label: Schematic entity / SE
  statement: Union of Description, Situation, Concept, SocialAgent, Collection and InformationObject; prose
    states disjointness independently of the union formula.
  evidence:
  - E08
  - E21
  basis: AUTHOR_REPORTED
- id: C009
  label: Non-schematic entity
  statement: Complementary ground-domain status; not equivalent by definition to every G, since11 lacks the
    explicit exclusion.
  evidence:
  - E08
  - E13
  basis: AUTHOR_REPORTED
- id: C010
  label: Ground entity / G
  statement: Entity undergoing contextual redescription; social and grounded construction principles progressively
    add witnesses.
  evidence:
  - E08
  - E13
  - E16
  basis: AUTHOR_REPORTED
- id: C011
  label: Time / T
  statement: Non-schematic temporal entity; appears as explicit argument in many paper relations, unlike binary
    OWL mappings.
  evidence:
  - E08
  - E10
  - E15
  - E17
  basis: AUTHOR_REPORTED
- id: C012
  label: Social agent / A
  statement: Schematic actor primitive distinct from its physical embodiment, role, institution instance and
    collection of actors.
  evidence:
  - E04
  - E08
  - E15
  - E19
  basis: AUTHOR_REPORTED
- id: C013
  label: Collection / K
  statement: Socially unified entity with time-varying members; identity is not ordinary fixed-set identity
    or member sum.
  evidence:
  - E02
  - E12
  basis: AUTHOR_REPORTED
- id: C014
  label: Information object / I
  statement: Schematic informational entity expressing descriptions or other schematic entities; physical realization
    is separate.
  evidence:
  - E04
  - E11
  - E16
  basis: AUTHOR_REPORTED
- id: C015
  label: Redescription situation
  statement: Context that reinterprets another situation and can occur at a different time; fictional example
    adds no general fictional-context calculus.
  evidence:
  - E11
  - E16
  basis: AUTHOR_REPORTED
- id: C016
  label: Domain context
  statement: Ground ontology can supply arbitrary entity categories; construction reconstructs objects within
    a chosen descriptive network.
  evidence:
  - E03
  - E08
  basis: AUTHOR_REPORTED
- id: C017
  label: Conceptual context
  statement: Descriptions and concepts bind an interpretation; Figure1 groups these explicitly.
  evidence:
  - E14
  basis: AUTHOR_REPORTED
- id: C018
  label: Circumstantial context
  statement: Situations and setting entities provide circumstantial bindings.
  evidence:
  - E14
  basis: AUTHOR_REPORTED
- id: C019
  label: Social context
  statement: Agents and collectives share/conceptualize descriptions and bring about social structures.
  evidence:
  - E14
  - E19
  - E20
  basis: AUTHOR_REPORTED
- id: C020
  label: Informational context
  statement: Information objects express schematic meanings and have aboutness and physical realizations.
  evidence:
  - E14
  - E16
  basis: AUTHOR_REPORTED
- id: C021
  label: Concept definition / use
  statement: Definition links a D to C; use requires a distinct defining D. Journal18 supplies existence, not
    exactly-one definition.
  evidence:
  - E09
  basis: AUTHOR_REPORTED
- id: C022
  label: Constitutive introduction
  statement: Descriptions introduce social agents; this must remain distinct from defining classifying concepts.
  evidence:
  - E09
  - E17
  basis: AUTHOR_REPORTED
- id: C023
  label: Role / Role(c)
  statement: Plan-defined object classifier; anti-rigidity motivates the prose, while98 itself is a non-modal
    characterization.
  evidence:
  - E05
  - E17
  basis: AUTHOR_REPORTED
- id: C024
  label: Task / Task(c)
  statement: Plan-defined action classifier targeted by at least one role; not a plan execution individual.
  evidence:
  - E05
  - E17
  basis: AUTHOR_REPORTED
- id: C025
  label: Parameter / Parameter(c)
  statement: Plan-defined value classifier required by some concept; value-object/data distinction remains
    implementation work.
  evidence:
  - E05
  - E17
  basis: AUTHOR_REPORTED
- id: C026
  label: Classification
  statement: Time-indexed concept/entity relation; OWL reified Classification is an implementation device with
    a different signature.
  evidence:
  - E10
  - E25
  basis: AUTHOR_REPORTED
- id: C027
  label: Covering concept
  statement: A concept classifies every member of a collection; does not impose non-empty membership.
  evidence:
  - E12
  basis: AUTHOR_REPORTED
- id: C028
  label: Characterizing concept
  statement: A concept covers a collection containing the characterized collection as a part; extension and
    identity must be kept distinct.
  evidence:
  - E12
  basis: AUTHOR_REPORTED
- id: C029
  label: Unifying description
  statement: Defines a covering concept for a collection; neither unique unification nor member identity follows.
  evidence:
  - E12
  basis: AUTHOR_REPORTED
- id: C030
  label: Agent collection / AK
  statement: Collection with only social-agent members; extrinsic commonality need not be shared knowledge
    or a common plan.
  evidence:
  - E06
  - E12
  basis: AUTHOR_REPORTED
- id: C031
  label: Knowledge community / KC
  statement: Agent collection sharing descriptions; original common-witness requirements differ from current
    per-member knowledge-corpus restrictions.
  evidence:
  - E07
  - E13
  - E25
  basis: AUTHOR_REPORTED
- id: C032
  label: Configuration / Cfg
  statement: Collection whose members are parts of entities described by a common unifier; not a mere undifferentiated
    aggregate.
  evidence:
  - E12
  basis: AUTHOR_REPORTED
- id: C033
  label: Bundle
  statement: A description with description parts coupled via a common concept/collection or situation. Printed65
    lacks explicit distinctness of its two witnesses.
  evidence:
  - E13
  basis: AUTHOR_REPORTED
- id: C034
  label: Specialization
  statement: Relation between schematic entities; distinct from instance classification and time-indexed social-agent
    instantiation.
  evidence:
  - E12
  - E13
  basis: AUTHOR_REPORTED
- id: C035
  label: Conceptualization / sharing
  statement: Ability to use a schematic entity in a context; does not entail belief, endorsement or truth of
    a scientific theory.
  evidence:
  - E10
  - E13
  basis: AUTHOR_REPORTED
- id: C036
  label: Assumption
  statement: Stronger attitude that implies conceptualization; no converse and no belief/evidence theory supplied.
  evidence:
  - E13
  basis: AUTHOR_REPORTED
- id: C037
  label: Paradigm
  statement: Bundle whose descriptions are assumed in knowledge communities; source permits community witnesses
    varying by part/time.
  evidence:
  - E13
  - E20
  basis: AUTHOR_REPORTED
- id: C038
  label: Social construction principle
  statement: Full network of social, informational, conceptual and interpretive witnesses for ground entities;
    non-regress scope caveat needs formal enforcement.
  evidence:
  - E13
  basis: AUTHOR_REPORTED
- id: C039
  label: Agent efficacy
  statement: Every social agent is acted for by some entity; actor is not automatically rational, physical
    or a member of one fixed organization.
  evidence:
  - E15
  basis: AUTHOR_REPORTED
- id: C040
  label: Rational-agent efficacy
  statement: Stronger cognitive-actor proposal explicitly not axiomatized; do not treat it as a proved consequence.
  evidence:
  - E15
  basis: AUTHOR_REPORTED
- id: C041
  label: Physical agent / PA
  statement: Non-schematic grounding actor that constructs internal representations; distinguish from schematic
    social agent.
  evidence:
  - E15
  basis: AUTHOR_REPORTED
- id: C042
  label: Internal representation / R
  statement: Individual agent-level non-schematic counterpart of a shared description; source counterpart links
    are weaker than some prose claims.
  evidence:
  - E15
  - E16
  basis: AUTHOR_REPORTED
- id: C043
  label: Cognitive counterpart principle
  statement: Grounds conceptualization in a physical actor constructing a representation;85/87 require binding
    and co-reference analysis.
  evidence:
  - E15
  basis: AUTHOR_REPORTED
- id: C044
  label: Physical realization / PR
  statement: Non-schematic physical support realizing an information object, e.g. paper versus constitution
    text.
  evidence:
  - E16
  basis: AUTHOR_REPORTED
- id: C045
  label: Information grounding
  statement: Conceptualization is accompanied by information-expression and physical-realization witnesses;
    not an automatic identity of text and description.
  evidence:
  - E16
  basis: AUTHOR_REPORTED
- id: C046
  label: Grounded scope
  statement: Interpretive situation is linked to physical cognitive/informational witnesses; represented-event
    and redescription times are distinct.
  evidence:
  - E16
  basis: AUTHOR_REPORTED
- id: C047
  label: Grounded construction principle
  statement: Adds organism-level construction and material realization to social construction; no executed
    whole-theory consistency proof is reported here.
  evidence:
  - E16
  - E22
  basis: AUTHOR_REPORTED
- id: C048
  label: Action
  statement: Generic entity subtype assumed for tasks; no exhaustive DOLCE perdurant analysis in95.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C049
  label: Object
  statement: Generic entity subtype assumed for roles; current artifact permits some fillers not stated in98.
  evidence:
  - E17
  - E25
  basis: AUTHOR_REPORTED
- id: C050
  label: Value
  statement: Generic entity subtype assumed for parameters; not automatically a literal, datatype or quality
    region.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C051
  label: Plan
  statement: Action-schema Description with conceptualization, task, role and desired goal part; distinct from
    its execution and disjoint from Norm.
  evidence:
  - E05
  - E17
  - E18
  basis: AUTHOR_REPORTED
- id: C052
  label: Subplan
  statement: A plan properly contained in another plan; subplan execution part constraints differ from goal-situation
