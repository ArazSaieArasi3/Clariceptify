    plan.
  evidence:
  - E05
  - E17
  basis: AUTHOR_REPORTED
- id: C056
  label: Main goal
  statement: Goal of a given plan that belongs to none of its subplans at the selected time.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C057
  label: Subgoal
  statement: Goal of a plan and one of its subplans; need not be a mereological part of the main goal.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C058
  label: Goal influence
  statement: Structural relation linking subgoal and main goal of a shared plan; paper prose causal language
    exceeds this definition alone.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C059
  label: Goal / plan adoption
  statement: Assumption-based relations; printed112 targets a task as adopted plan and113 has stray A(x), so
    literal details need preservation.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C060
  label: Plan execution
  statement: Situation satisfying a plan with conceptualization no later than execution setting time; ordinary
    satisfaction alone loses anticipation.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C061
  label: Goal situation
  statement: Situation satisfying a goal, distinct from desired goal description and not in general forced
    to be part of the plan execution.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C062
  label: Abort / suspension condition
  statement: Illustrates execution satisfaction without achievement of a desired goal; not a formal stopping
    algorithm.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C063
  label: Incidental satisfaction
  statement: Goal can be achieved without intentional execution of its plan; separates descriptive satisfaction
    from intentional performance.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C064
  label: Norm
  statement: Regulatory Description; conventional-practice, case-interpretation and behavioral-constraint aspects
