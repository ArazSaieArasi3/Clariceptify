  - E21
  basis: REVIEWER_INTERPRETATION
- id: F011
  label: Source variable and arity defects
  statement: 25/35/40/48/55-56/60/64/85/92 and later112-124/133/139/144/147 contain binding, delimiter, connective,
    naming or arity issues. Every display has a separate ledger row; no corrected theory is silently substituted.
  evidence:
