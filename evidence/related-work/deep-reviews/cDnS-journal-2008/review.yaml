evaluation:
  Verification:
    label: Structural and formal checks
    statement: Author presents typed FOL/OWL and some local derivational examples, but no reproducible reasoner/profile
      logs in this paper. Reviewer executed acquisition, RDF census and51-row raw comment/hierarchy reconciliation
      only; formal defects remain267.
    evidence:
    - E08
    - E12
    - E25
    - E26
    - E27
    basis: REVIEWER_INTERPRETATION
  Validation:
    label: Concept adequacy
    statement: Legal, social, scientific and planning examples motivate representation needs; no original end-user/subject-matter
      validation study of NIC is reported. The broad collective stance is an explicit theoretical choice.
    evidence:
    - E02
    - E17
    - E18
    - E19
    - E20
    - E22
    basis: REVIEWER_INTERPRETATION
  Evaluation:
    label: Performance and comparison
    statement: No measured benchmark, accuracy/efficiency comparison or participant dataset is supplied in
      the selected article. Cited applications and psychology references are not newly reproduced NIC evaluation.
    evidence:
    - E02
    - E22
    - E23
    basis: NOT_REPORTED
  Assessment:
    label: Critical assessment
    statement: Review tests interpretation with empty/repeated witnesses, varying corpus, equal times, differing
      norm applications and actor/collective identity; these are source-local arguments, not executed whole-theory
      models or empirical results.
    evidence:
    - E12
    - E13
    - E17
    - E18
    - E19
    - E20
    - E25
    basis: REVIEWER_INTERPRETATION
  Assurance:
    label: Reproducibility and acceptance
    statement: Pinned PDF/files, complete display ledger, all selected class comments/constraints and explicit
      mirror mappings support traceability. Original2008 source parity, source license, full proof/profile
      and independent expert acceptance remain unestablished.
    evidence:
    - E01
    - E25
    - E26
    - E27
    - E28
    basis: REVIEWER_INTERPRETATION
