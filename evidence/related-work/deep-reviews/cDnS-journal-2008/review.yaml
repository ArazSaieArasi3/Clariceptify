findings:
- id: F001
  label: Exact journal identity
  statement: Single-author2008 article is not the three-author2007 proceedings work;43pages,147 displays and62references
    require independent anchors.
  evidence:
  - E01
  - E23
  basis: REVIEWER_INTERPRETATION
- id: F002
  label: Integrated social framework
  statement: 'Strength: construction connects meaning, agents, information and situations to plan/norm/collective
    structure, providing a richer account than isolated labels.'
  evidence:
  - E02
  - E04
  - E19
  - E20
  basis: REVIEWER_INTERPRETATION
- id: F003
  label: Foundation independence
  statement: c.DnS removes mandatory DOLCE ground assumptions; DOLCE-related ancestry is not an actual dependency
    on a particular DOLCE edition.
  evidence:
  - E03
  - E08
  - E26
  - E27
  basis: REVIEWER_INTERPRETATION
- id: F004
  label: Norm-plan distinctions
  statement: 'Strength: three norm aspects and separate scope/application/efficacy/compliance notions constrain
    careless claims that applying a norm proves compliance.'
  evidence:
  - E06
  - E18
  basis: REVIEWER_INTERPRETATION
- id: F005
  label: Agent embodiment levels
  statement: 'Strength: social actors, physical counterparts, information objects and realizations are separated;
    identity should not collapse across these categories.'
  evidence:
  - E15
  - E16
  basis: REVIEWER_INTERPRETATION
- id: F006
  label: Sharing versus endorsement
  statement: 'Strength: conceptualization, assumption and truth/belief are distinct; rejected theories can
    be conceptualized without endorsement.'
  evidence:
  - E13
  basis: REVIEWER_INTERPRETATION
- id: F007
  label: Plans versus success
  statement: 'Strength: goals, plan execution, abort and incidental achievement expose the difference between
    descriptive satisfaction and intentional success.'
  evidence:
  - E17
  basis: REVIEWER_INTERPRETATION
- id: F008
  label: Broad collective attribution
  statement: The broad constructive stance admits distributed or retrospectively attributed plans; it does
    not provide an operational mental-state detector or universal common-goal awareness criterion.
  evidence:
  - E02
  - E19
  basis: REVIEWER_INTERPRETATION
- id: F009
  label: Formal language boundary
  statement: The paper calls the theory first-order with identity, but3 is modal,1 uses starred tuple slots,55
    uses temporalized equality and13 is omitted. Executable semantics requires explicit translation choices.
  evidence:
