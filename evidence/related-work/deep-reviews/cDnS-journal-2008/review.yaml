    label: Critical use
    statement: Context and norm-plan distinctions are strengths; literal/source projection and witness limitations
      constrain future mappings. Questions remain267/251/126; next full paper77 and then owner-authorized bounded84
      summary review. No ontology/manuscript/release adoption.
