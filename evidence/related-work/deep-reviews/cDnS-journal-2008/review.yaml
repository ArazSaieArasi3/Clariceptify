  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C054
  label: Desire
  statement: Description subtype treated as a primitive way to represent an environment; not a measured mental-state
    criterion.
  evidence:
  - E17
  basis: AUTHOR_REPORTED
- id: C055
  label: Goal
