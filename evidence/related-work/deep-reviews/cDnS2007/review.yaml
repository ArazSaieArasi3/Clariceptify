  - E04
  - E21
- id: F02
  label: Axiomatization is not a ready FOL program
  statement: Display 3 is modal;1 uses ordered-list argument positions;13 is an assumed unexpanded schema. These must
    be normalized with an explicit domain/encoding contract before computational reasoning.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E08
- id: F03
  label: Arity inconsistencies
  statement: Examples/formulas vary the arity of settingFor, shares, assumes, covers, characterizes, expresses, realizes,
    actsFor, constructs and properPartOf. A parser accepting RDF or a manually repaired encoding is not evidence that
    the literal printed theory executed successfully.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E09
  - E11
  - E13
  - E15
  - E17
- id: F04
  label: Variable and witness gaps
  statement: 41 prints A(s) for deputes(a,...);45 leaves d1 free;88 leaves a free;103 prints A(y);114 prints A(x);115
    leaves a free;122 leaves t free;134/138 use free d instead of the quantified unifier. Implicit universal closure
    would not automatically produce the intended existential semantics.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E10
  - E15
  - E16
  - E17
  - E18
  - E19
- id: F05
  label: Containment weaker than the shared-collection prose
  statement: 56 puts the Collection existential inside the entity/time universal. It requires a membership witness
    per entity, not one common collection whose members are all entities classified by the concept.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
- id: F06
  label: Additional quantifier differences
  statement: 76 can use a different community for each part description;68/100/136 have vacuous universal cases;118
    forces a counterexample witness for each GoalSituation rather than merely declining universal part inclusion.
    These are local logical observations, not full-theory solver results.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E12
  - E13
  - E16
  - E17
  - E19
- id: F07
  label: Literal typing conflicts need normalization
  statement: 105 defines a purported SocialAgent as a Concept through defines;113 passes a Task to adoptsPlan, whose
    range is Plan;140 makes a KnowledgeCollective the SocialAgent target of actsFor. Combined with the relevant hierarchy/disjointness
    and repaired time/signature assumptions, such instances may become impossible. No global unsatisfiability result
    is claimed.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E15
  - E16
  - E17
  - E19
  - E20
- id: F08
  label: Physical grounding does not guarantee same content
  statement: The composite90/94/97 witnesses do not explicitly connect the constructed r to the shared d using individuallyConstructedAs.
    Physical support/actor existence cannot silently stand for semantic content identity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E15
