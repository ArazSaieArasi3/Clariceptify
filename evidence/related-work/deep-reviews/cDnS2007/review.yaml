scenarios:
- id: S01
  label: Author legal redescription
  statement: The same driving/driver can be interpreted as ordinary driving, racing or a speed-limit violation under
    different descriptions. This is source-stated contextualization, not a claim that all readings are legally correct.
  basis: AUTHOR_REPORTED
  evidence:
  - E04
  - E07
- id: S02
  label: Sharing without agreement
  statement: Lavoisier can share/understand phlogiston theory while not assuming it. An inference from shares to believes/assumes
    would exceed73 and the explicit discussion.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E13
- id: S03
  label: Collective identity versus members
  statement: ItalianGovernmentCollective and Prodi2Collective can be coextensional for a period yet have different
    unifiers. A membership-only database identity would erase this difference.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
- id: S04
  label: Norm applicability without compliance
  statement: A speed-limit-violating plan execution can fall under the norm without satisfying its behavioral constraints;
    distinguish application situation, case and norm execution.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E18
- id: S05
  label: Event time versus interpretation time
  statement: A detective interprets a past event at a later time. Temporal collapse in a binary OWL property cannot
    be assumed to preserve this distinction.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E06
  - E15
  - A01
- id: S06
  label: Containment quantifier counterexample
  statement: For56, use a different singleton collection for each classified entity. Every entity has a membership
    witness, yet there need be no one collection containing all entities classified by the concept. This manually
    satisfies the local quantifier pattern and tests the stronger prose claim; it is not a model-finder execution
    of the whole theory.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E11
- id: S07
  label: Empty community and role extensions
  statement: An empty membership extension can satisfy the universal condition in 68; an uninstantiated Concept can
    satisfy100/136 universals. Nonemptiness stated elsewhere in prose must be separately encoded rather than inferred
    from these definitions alone.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E04
  - E12
  - E16
  - E19
- id: S08
  label: Conditional bringsAbout contradiction
  statement: Assume bringsAbout(a,k,t), literal140, actsFor typing81, KC/collection hierarchy and stated A/K disjointness.
    Then k must be a SocialAgent and a Collection. This condition makes that relation instance impossible under those
    combined assumptions; it does not prove that the entire paper theory has no model.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E15
  - E19
  - E20
- id: S09
  label: Unlinked normative unifier
  statement: In134 a NormPlanBundle y can exist while a different free d unifies x. The displayed formula does not
    explicitly state unifies(y,x). The same missing link recurs in 138.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E19
- id: S10
  label: Grounding witness mismatch
  statement: 90/94/97 can provide an internal representation r without explicitly linking r to the very shared description
    d through individuallyConstructedAs. A matching physical actor is not automatically content identity.
  basis: REVIEWER_INTERPRETATION
  evidence:
  - E15
