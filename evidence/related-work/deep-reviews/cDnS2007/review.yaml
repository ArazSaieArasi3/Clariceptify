    classes are absent from this file; related modules may exist elsewhere. Temporal projections become binary properties;
    conceptualizes/expresses have SchematicEntity ranges; hasProperPart/isProperPartOf are transitive and mutuallyDependent
    symmetric. Neither arbitrary rule composition nor proof of all consequences follows. See [complete census](artifact-census.json).
