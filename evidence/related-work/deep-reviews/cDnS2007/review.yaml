  label: Figure and theory differ
  statement: Fig.1 labels NormativeIntentionalCollective rather than the prose IntentionalNormativeCollective, and
    draws KnowledgeCollective under IntentionalCollective while138 states the normative subtype. The weaker drawing
    does not erase the stronger text or establish equivalent naming.
