findings:
- id: F01
  label: Strong conceptualization overlap
  statement: The paper explicitly represents constructive conceptualization with agents, communities, description/concept
    structures, situations, information and time. It is direct prior overlap, so static-structure-only or universal-nonexistence
    novelty claims would be unsupported.
  basis: REVIEWER_INTERPRETATION
