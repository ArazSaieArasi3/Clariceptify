- id: C40
  label: EpistemicInfluence
  statement: NormPlanBundle using a knowledge role and an agent role; wider claims about influence are conceptual
    rather than a causal estimator.
  basis: AUTHOR_REPORTED
  evidence:
  - E19
- id: C41
  label: KnowledgeCollective
  statement: Intended normative collective with an epistemic-influence unifier containing a paradigm; compare free-variable138
    and Fig.1 hierarchy.
  basis: AUTHOR_REPORTED
  evidence:
  - E19
  - E20
- id: C42
  label: SocialRelation
  statement: Epistemic influence unifying a knowledge collective, assumed by its members. Accountability is explicitly
    deferred.
  basis: AUTHOR_REPORTED
  evidence:
  - E19
  - E22
- id: C43
  label: Redescription situation
  statement: A higher-level situation interpreting another situation; its time differs from the lower event setting
    time.
  basis: AUTHOR_REPORTED
  evidence:
  - E10
  - E15
- id: C44
  label: Conceptualization/context bindings
  statement: Epistemic, informational, circumstantial and social dimensions represented together. This is a target
    distinction, not a separate newly counted OWL class.
  basis: AUTHOR_REPORTED
  evidence:
  - E03
  - E21
- id: C45
  label: Sharing / assuming / believing / adopting
  statement: Sharing is understanding/communicability; assuming concerns epistemic commitment; adopting is directed
    toward execution. The paper explicitly does not finish a general belief/assumption theory.
  basis: AUTHOR_REPORTED
  evidence:
  - E13
  - E17
- id: C46
  label: Coextension versus collective identity
  statement: The same members at a time can belong to differently unified collectives; membership snapshots alone
    do not determine identity.
  basis: AUTHOR_REPORTED
  evidence:
  - E11
- id: C47
  label: Regulative versus constitutive norm
  statement: Regulative norms constrain conduct; constitutive norms create social entities and are not the detailed
    focus.
  basis: AUTHOR_REPORTED
  evidence:
  - E05
  - E18
- id: C48
  label: Norm convention / case descriptor / behavioral constraint
  statement: Three complementary aspects; falling under a norm can include non-compliance and does not entail executing
    the norm.
  basis: AUTHOR_REPORTED
  evidence:
  - E05
  - E18
