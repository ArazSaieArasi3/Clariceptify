dimensions:
  D1_identity_coverage:
    statement: 'The selected primary text is the three-author2007 Dagstuhl work,40 pages. Reading covers all sections,141
      numbered displays, Table 1, both figures and notes/references. The one-author2008 journal text remains unavailable
      in #263; current OWL 1.1 is not silently equated with this text.'
    basis: AUTHOR_REPORTED
    evidence:
    - E01
    - E23
    - A01
  D2_problem_contribution:
    statement: The problem is explicit representation of social agents and collectives together with the descriptions,
      plans and norms that confer their unity. The constructive contribution treats contextual conceptualization as
      a first-class social/informational/circumstantial/epistemic structure and develops increasingly rich collective
      types. This is strong prior conceptualization coverage, not evidence of universal adequacy.
    basis: AUTHOR_REPORTED
    evidence:
    - E01
    - E03
    - E19
    - E21
    - E22
  D3_method:
    statement: Constructive formal-ontology development extends previous DnS/collective work. The authors give informal
      principles, signatures, composition definitions, worked legal/scientific examples and a grounded extension.
      Most computational details and complete axiom reports are referred elsewhere; richer plans and norm theories
      are deliberately out of scope. An empirical comparative protocol is not supplied.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E02
    - E04
    - E08
    - E16
    - E18
    - E22
  D4_requirements:
    statement: Reconstructed requirements are to represent different readings of the same events, distinguish social
      agents from physical actors and member collections, track interpretation time separately from event time, and
      distinguish sharing, assuming, adopting, norm applicability and compliance. These derive from the examples/principles;
      they are not an author-provided executable CQ suite.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E04
    - E07
    - E13
    - E15
    - E17
    - E18
  D5_concepts:
    statement: Eight structural positions organize descriptions, situations, concepts, entities, social agents, collections,
      information objects and times. Schematic/non-schematic and ground-entity distinctions are orthogonal to naive
      name matching. Plans/norms are descriptions, executions/applications are situations, tasks/roles are concepts,
      and knowledge/intentional collectives are collections. Equal current membership does not establish collective
      identity.
    basis: AUTHOR_REPORTED
    evidence:
    - E04
    - E06
    - E11
    - E16
    - E18
    - E19
  D6_relations_formalization:
    statement: Every numbered display is catalogued with its role and page. The source mixes an8-position relation
      with list-valued arguments, a modal statement, assumed projection schemas, binary/ternary relations and compositional
      definitions. Variable-scope, arity, missing links and some conditional type conflicts require explicit normalization
      before execution. No repaired full theory or consistency proof is claimed.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E06
    - E08
    - E09
    - E10
    - E11
    - E14
    - E15
    - E16
    - E17
    - E18
    - E19
  D7_grounding:
    statement: c.DnS claims independence from a specific ground ontology, but retains explicit constructive principles
      and can add physical agents, internal representations and information supports. Social actors, their physical
      realizations and the collective they act for must remain distinct. Context includes interpretation/event time,
      community, expressed information and epistemic viewpoint; possession of a shared description is not belief in
      every satisfying situation.
    basis: AUTHOR_REPORTED
    evidence:
    - E03
    - E04
    - E13
    - E15
    - E21
  D8_artifact_correspondence:
    statement: The complete retained cDnS 1.1 core was parsed and all 12 named classes/47 object properties and their
      declared constraints were inventoried. It has no declared imports and omits the paper named plan/norm/collective
      extension classes. It changes labels and some commitments, including unique isDefinedIn and broader conceptualizes/expresses
      ranges. These are current-core findings, not missing concepts in the 2007 theory. Reasoner, full profile and
      2007/2008 fidelity checks remain unperformed.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - A01
    - A02
    - E16
    - E18
    - E19
  D9_evaluation:
    statement: The paper supplies formal arguments, diagrams and illustrative legal/planning/scientific cases, plus
      claims of use across application domains. It does not provide a completed participant-based expert validation,
      metric population, controlled benchmark or reproducible reasoner/prover log. The present RDF census is an actual
      parser execution; the logical counterexamples are manual review interpretations.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E07
    - E13
    - E18
    - E22
    - A01
  D10_critical_synthesis:
    statement: Strengths are explicit context, agency, collective identity, material grounding and distinctions among
      sharing/assumption/adoption and applicability/compliance. Limits include incomplete machine correspondence,
      typing/arity defects, stronger-than-prose quantification, unexpanded schemas and unevaluated practical adequacy.
      Preserve these as bounded research findings; no Clariceptify change or final novelty conclusion is authorized.
    basis: REVIEWER_INTERPRETATION
    evidence:
    - E11
    - E13
    - E15
    - E17
    - E18
    - E19
    - E20
    - E22
    - A01
    - A02
