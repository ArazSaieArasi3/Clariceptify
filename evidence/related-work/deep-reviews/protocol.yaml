dimensions:
  D1_identity_coverage: Exact work/version and complete paper coverage
  D2_problem_contribution: Problem, gap, questions and supported contributions
  D3_method: Research and ontology-engineering method
  D4_requirements: Scope, users, scenarios, requirements and competency questions
  D5_concepts: Complete paper-level conceptual catalog, definitions and hierarchy
  D6_relations_formalization: Relations, constraints, formulas and semantic consequences
  D7_grounding: Foundations, identity, dependence, agency, time and context
  D8_artifact_correspondence: Paper-to-artifact/repository correspondence and reproducibility
  D9_evaluation: Verification, Validation, Evaluation, Assessment and Assurance evidence
  D10_critical_synthesis: Strengths, limitations, counterevidence and later uses
authority:
  structured: <work-id>/review.yaml
  readable: <work-id>/report.md, generated by tools/render_deep_review.py
  raw_sources: Private retained corpus; do not redistribute full third-party works into the public repository
  historical: Earlier review/protocol/index files are historical evidence, not overwritten status authority
evidence_vocabulary:
  AUTHOR_REPORTED: Explicitly stated in the selected paper; not independently reproduced
  REVIEWER_INTERPRETATION: Analysis or reconstruction by the reviewer; evidence and inference stated separately
  EXECUTED: Actually performed operation with inspectable execution_ref, input identity and limitations
  NOT_REPORTED: Not found in the completely inspected selected text within the stated scope; not universal nonexistence
  UNKNOWN: Unavailable, ambiguous or not established; never substitute zero
dossier_fields:
- work_id
- issue
- identity
- source
- status
- coverage
- evidence
- dimensions
- catalog
- commitments
- scenarios
- evaluation
- artifact
- findings
- questions
- synthesis
- boundary
- closure_boundary
reading:
  coverage: Enumerate title/front matter, every section/subsection, figure, table, appendix and bibliography.
    Read all PDF pages including footnotes. Record printed/PDF numbering separately. Visual-check diagrams, tables,
    equations and extraction defects. A coverage declaration is review evidence, not a mechanically proven reading
    achievement.
  catalog: Inventory all ontology-bearing terms and conceptual distinctions in the selected paper, including reused
    foundations, domain concepts, relations, constraints, named formulas, examples and method primitives. Group
    aliases explicitly. No eight-item cap. Incidental nouns and bibliography titles are not ontology entities.
    Do not claim a complete released-ontology class inventory from paper extraction.
  formal: Preserve original equation labels/signature/quantification and distinguish assertion, example, definition
    and theorem. Flag suspected typographic or semantic problems; do not silently repair the source or claim satisfiability.
  requirements: Keep author-stated requirements/CQs separate from reviewer-reconstructed scenarios; include a
    positive case and an adverse case.
  counts: Author-reported, paper-catalog, local asserted artifact, import-inclusive and inferred populations remain
    separate; unknown=null.
artifact:
  boundary: One exact work/version per paper issue. Inspect available repository structure/documentation for correspondence;
    bind existing technical results to their versions. Complete artifact parsing, import/counting/reasoning/testing
    belongs to the existing medium module issues.
  version_rule: Current artifact is not presumed identical to historical paper; record provenance, licenses, missing
    files/imports and reported vs rerun tests.
closure:
  complete: All ten dimensions, all paper units, evidence-linked catalogs, strengths/weaknesses, scenario/counterexample,
    five evaluation functions, artifact boundary and open questions are recorded; source/report integrity and
    relevant CI pass in a merged PR.
  not_complete: Acquisition, issue registration, abstract review, selected-section review, partial OCR, unchecked
    visuals and schema PASS alone do not establish deep-review completion.
  unknowns: A complete critical paper review can retain unresolved artifact availability or claims. Their scientific/technical
    findings remain open and have linked IDs/issues.
  task_sizing: One main issue per paper. Medium slices may be checkpointed under it; create medium child issues
    only for independently bounded additional capabilities, never an unbounded comparative mega-issue.
owner_boundary:
  model_change: NONE
  adoption: OWNER_DECISION_REQUIRED
  forbidden: No Clariceptify ontology, definition, requirement, fixture, manuscript, release or next-version implementation
    changes. Research proposals are not accepted model decisions.
  stop: Continue one primary source at a time. Missing-full-text sources ordinarily remain blocked; the explicit2026-10-28
    I&DA-only exception below authorizes a bounded summary review/citation task without a PDF gate. This does
    not relax full-paper criteria for the18 acquired sources.

input_population_revision:
  date: '2026-10-28'
  reason: Six previously requested texts supplied by the owner; same exact 19-work corpus and same ten-dimensional review criteria.
  receipt: evidence/related-work/corpus/owner-intake-2026-10-28.json
  acquired: 18
  waiting_for_owner: 0
  primary_vs_supplement: Main PDF and externally retrieved supplement are separately identified; retrieval, raw-byte retention, visual glyph checks and solver execution are independent claims.
  limited_evidence: 1
limited_evidence_exception:
  authorized_on: '2026-10-28'
  work_id: CLR-RW-IDA
  issue: 84
  basis: OWNER_PROVIDED_GOOGLE_QUICK_READ
  current_scope: Complete a bounded critical review and citation-use guidance from the owner-supplied summary;
    retain explicit missing-full-text qualification. Do not wait for the PDF.
  full_text_review: NOT_PERFORMED
  full_text_required_for_current_scope: false
  prohibitions:
  - No REVIEW_COMPLETE full-paper state or acquired-source hash for the unavailable text.
  - No invented page, exact formula, full visual coverage, verified quotation or DOI.
  - No unqualified claim that the reviewer verified the original article.
  - No manuscript edit, ontology adoption or final corpus novelty conclusion in this source task.
  completion: Separate limited-evidence deliverable, all provided-summary claims attributed and limitations
    recorded, citation metadata checked where possible, merged relevant checks; not counted among completed
    full-paper reviews.
