adverse_cases:
- id: A01
  anchor: forms
  scenario: One entry has inflectional variants and spelling variants. Compare whether the proposed mapping wrongly
    merges form identity with written string identity.
  expected: DISTINCTIONS_REQUIRED
  execution: CONCEPTUAL_REVIEW_ONLY
- id: A02
  anchor: lexical-concept
  scenario: A lexical item denotes an ontology property while evoking an event concept. A mapping that merges
    both targets loses the distinction.
  expected: DO_NOT_EQUATE_REFERENT_AND_EVOKED_CONCEPT
  execution: CONCEPTUAL_REVIEW_ONLY
- id: A03
  anchor: conceptualization-set
  scenario: A researcher revises a rationale while leaving every entry-to-concept pair unchanged. Lexical-set
    statistics cannot detect that research decision.
  expected: NO_ACTIVITY_EQUIVALENCE_FROM_LINK_SET
  execution: REVIEWER_CONSTRUCTED_NOT_SOURCE_EXPERIMENT
- id: A04
  anchor: translation
  scenario: Two entries share a referent but differ in register or temporal usage. Test substitution rather than
    assuming unlimited translation equivalence.
  expected: CONTEXT_REQUIRED
  execution: CONCEPTUAL_REVIEW_ONLY
- id: A05
  anchor: formal-definition-of-properties
  scenario: 'Add an unlinked ontology entity: coverage and average-per-entity change although the link set does
    not. An empty domain requires an explicit undefined-value policy.'
  expected: DENOMINATOR_AND_ZERO_POLICY_REQUIRED
  execution: REVIEWER_CONSTRUCTED_NOT_SOURCE_EXPERIMENT
- id: A06
  anchor: canonical-form-object-property
  scenario: Two asserted form IRIs lack a distinctness assertion. Do not label the source inconsistent from a
    functional-property statement alone.
  expected: DEFER_ACTUAL_REASONING_TO_237
  execution: CONCEPTUAL_REVIEW_ONLY
