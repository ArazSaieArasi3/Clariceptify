source_synopsis:
  basis: REVIEWER_PARAPHRASE
  locators:
  - https://www.w3.org/2016/05/ontolex/#purpose-of-the-model
  - https://www.w3.org/2016/05/ontolex/#core
  - https://www.w3.org/2016/05/ontolex/#metadata-lime
  text: 'The report specifies lexical grounding through five modules: core, syntax-semantics, decomposition, variation-translation
    and metadata. It separates forms, entries, senses, concepts and referenced entities. Usage and conditions
    qualify lexical interpretation; external vocabularies supply linguistic categories. LIME counts links among
    lexicons, concepts and reference datasets. Examples cover multilingual terms, wordnets and publication arrangements.
    This is a community specification rather than an empirical evaluation study.'
dimensions:
  purpose:
    id: D01
    locator: https://www.w3.org/2016/05/ontolex/#purpose-of-the-model
    judgment: Evaluate this source as a lexical interface candidate, not as a replacement for the research model.
    basis: REVIEWER_ANALYSIS
    next_issues: &id001
    - 237
    - 253
    - 126
  process_product_agent_content:
    id: D02
    locator: https://www.w3.org/2016/05/ontolex/#conceptualization-set
    judgment: A link-set called conceptualization is not automatically an occurrence of concept formation. Keep
      entry/concept links separate from activity, participating person, intention and decision records.
    basis: REVIEWER_ANALYSIS
    next_issues: *id001
  mental_orientation:
    id: D03
    locator: https://www.w3.org/2016/05/ontolex/#lexical-concept
    judgment: The mental-concept interpretation is relevant counterevidence against claiming no prior conceptual-content
      distinction. It does not by itself supply person-indexed mental states or an empirical cognitive theory.
    basis: REVIEWER_ANALYSIS
    next_issues: *id001
  representation_referent:
    id: D04
    locator: https://www.w3.org/2016/05/ontolex/#lexical-sense-reference
    judgment: Preserve entry, form, sense, evoked concept and reference as separate comparison columns. An equivalence
      mapping to our Representation or Concept would require a later argument and adverse cases.
    basis: REVIEWER_ANALYSIS
    next_issues: *id001
  requirements:
    id: D05
    locator: https://www.w3.org/2016/05/ontolex/#introduction
    judgment: The use cases support lexical interface requirements; test whether our intended question concerns
      a lexical relation or a decision episode before proposing reuse. No imported ORSD or CQ satisfaction is
      established.
    basis: REVIEWER_ANALYSIS
    next_issues: *id001
  method:
    id: D06
    locator: https://www.w3.org/2016/05/ontolex/#purpose-of-the-model
    judgment: Community consensus and stated model inspirations are evidence of specification development, not
      independent expert validation of Clariceptify.
    basis: REVIEWER_ANALYSIS
    next_issues: *id001
  formal_assumptions:
    id: D07
    locator: https://www.w3.org/2016/05/ontolex/#conventions-in-this-document
    judgment: 'Natural-language axioms and embedded Turtle are evidence to inspect, not a substitute for parsing
      the pinned published modules and resolving imports in #237.'
    basis: REVIEWER_ANALYSIS
    next_issues: *id001
  foundation:
    id: D08
    locator: https://www.w3.org/2016/05/ontolex/#purpose-of-the-model
    judgment: The cited inspirations and visible SKOS/semiotics relationships justify documenting reuse. They
      do not establish a UFO/BFO grounding, exact foundation edition, or current executable import closure.
    basis: REVIEWER_ANALYSIS
    next_issues: *id001
  evaluation:
    id: D09
    locator: https://www.w3.org/2016/05/ontolex/#publication-scenarios
    judgment: Worked examples and population ratios are not measured accuracy, usability or adequacy results.
      This review executes no benchmark or reasoner on the external ontology.
    basis: REVIEWER_ANALYSIS
    next_issues: *id001
  limitations:
    id: D10
    locator: https://www.w3.org/2016/05/ontolex/#relation-to-other-models
    judgment: The review is bounded to this 2016 document. Later module evolution, full imported class definitions,
      and corpus-wide novelty remain separate work.
    basis: REVIEWER_ANALYSIS
    next_issues: *id001
findings:
- id: F01
  locator: https://www.w3.org/2016/05/ontolex/#concept-set-class
  judgment: 'Direction ambiguity: the displayed ConceptSet restriction follows skos:inScheme, whereas the adjacent
    example links the concept to its set. Preserve both readings; #237 must compare the actual axiom without silently
    repairing the source.'
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F02
  locator: https://www.w3.org/2016/05/ontolex/#propertyrange-object-property
  judgment: 'Argument-position ambiguity: the propertyRange definition duplicates the first-position wording of
    propertyDomain, despite the section distinguishing two argument positions. Do not turn this editorial ambiguity
    into an accepted mapping rule.'
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F03
  locator: https://www.w3.org/2016/05/ontolex/#skos-xl
  judgment: The first SKOS example targets a resource typed as LexicalEntry via lexicalizedSense, while the earlier
    property definition targets LexicalSense. Treat this as a documentation correspondence question, not proof
    of inconsistency.
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F04
  locator: https://www.w3.org/2016/05/ontolex/#lexical-sense-reference
  judgment: The prose describes denotes/chain equivalence. The displayed chain alone does not demonstrate that
    every denotes assertion creates a named sense witness. Separate the two directions in later formal testing.
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F05
  locator: https://www.w3.org/2016/05/ontolex/#translatableas-object-property
  judgment: The printed chain traversal must be checked against the declared entry/sense directions, and against
    its inclusion direction. Do not copy the displayed expression into a reasoning claim without the actual module.
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F06
  locator: https://www.w3.org/2016/05/ontolex/#formal-definition-of-properties
  judgment: 'Denominator risk: an average over all domain entities differs from an average over linked entities.
    Test both with unused entities and an empty denominator; record rounding rather than interpreting illustrative
    decimals as exact measurements.'
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F07
  locator: https://www.w3.org/2016/05/ontolex/#usage
  judgment: The river example prose and example literals assign the two endings in opposite order. This is a within-document
    inconsistency; no external linguistic truth judgment is required to preserve it.
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F08
  locator: https://www.w3.org/2016/05/ontolex/#conceptualization-set
  judgment: 'Scope collision: lexical pairing and purposeful conceptualizing must not be equated merely because
    both use conceptualization terminology. A person changing an interpretation without changing lexical links
    is an adverse case for that equation.'
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F09
  locator: https://www.w3.org/2016/05/ontolex/#confidence
  judgment: The PROV-based translation example prevents claiming the ecosystem has no process or provenance capability.
    Conversely, borrowed provenance vocabulary does not establish a dedicated conceptual-decision/rationale model.
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F10
  locator: https://www.w3.org/2016/05/ontolex/#translation
  judgment: Shared reference, sense-level translation and entry-level translatability must not be treated as one
    interchangeable relation. Context-sensitive replacement needs an explicit criterion; shared denotation alone
    is too weak for universal substitutability.
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F11
  locator: https://www.w3.org/2016/05/ontolex/#canonical-form-object-property
  judgment: Functional canonical-form constraints do not establish a closed-world data-quality check. Two identifiers
    need not denote distinct forms; missing explicit assertions need not mean OWL contradiction. Keep validation
    and reasoning goals separate.
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F12
  locator: https://www.w3.org/2016/05/ontolex/#purpose-of-the-model
  judgment: 'Recommendation: retain as an alignment/reuse candidate for lexical interfaces and a source of counterexamples.
    Defer semantic adoption, extension, and corpus-wide gap conclusions to #237/#253/#126 rather than rejecting
    the source for its deliberately different purpose.'
  basis: REVIEWER_ANALYSIS
  next_issues: *id001
- id: F13
  locator: https://www.w3.org/2016/05/ontolex/#linguistic-catalog-object-property
  judgment: The displayed linguisticCatalog superproperty names voaf:Vocabulary, used nearby as a class. Record
    this typing ambiguity without treating the source document as an executable ontology.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 237
  - 253
  - 126
- id: F14
  locator: https://www.w3.org/2016/05/ontolex/#core
  judgment: Several figure labels differ from the accompanying vocabulary or examples. The image ledger preserves
    nine flagged illustrations, including clipped text. Do not reuse an illustration as a verified formal pattern
    or silently repair its labels.
  basis: ACTUAL_PIXEL_INSPECTION
