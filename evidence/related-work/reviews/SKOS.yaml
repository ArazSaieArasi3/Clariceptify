source_synopsis:
  basis: REVIEWER_PARAPHRASE
  text: SKOS represents knowledge-organization resources and relationships in RDF. The Reference separates concepts,
    schemes, collections, lexical labels, notations, notes and mappings. Its optional XL vocabulary identifies label
    resources. Open-world conditions and conservative constraints distinguish what can be inferred from what an
    application may require.
dimensions:
  purpose:
    id: D01
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L879
    judgment: Treat this as evidence for publishing a KOS, not as an engineering method for discovering all conceptualization
      knowledge.
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
  process_product_agent_content:
    id: D02
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L895
    judgment: Concept schemes, labels and their links provide overlap on products and content. Do not infer an explicit
      conceptualizing episode or responsible agent from these resource types.
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
  mental_orientation:
    id: D03
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L1437
    judgment: The suggestive unit-of-thought account is counterevidence to claiming SKOS ignores conceptual content.
      It does not establish a person-indexed mental-state theory.
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
  representation_referent:
    id: D04
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L1045
    judgment: Separate a concept resource, lexical label, represented subject and OWL class in later comparison.
      Hierarchical KOS links are not automatically subclass axioms about the subject domain.
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
  requirements:
    id: D05
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#rationale
    judgment: Conservative constraints serve heterogeneous KOS reuse. A stronger Clariceptify requirement may justify
      a separate application profile, not a claim that the base standard is defective.
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
  method:
    id: D06
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#status
    judgment: Working-group standardization and linked implementation experience are source context. This task performs
      no new empirical replication or independent expert acceptance.
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
  formal_assumptions:
    id: D07
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L881
    judgment: Interpret domain and range as inference conditions under open-world semantics. A missing explicit
      type is not by itself invalid data.
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
  foundation:
    id: D08
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L1045
    judgment: RDF/RDFS/OWL Full are the stated representation basis; this is not evidence of UFO, BFO or DOLCE grounding.
      Actual schema imports and class populations remain uninspected here.
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
  evaluation:
    id: D09
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L434
    judgment: 'Do not turn source consistency examples into a formal conformance certification: the Reference declines
      to define one. Examples below are read, not executed.'
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
  limitations:
    id: D10
    locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#namespace-document-rdf
    judgment: The document is stronger than the downloadable RDF subset in some constraints. A future parser or
      DL-reasoner pass cannot automatically certify the complete Recommendation.
    basis: REVIEWER_ANALYSIS
    next_issues:
    - 238
    - 253
    - 126
findings:
- id: F01
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L1101
  judgment: Do not treat scheme membership as a closed enumeration. A shared concept may appear in several schemes,
    and extra membership can remain compatible with the source.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F02
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L2446
  judgment: A top-concept usage convention is not a prohibition on broader links. Keep intended application policy
    separate from source inconsistency.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F03
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L1567
  judgment: Preferred-label integrity requires both language-tag partitions and the untagged case clarified by the
    official S14 erratum. It is not a generic cardinality-one restriction.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F04
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L1606
  judgment: An alternative label without a preferred label is permitted by the source. A required display label
    would be an additional application rule.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F05
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L2646
  judgment: Notation uniqueness is a convention rather than an asserted key. Do not report duplicate-code rejection
    as a property of the selected schema without an added rule.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F06
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L2860
  judgment: Editorial and history notes prevent a blanket claim of absent rationale or provenance capability. A
    free note is nevertheless not an explicit typed decision episode with accountable participants.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F07
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L2413
  judgment: Non-transitive here means the transitive conclusion is not licensed, not that a direct shortcut is forbidden.
    The historical broader relation and the current broaderTransitive relation need separate version-aware tests.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F08
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L2484
  judgment: Cycles and alternate paths are permitted in this base model. A no-cycle metric must identify its application-specific
    policy rather than conflate it with SKOS integrity.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F09
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L4261
  judgment: Associative/hierarchical disjointness reaches indirect ancestors. Checking only explicitly adjacent
    pairs would miss the source example involving an inferred path.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F10
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L3551
  judgment: Functional memberList can identify two list resources rather than reject two identifiers. Distinctness
    and malformed-list policies require explicit treatment; no unique-name assumption is licensed.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F11
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L4858
  judgment: exactMatch is not sameAs or class equivalence. Carrying labels and all other properties across a proposed
    alignment would overstate this relation and can generate a label conflict.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F12
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#mapping-cycles-exactMatch
  judgment: Symmetry and transitivity can produce self-links for participants in exactMatch. That does not assert
    universal reflexivity for every resource.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F13
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L5675
  judgment: Do not propagate broader or related links through exactMatch by an unstated composition rule. Keep any
    desired inference as an explicit extension.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F14
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L5739
  judgment: Equal XL literal forms do not identify their label resources. A string-based deduplicator would erase
    distinctions that the model permits.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F15
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L899
  judgment: XL-only consistency and combined SKOS+XL consistency differ. The literal projections can activate core
    label constraints; testing only the extension would miss this boundary.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F16
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#rdf-schema-owl-dl
  judgment: The OWL 1 DL variant is an informative pruning, not an interchangeable complete normative model. Record
    removed commitments before drawing semantic conclusions.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F17
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#namespace
  judgment: 'An unchanged namespace is not proof of unchanged semantics: the historical broader/narrower interpretation
    changed. Pin bytes and edition rather than infer identity from URI alone.'
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F18
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L3260
  judgment: The text names Appendix A for the label extension while the linked target and actual extension are Appendix
    B. Treat the caption as an editorial cross-reference discrepancy, not an ontology defect.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F19
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L2251
  judgment: The domain/range note refers to example 26 and names a third resource absent there. The inference principle
    remains supported elsewhere; preserve the mistaken example pointer without inventing data.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F20
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#L1195
  judgment: The acronym discussion spells the property with the core prefix while the example uses the XL prefix.
    Preserve the distinction when planning artifact correspondence checks.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
- id: F21
  locator: https://www.w3.org/TR/2009/REC-skos-reference-20090818/#hasTopConcept
  judgment: The appendix summary gives hasTopConcept a generic label rather than a descriptive one. Do not promote
    that caption into a definition or repair the source silently.
  basis: REVIEWER_ANALYSIS
  next_issues:
  - 238
  - 253
  - 126
