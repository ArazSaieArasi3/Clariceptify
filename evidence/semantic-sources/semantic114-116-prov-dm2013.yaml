version: W3C Recommendation2013-04-30
locator: Sections5.1.1 Entity,5.1.2 Activity,5.1.3 Generation,5.2.2 Revision
paraphrase: PROV distinguishes activities from entities. Generation marks completion of production of
  a new entity, whereas revision is derivation of a revised entity from an earlier one retaining substantial
  content. This offers a version-specific provenance alternative, not a mandate to equate every edit with
  creation of a new Clariceptify information object. Entity identity depends on selected fixed aspects.
