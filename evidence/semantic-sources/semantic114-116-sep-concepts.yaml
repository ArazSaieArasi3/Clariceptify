paraphrase: Competing accounts identify concepts as mental representations, abilities, or abstract senses.
  Sense-based accounts distinguish meaning from referent and permit meaningful expressions without referents.
  These are alternatives, not interchangeable definitions; the Clariceptify explicit-description sense
  is a bounded engineering choice, not established philosophical consensus.
