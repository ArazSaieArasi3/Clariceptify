paraphrase: Representational theories relate intentional states to representations with content. Different
  attitudes can concern the same content. Section2 presents realism and eliminativist alternatives; section9
  contrasts thought-first accounts of linguistic meaning with reversed or mutual dependency accounts.
  Neither the existence of an expression nor shared reference establishes identical mental states.
