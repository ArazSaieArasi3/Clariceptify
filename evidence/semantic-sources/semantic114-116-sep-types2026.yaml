paraphrase: Type/token distinguishes repeatables from particular occurrences, but neither its uniformity
  nor reduction to universal/particular or set/member is settled. Context can matter to token individuation.
  The distinctions should not be collapsed solely because the same words type and instance occur in a
  model.
