paraphrase: Section2 distinguishes particulars from universals and intrinsic moments dependent on one
  bearer. Section3 contrasts enduring individuals with temporally extended events. Section4 distinguishes
  an intentional moment from its propositional content, and intentions from goals. Its creation case requires
  resource absence in the pre-state and presence in the post-state; change instead concerns an existing
  resource with differing moments. Section4.1 separates an action occurrence, its universal, and a scheduled
  commitment. These motivate separation tests, not automatic equivalence between Clariceptify classes
  and UFO categories. The paper does not independently approve current OntoUML stereotypes or supply the
  project content-equivalence policy.
