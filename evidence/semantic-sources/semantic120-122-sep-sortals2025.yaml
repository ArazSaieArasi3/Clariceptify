paraphrase: Sortal accounts differ over counting, individuation, identity and persistence, and over whether
  sortals are predicates, concepts or properties. Cognitive singling-out is not identical to metaphysical
  individuality. Counting need not supply a complete cross-time identity criterion. Thus a noun or a successful
  identifier registry does not by itself establish a sortal identity principle.
