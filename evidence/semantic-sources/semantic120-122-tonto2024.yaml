paraphrase: The paper includes historical roles and historical role mixins tied to events, distinguishing
  one versus multiple substance-sortals. It also separates single-bearer qualities/modes from multiple-dependent
  relators, and allows a mode to depend externally on entities other than its bearer. Historical role
  typing thus does not require that the originating event remain ongoing.
qualification: Last sentence is application to project SC0004, not a quoted theorem proving every historical
  persistence policy. No historicalRoleMixin equivalence or full profile validation inferred.
