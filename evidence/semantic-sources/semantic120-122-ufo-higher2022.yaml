paraphrase: The extension permits types themselves to instantiate types, distinguishing individuals from
  types and first-order from higher-order and orderless classification. Specialization and instantiation
  are different relations. Higher-order Model Kind must therefore be interpreted with a declared level
  discipline, rather than assuming an individual model and a type of models are interchangeable. Section4.1
  defines instantiation associations between base types and higher-order types, with isPowertype distinguishing
  powertype from categorization.
