paraphrase: This version makes rigidity modal and requires a unique ultimate kind under its foundational
  assumptions. Sortals inherit one identity principle; non-sortals collect instances across principles.
  Category is rigid and mixin semi-rigid. The revised profile applies sortal/non-sortal distinctions to
  moments as well as substantials, permitting mode subkinds. RoleMixin is externally dependent and anti-rigid.
  These axioms belong to a selected UFO theory; author-reported prover results have not been reproduced
  here.
