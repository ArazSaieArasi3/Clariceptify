- id: CLR-SC0013
  text: 'Change and time. Each modeled Change is atomic relative to the chosen granularity:
    its prior and resulting State differ in at least one relevant feature and concern
    the affected objects. Time supplies a declared ordering/extent convention; the
    states and event extents must respect the transition.'
