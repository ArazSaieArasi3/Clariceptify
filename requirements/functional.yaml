- id: FR-01
  priority: MUST
  title: Conceptualization and agency
  origin: R
  release_target: R1
  capability: The ontology shall represent conceptualization episodes and the agents
    participating in them.
  acceptance: Identify an episode and its participating conceptualizer.
  adverse_case: Reject an attribution to an agent unrelated to that episode.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-3/data-row-1
  source_cells:
  - 'FR-01  MUST

    Conceptualization and agency

    Origin R | R1'
  - The ontology shall represent conceptualization episodes and the agents participating
    in them.
  - 'AC: Identify an episode and its participating conceptualizer.

    NAC: Reject an attribution to an agent unrelated to that episode.'
  satisfaction_status: not_assessed
  acceptance_status: not_assessed
  test_execution: not_executed
- id: FR-02
  priority: MUST
  title: Subjects of conceptualization
  origin: R
  release_target: R1
  capability: The ontology shall distinguish object, event, state and type subjects
    without treating their descriptions as their referents.
  acceptance: Retrieve a subject through its declared subject category.
  adverse_case: Reject an episode with no subject across the allowed subject branches.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-3/data-row-2
