- id: LR-07
  priority: SHOULD
  title: Alternatives and decision consequences
  origin: I
  release_target: R2 candidate
  capability: The ontology should support explicit links among considered conceptual
    alternatives, a chosen option and later observed consequences when needed.
  acceptance: Retain a rejected alternative and distinguish choosing it from realizing
    or evaluating its outcome.
  adverse_case: A decision rationale is taken as evidence that the chosen option succeeded.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-7/data-row-7
