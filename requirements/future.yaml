- id: LR-06
  priority: SHOULD
  title: Domain adequacy contracts
  origin: I
  release_target: R2 candidate
  capability: Each selected domain should receive purpose-specific competency questions
    and examples sufficient to assess its contribution to conceptualization.
  acceptance: Demonstrate necessary distinctions and paths for Ontology, Knowledge
    and other small domains before proposing focused additions.
  adverse_case: A minimum count such as four concepts is substituted for adequacy
    evidence.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-7/data-row-6
