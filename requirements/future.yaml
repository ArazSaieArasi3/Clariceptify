- id: LR-05
  priority: SHOULD
  title: Quality measurement and comparability
  origin: I
  release_target: R2 candidate
  capability: The ontology should qualify operational quality assessments by rubric,
    scale, method and assessment context when measurement is required.
  acceptance: Two results are compared only after their criteria and measurement conditions
    are shown compatible.
  adverse_case: Equal scores on different scales are treated as equivalent quality.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-7/data-row-5
