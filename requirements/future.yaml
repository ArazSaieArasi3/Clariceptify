requirements:
- id: LR-01
  priority: SHOULD
  title: Content identity and revision lineage
  origin: I
  release_target: R2 candidate
  capability: The ontology should support an explicit policy for content equivalence,
    artifact revision and stable historical references.
  acceptance: Two files with equivalent content and two revisions with changed content
    remain distinguishable under the chosen identity policy.
  adverse_case: Equal labels or file hashes alone determine conceptual identity.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-7/data-row-1
  source_cells:
  - 'LR-01  SHOULD

    Content identity and revision lineage

    Origin I | R2 candidate'
  - The ontology should support an explicit policy for content equivalence, artifact
    revision and stable historical references.
  - 'AC: Two files with equivalent content and two revisions with changed content
    remain distinguishable under the chosen identity policy.

    NAC: Equal labels or file hashes alone determine conceptual identity.'
  satisfaction_status: not_assessed
  acceptance_status: not_assessed
  test_execution: not_executed
- id: LR-02
  priority: SHOULD
  title: Assertion context and competing accounts
  origin: I
  release_target: R2 candidate
  capability: The ontology should qualify incompatible conceptual assertions by their
    adopting agent, artifact, assumptions and context.
  acceptance: Two conflicting descriptions can be retained as attributed accounts
    without asserting both as unqualified world facts.
  adverse_case: Incompatible source statements are merged or automatically treated
    as a contradiction in reality.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-7/data-row-2
