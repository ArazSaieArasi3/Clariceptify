- id: LR-08
  priority: SHOULD
  title: Evidence stance and uncertainty
  origin: I
  release_target: R2 candidate
  capability: The ontology should distinguish supporting, challenging and limiting
    evidence and the uncertainty attached to conceptual claims.
  acceptance: Preserve a source that challenges a claim without converting its citation
    into support; keep missing confidence unspecified.
  adverse_case: Source count is treated as truth or unknown confidence is assigned
    zero.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-7/data-row-8
