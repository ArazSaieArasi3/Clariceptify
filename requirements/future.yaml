    NAC: Incompatible source statements are merged or automatically treated as a contradiction
    in reality.'
  satisfaction_status: not_assessed
  acceptance_status: not_assessed
  test_execution: not_executed
- id: LR-03
  priority: SHOULD
  title: Temporal validity of conceptual claims
  origin: I
  release_target: R2 candidate
  capability: The ontology should distinguish represented validity time from recording
    time and revision time where the intended question requires it.
  acceptance: A claim recorded later about an earlier interval retains both temporal
    roles.
  adverse_case: A record timestamp is substituted for the period described by the
    claim.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-7/data-row-3
