  test_execution: not_executed
- id: LR-04
  priority: SHOULD
  title: Incomplete and tacit conceptualization
  origin: I
  release_target: R2 candidate
  capability: The specification should define a boundary policy for unfinished, tacit
    or unarticulated conceptualization.
  acceptance: Choose whether such episodes are outside R1 or modeled by a justified
    extension; retain the reason.
  adverse_case: The R1 explicit-artifact assumption is silently removed or claimed
    universal for all cognition.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-7/data-row-4
