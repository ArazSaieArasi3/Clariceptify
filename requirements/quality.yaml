- id: QR-08
  priority: MUST
  title: Testable answer contracts
  origin: I
  release_target: R1
  capability: Each competency question shall specify input, output fields, positive
    and adverse expectations, and missing-data treatment.
  acceptance: Execute positive, missing-link and misleading-link variants with version-pinned
