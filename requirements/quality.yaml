- id: QR-04
  priority: MUST
  title: Meaningful connectivity
  origin: E
  release_target: R1
  capability: The model shall contain no isolated concept or disconnected conceptual
    group and shall justify the contribution of each connection.
  acceptance: Check one connected component and review meaningful paths to conceptualization;
    include inherited paths explicitly.
  adverse_case: Artificial generic edges are added only to obtain a connected graph.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-4/data-row-4
