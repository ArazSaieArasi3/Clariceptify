- id: QR-06
  priority: MUST
  title: Definitions and evidence provenance
  origin: R
  release_target: R1
  capability: Each concept shall have an English definition, UFO type, OntoUML stereotype
    and primary domain, with source status stated.
  acceptance: Distinguish scoped author definitions from quotations and externally
    grounded definitions.
  adverse_case: A reconstructed definition is presented as a verbatim literature definition
    without evidence.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-4/data-row-6
