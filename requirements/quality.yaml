- id: QR-03
  priority: MUST
  title: Foundational and notation consistency
  origin: R
  release_target: R1
  capability: The ontology shall use justified UFO distinctions and valid OntoUML
    class and relation notation.
  acceptance: Review identity providers, rigidity, modes and qualities, endpoint categories
    and higher-order typing; document unresolved issues.
  adverse_case: A permitted stereotype spelling is accepted as sufficient evidence
    of semantic correctness.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-4/data-row-3
