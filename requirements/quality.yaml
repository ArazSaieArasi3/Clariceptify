- id: QR-09
  priority: MUST
  title: Readable and faithful visualization
  origin: E
  release_target: R1
  capability: The delivered visual model shall preserve names, stereotypes, association
    labels, end multiplicities, correct generalization arrows and domain colours.
  acceptance: Check exact model-to-figure parity; provide a domain definition and
    colour guide and readable detail views.
  adverse_case: Generalizations receive multiplicities or arrows point from a parent
    to its subtype.
