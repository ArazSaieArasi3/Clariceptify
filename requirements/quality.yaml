- id: QR-05
  priority: MUST
  title: Constraint adequacy
  origin: R
  release_target: R1
  capability: The release specification shall retain explicit integrity and interpretation
    constraints beyond binary links.
  acceptance: Carry all 24 current constraints into the later review plan and test
    cross-relation alignment.
  adverse_case: Graph connectivity is substituted for satisfiability or consistency
    testing.
