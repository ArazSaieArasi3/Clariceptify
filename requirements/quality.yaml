- id: QR-10
  priority: MUST
  title: Bounded release and validation claims
  origin: E
  release_target: R1
  capability: Claims of adequacy and validation shall identify scope, model version,
    method, evidence and unresolved limitations.
  acceptance: Separate structural checks, CQ execution and expert validation; schedule
    domain adequacy for R2 without a fixed minimum class count.
  adverse_case: A structural pass is reported as complete ontological or stakeholder
    validation.
