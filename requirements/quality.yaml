- id: QR-01
  priority: MUST
  title: Scope fidelity
  origin: E
  release_target: R1
  capability: The specification shall keep conceptualization as the central subject
    and preserve the selected domain names.
  acceptance: No new engineering or application domain is introduced; one-concept
    Ontology and Knowledge domains remain allowed in R1.
  adverse_case: A domain is expanded solely to meet an arbitrary concept quota.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-4/data-row-1
