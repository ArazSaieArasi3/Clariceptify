    the selected domain names.
  - 'AC: No new engineering or application domain is introduced; one-concept Ontology
    and Knowledge domains remain allowed in R1.

    NAC: A domain is expanded solely to meet an arbitrary concept quota.'
  satisfaction_status: not_assessed
  acceptance_status: not_assessed
  test_execution: not_executed
- id: QR-02
  priority: MUST
  title: Baseline preservation
  origin: E
  release_target: R1
  capability: The release package shall identify its exact concept and relationship
    baseline and record every subsequent change.
  acceptance: Reconcile catalogues and diagrams against 137 concepts and 296 relationship
    rows for this baseline; changes have a recorded reason.
  adverse_case: A class, association, stereotype or multiplicity changes without a
    change record.
  source_locator: SRC-ORSD@sha256:d635edf4650eaee252fb8024f7e4d62b55e127c0711146af8891869cf4a9f0e1#table-4/data-row-2
